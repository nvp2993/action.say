    body, #app {

    header.bg-slate-900 {

    /* Khung chọn tháng & nút trên Header */

      border-radius: 9999px !important;

    header button.text-slate-300 {
      color: #64748b !important;

    function isExcelImportedRow(sh) {
      if (!sh) return false;
      const m = String(sh.id || '').match(/^sh_xl_(\d+)$/);

      return false;

    function normalizeShowsCreatorList(list = []) {
      return (list || []).map(sh => {

    function mergeShowsWithLocalEdits(remoteShows = []) {
      const deletedSet = new Set(state.localDeletedShowIds || []);
      const editsMap = state.localShowEditsMap || {};
      const mergedMap = new Map();

      normalizeShowsCreatorList(remoteShows).forEach(sh => {
        if (!sh || !sh.id || deletedSet.has(sh.id)) return;
        const localEdit = editsMap[sh.id];
        if (localEdit && (Number(localEdit.updatedAt) || 0) >= (Number(sh.updatedAt) || 0)) {
          mergedMap.set(sh.id, localEdit);
        } else {
          mergedMap.set(sh.id, sh);
        }
      });

      Object.keys(editsMap).forEach(id => {
        if (!deletedSet.has(id) && !mergedMap.has(id)) {
          mergedMap.set(id, editsMap[id]);
        }
      });

      return Array.from(mergedMap.values());
    }

    // WOW 32: Âm thanh hiệu triệu Web Audio (0 KB)
    function playStudioSound(type = 'noshow') {
      if (!state.soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'noshow') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          osc.frequency.setValueAtTime(1046.5, now + 0.24);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now); osc.stop(now + 0.45);
        } else if (type === 'lum') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(987.77, now);
          osc.frequency.setValueAtTime(1318.5, now + 0.09);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        }
      } catch (e) {}
    }

    function getMyTopTeammate(userId, monthNum) {
      const counts = {};
      state.shows.forEach(sh => {
        if (!sh.startDate || parseInt(sh.startDate.split('-')[1], 10) !== monthNum) return;
        const mems = sh.memberIds || [];
        if (!mems.includes(userId)) return;
        mems.forEach(mid => {
          if (mid !== userId) counts[mid] = (counts[mid] || 0) + 1;
        });
      });
      let bestId = null, maxCnt = 0;
      Object.entries(counts).forEach(([id, c]) => { if (c > maxCnt) { maxCnt = c; bestId = id; } });
      return bestId ? { member: getMember(bestId), count: maxCnt } : null;
    }

      let gearTip = 'Kiểm tra pin, thẻ nhớ & thiết bị';

      else if (roles.some(r => r.includes('Quay'))) gearTip = '🎥 Sạc pin máy quay + Gimbal, format thẻ nhớ trống';

      const checkedIn = !!(target.checkIns && target.checkIns[userId]);

    function parseExcelDateCell(val, defaultYear = 2026) {
      if (!val && val !== 0) return '';
      if (typeof val === 'number') {
        const utcDays = Math.floor(val - 25569);
        const d = new Date(utcDays * 86400 * 1000);
        if (!isNaN(d)) {
          const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
          const dd = String(d.getUTCDate()).padStart(2, '0');
          return `${defaultYear}-${mm}-${dd}`;
        }
      }
      const s = String(val).trim();
      const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?$/);
      if (m) {
        const dd = String(parseInt(m[1], 10)).padStart(2, '0');
        const mm = String(parseInt(m[2], 10)).padStart(2, '0');
        return `${defaultYear}-${mm}-${dd}`;
      }
      return '';
    }

    function parseMemberIdsFromCell(str = '') {
      if (!str) return [];
      const upper = String(str).toUpperCase();
      const matched = [];
      state.members.forEach(m => {
        if (upper.includes(m.shortLabel.toUpperCase()) || upper.includes(m.name.toUpperCase())) {
          matched.push(m.id);
        }
      });
      return matched;
    }

    function getMatrixData() {
      const daysInMonth = new Date(state.selectedYear, state.selectedMonth, 0).getDate();
      const matrix = {};
      for (let d = 1; d <= daysInMonth; d++) {
        matrix[d] = {};
        state.members.forEach(m => { matrix[d][m.id] = []; });
      }
      state.shows.forEach(sh => {
        if (!sh.startDate || !sh.endDate) return;
        const start = new Date(sh.startDate + 'T00:00:00');
        const end = new Date(sh.endDate + 'T00:00:00');
        if (isNaN(start) || isNaN(end)) return;
        for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
          if (dt.getFullYear() === state.selectedYear && (dt.getMonth() + 1) === state.selectedMonth) {
            const day = dt.getDate();
            if (matrix[day]) {
              (sh.memberIds || []).forEach(mid => {
                if (matrix[day][mid]) matrix[day][mid].push(sh);
              });
            }
          }
        }
      });
      return { daysInMonth, matrix };
    }

      downloadFolderScript(showId, osType = 'win') {
        const sh = state.shows.find(s => s.id === showId);
        if (!sh) return;
        const slug = (str) => String(str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_|_$/g, '');
        const rootFolder = `${sh.startDate}_${slug(sh.location)}${sh.partner ? '_' + slug(sh.partner) : ''}`;
        const subFolders = ['01_Project_Premiere_CapCut', '02_Audio_Music', '03_Graphics_Logo', '04_Export_Final'];
        (sh.memberIds || []).forEach((mid, idx) => {
          const m = getMember(mid);
          const r = Array.isArray(sh.roles?.[mid]) ? sh.roles[mid].join('_') : (sh.roles?.[mid] || 'Cam');
          subFolders.unshift(`00_Footage_${String(idx + 1).padStart(2, '0')}_${slug(r)}_${slug(m.name)}`);
        });
        let content = '';
        let fileName = '';
        if (osType === 'win') {
          content = '@echo off\r\nchcp 65001 >nul\r\n' + subFolders.map(sf => `mkdir "${rootFolder}\\${sf}"`).join('\r\n') + '\r\necho Da tao xong cay thu muc dung phim!\r\npause';
          fileName = `Tao_Thu_Muc_${rootFolder}.bat`;
        } else {
          content = '#!/bin/bash\ncd "$(dirname "$0")"\n' + subFolders.map(sf => `mkdir -p "${rootFolder}/${sf}"`).join('\n') + '\necho "Da tao xong cay thu muc dung phim!"';
          fileName = `Tao_Thu_Muc_${rootFolder}.command`;
        }
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = fileName; a.click();
        URL.revokeObjectURL(url);
        showToast(`💻 Đã tải script tạo thư mục (${osType === 'win' ? 'Windows' : 'MacBook'})!`);
      },

      async saveShowForm() {
        const f = state.formModal;
        if (!f) return;
        const locClean = String(f.location || '').trim();
        const partClean = String(f.partner || '').trim();
        const noteClean = String(f.note || '').trim();
        if (!locClean) {
          f.error = 'Vui lòng nhập Địa điểm / Thông tin show!';
          renderApp();
          return;
        }
        if (!Array.isArray(f.memberIds) || f.memberIds.length === 0) {
          f.error = 'Vui lòng chọn ít nhất 1 nhân sự!';
          renderApp();
          return;
        }
        const finalEnd = (!f.endDate || f.endDate < f.startDate) ? f.startDate : f.endDate;

        if (f.mode === 'edit') {
          const existing = state.shows.find(s => s.id === f.showId);
          if (!existing) {
            state.formModal = null;
            renderApp();
            return;
          }
          const finalOwnerId = f.ownerId || existing.ownerId || state.currentUserId;
          const finalCreatorId = f.creatorId || existing.creatorId || finalOwnerId;
          const updated = {
            ...existing,
            partner: partClean,
            hidePartner: !!f.hidePartner,
            location: locClean,
            startDate: f.startDate,
            endDate: finalEnd,
            rawEndDate: finalEnd,
            memberIds: [...f.memberIds],
            roles: f.roles || {},
            postStatus: f.postStatus || 'pending',
            ownerId: finalOwnerId,
            ownerLabel: getMember(finalOwnerId)?.name || '',
            creatorId: finalCreatorId,
            color: f.color || getAutoHighlightColor(locClean, partClean),
            note: noteClean
          };
          recordLocalShowUpsert(updated);
          state.shows = state.shows.map(s => s.id === updated.id ? updated : s);
          saveShowsToLocalBackup();
          state.formModal = null;
          renderApp();
          showToast('✅ Đã lưu chỉnh sửa & đồng bộ vĩnh viễn!');
          if (db) {
            try {
              await window.syncShowsToSingleDoc();
            } catch (e) {
              console.error('Lỗi lưu chỉnh sửa lên Cloud:', e);
            }
          }
        } else {
          const nextStt = state.shows.length > 0 ? Math.max(...state.shows.map(s => Number(s.stt) || 300)) + 1 : 301;
          const finalOwnerId = f.ownerId || state.currentUserId;
          const finalCreatorId = f.creatorId || state.currentUserId;
          const newShow = {
            id: 'sh_new_' + Date.now(),
            stt: nextStt,
            partner: partClean,
            hidePartner: !!f.hidePartner,
            location: locClean,
            startDate: f.startDate,
            endDate: finalEnd,
            rawEndDate: finalEnd,
            memberIds: [...f.memberIds],
            roles: f.roles || {},
            postStatus: 'pending',
            ownerId: finalOwnerId,
            creatorId: finalCreatorId,
            ownerLabel: getMember(finalOwnerId)?.name || '',
            color: f.color || getAutoHighlightColor(locClean, partClean),
            note: noteClean
          };
          recordLocalShowUpsert(newShow);
          state.shows.push(newShow);
          saveShowsToLocalBackup();
          const createdMonth = parseInt(f.startDate.split('-')[1], 10);
          if (createdMonth >= 6 && createdMonth <= 12) state.selectedMonth = createdMonth;
          state.formModal = null;
          renderApp();
          playStudioSound('noshow'); showToast('🎉 Đã NỔ SHOW mới & lưu vào 1-Document!');
          if (db) {
            try { await window.syncShowsToSingleDoc(); } catch (e) {}
          }
        }

          'ACTION:DISPLAY',

          'END:VALARM',
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

      handleCustomLogoUpload(event) {
        if (!state.isAdminMode) return;
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = async () => {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            let finalDataUrl = reader.result;
            if (ctx) {
              ctx.clearRect(0, 0, 512, 512);
              ctx.drawImage(img, 0, 0, 512, 512);
              try {
                finalDataUrl = canvas.toDataURL('image/png');
                if (finalDataUrl.length > 750000) finalDataUrl = canvas.toDataURL('image/jpeg', 0.92);
              } catch (e) {}
            }
            state.customLogoUrl = finalDataUrl;
            try { localStorage.setItem('as_custom_logo_2026', finalDataUrl); } catch (e) {}
            applyHomeScreenIcon(state.customLogoUrl);
            renderApp();
            showToast('Đã cập nhật & lưu vĩnh viễn Logo App!');
            if (db) {
              try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'member_pins', 'app_branding'), {
                  customLogoUrl: finalDataUrl,
                  updatedAt: Date.now()
                });
              } catch (e) {}
            }
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
        event.target.value = '';
      },
      async handleDirectExcelFile(event) {
        if (!state.isAdminMode) return;
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          const data = await file.arrayBuffer();
          const workbook = XLSX.read(data, { type: 'array' });
          const sheetName = workbook.SheetNames.find(n => n.toUpperCase().includes('LỊCH SHOW') || n.toUpperCase().includes('LICH SHOW')) || workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

          const imported = [];
          for (let i = 2; i < rows.length; i++) {
            const r = rows[i];
            if (!r || r.length === 0) continue;
            const sttRaw = r[0];
            const partner = String(r[1] || '').trim();
            const location = String(r[2] || '').trim();
            const startStr = parseExcelDateCell(r[3], 2026);
            const endStr = parseExcelDateCell(r[4], 2026) || startStr;
            const memIds = parseMemberIdsFromCell(r[5]);
            const ownerLabel = String(r[6] || '').trim();

            if (!location && !partner && memIds.length === 0 && !startStr) continue;
            const sttNum = Number(sttRaw) || (i - 1);
            const finalStart = startStr || '2026-06-01';
            const finalEnd = endStr && endStr >= finalStart ? endStr : finalStart;

            const resolvedOwner = resolveOwnerIdFromName(ownerLabel, memIds);
            imported.push({
              id: `sh_xl_${i + 1}`,
              stt: sttNum,
              partner,
              location: location || partner || 'Show',
              startDate: finalStart,
              endDate: finalEnd,
              rawEndDate: endStr || finalStart,
              memberIds: memIds,
              roles: {},
              postStatus: 'pending',
              ownerId: resolvedOwner,
              creatorId: resolvedOwner,
              ownerLabel,
              color: getAutoHighlightColor(location, partner),
              note: ''
            });
          }

          if (imported.length > 0) {
            state.shows = imported;
            saveShowsToLocalBackup();
            state.filterAllMonthsInList = true;
            renderApp();
            showToast(`Đã nạp ${imported.length} dòng từ file "${file.name}"!`);
            if (state.user && db) {
              const showsCol = collection(db, 'artifacts', appId, 'public', 'data', 'shows');
              const snap = await getDocs(showsCol);
              await Promise.all(snap.docs.map(d => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shows', d.id))));
              await Promise.all(imported.map(sh => setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shows', sh.id), sh)));
            }
          }
        } catch (err) {
          showToast('Lỗi đọc file Excel: ' + err.message, 'error');
        }
        event.target.value = '';
      },
      downloadSingleHtmlFile() {
        if (!state.isAdminMode) return;
        const clonedDoc = document.documentElement.cloneNode(true);
        clonedDoc.querySelectorAll('[data-bard-client-injected="true"]').forEach(el => el.remove());
        const oldBaked = clonedDoc.querySelector('#baked-data-script');
        if (oldBaked) oldBaked.remove();

        const bakedScript = document.createElement('script');
        bakedScript.id = 'baked-data-script';
        bakedScript.textContent = `
          window.__BAKED_SHOWS_DATA__ = ${JSON.stringify(state.shows)};
          window.__BAKED_MEMBERS_DATA__ = ${JSON.stringify(state.members)};
          window.__BAKED_PINS_DATA__ = ${JSON.stringify(state.pinsMap)};
          window.__BAKED_CUSTOM_LOGO__ = ${JSON.stringify(state.customLogoUrl)};
          window.__BAKED_OWNER_FINANCE__ = ${JSON.stringify(state.ownerFinanceMap)};
        `;
        const headEl = clonedDoc.querySelector('head');
        if (headEl) headEl.insertBefore(bakedScript, headEl.firstChild);

        const htmlContent = '<!DOCTYPE html>\n' + clonedDoc.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(`Đã tải file index.html nhúng sẵn ${state.shows.length} dòng lịch!`);
      }
    };

    // ========================================================================
    // LOGIC TAB TÍNH CÔNG TÁC PHÍ (CTP) + POPUP THÊM SHOW NGOÀI CUỐI DANH SÁCH
    // ========================================================================
    let ctpCloudSyncTimer = null;
    function saveCtpStateToLocal(immediateCloud = false) {
      state.ctpLastUpdatedAt = Date.now();
      try {
        localStorage.setItem('as_ctp_items_2026', JSON.stringify(state.ctpItems));
        localStorage.setItem('as_ctp_custom_shows_2026', JSON.stringify(state.ctpCustomShows));
      } catch (e) {}
      if (db && state.currentUserId) {
        if (ctpCloudSyncTimer) clearTimeout(ctpCloudSyncTimer);
        const pushCtp = async () => {
          try {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'user_ctp_data', state.currentUserId), {
              items: state.ctpItems,
              customShows: state.ctpCustomShows || [],
              updatedAt: state.ctpLastUpdatedAt
            });
          } catch (e) {}
        };
        if (immediateCloud) pushCtp();
        else ctpCloudSyncTimer = setTimeout(pushCtp, 600);
      }
    }

    function getShowDays(sh) {
      if (!sh || !sh.startDate || !sh.endDate) return 1;
      const s = new Date(sh.startDate + 'T00:00:00');
      const e = new Date(sh.endDate + 'T00:00:00');
      const diffTime = e - s;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
      return diffDays > 0 ? diffDays : 1;
    }

    function findAnyCtpShow(showId) {
      return state.shows.find(s => s.id === showId) || (state.ctpCustomShows || []).find(s => s.id === showId);
    }

    function getCombinedCtpShows() {
      const regularShows = state.shows
        .filter(sh => {
          if (!sh.startDate) return false;
          const m = parseInt(sh.startDate.split('-')[1], 10);
          if (m !== state.ctpMonth) return false;
          if (!(sh.memberIds || []).includes(state.currentUserId)) return false;
          if (state.ctpOwnerId !== 'all' && sh.ownerId !== state.ctpOwnerId) return false;
          return true;
        })
        .sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));

      // Các show tự note ngoài lịch luôn được xếp nối tiếp ở CUỐI danh sách theo thứ tự tạo
      const customShows = (state.ctpCustomShows || []).filter(sh => {
        if (sh.userId && sh.userId !== state.currentUserId) return false;
        if (!sh.startDate) return Number(sh.ctpMonth) === state.ctpMonth;
        const m = parseInt(sh.startDate.split('-')[1], 10);
        if (m !== state.ctpMonth) return false;
        if (state.ctpOwnerId !== 'all' && sh.ownerId !== state.ctpOwnerId) return false;
        return true;
      });

      return [...regularShows, ...customShows];
    }

    function getDefaultRateForTask(taskKey, sh) {
      const days = getShowDays(sh);
      if (taskKey === 'quay' || taskKey === 'chup') {
        return days === 1 ? 1500000 : 1200000 * days;
      }
      if (taskKey === 'dung') return 1000000;
      if (taskKey === 'lamhinh') return 300000;
      if (taskKey === 'flycam') return 1000000;
      if (taskKey === 'gimbal') return 200000;
      return 0;
    }

    function refreshCtpTotalsLive(showId) {
      const item = state.ctpItems[showId] || { tasks: {}, extras: [] };
      let showSubTotal = 0;
      Object.values(item.tasks || {}).forEach(v => showSubTotal += (Number(v) || 0));
      (item.extras || []).forEach(ex => showSubTotal += (Number(ex.amount) || 0));

      const showTotalEl = document.getElementById(`ctp-show-total-${showId}`);
      if (showTotalEl) {
        showTotalEl.textContent = showSubTotal.toLocaleString('vi-VN') + 'đ';
      }

      const filteredShows = getCombinedCtpShows();
      let totalGrandSum = 0;
      filteredShows.forEach(sh => {
        const it = state.ctpItems[sh.id] || { tasks: {}, extras: [] };
        Object.values(it.tasks || {}).forEach(v => totalGrandSum += (Number(v) || 0));
        (it.extras || []).forEach(ex => totalGrandSum += (Number(ex.amount) || 0));
      });

      const grandTotalEl = document.getElementById('ctp-grand-total-display');
      if (grandTotalEl) {
        grandTotalEl.textContent = totalGrandSum.toLocaleString('vi-VN') + 'đ';
      }
    }

    window.ctpActions = {
      setMonth(m) {
        state.ctpMonth = Number(m);
        renderApp();
      },
      setOwner(ownerId) {
        state.ctpOwnerId = ownerId;
        renderApp();
      },
      openAddCustomShowModal() {
        const now = new Date();
        const mm = String(state.ctpMonth).padStart(2, '0');
        const dd = (now.getMonth() + 1) === state.ctpMonth ? String(now.getDate()).padStart(2, '0') : '15';
        const defaultDate = `${state.selectedYear}-${mm}-${dd}`;
        const defaultOwner = state.ctpOwnerId !== 'all' ? state.ctpOwnerId : state.currentUserId;
        state.ctpAddShowModal = {
          mode: 'add',
          showId: null,
          location: '',
          partner: '',
          syncToSchedule: true,
          startDate: defaultDate,
          endDate: defaultDate,
          ownerId: defaultOwner,
          error: ''
        };
        renderApp();
      },
      openEditCustomShowModal(showId) {
        const sh = (state.ctpCustomShows || []).find(s => s.id === showId);
        if (!sh) return;
        state.ctpAddShowModal = {
          mode: 'edit',
          showId: sh.id,
          location: sh.location || '',
          partner: sh.partner || '',
          syncToSchedule: !!sh.syncedScheduleId,
          startDate: sh.startDate,
          endDate: sh.endDate || sh.startDate,
          ownerId: sh.ownerId || state.currentUserId,
          error: ''
        };
        renderApp();
      },
      closeAddCustomShowModal() {
        state.ctpAddShowModal = null;
        renderApp();
      },
      toggleCustomModalSync() {
        if (!state.ctpAddShowModal) return;
        state.ctpAddShowModal.syncToSchedule = !state.ctpAddShowModal.syncToSchedule;
        renderApp();
      },
      updateCustomModalField(field, val) {
        const m = state.ctpAddShowModal;
        if (!m) return;
        m[field] = val;
        if (field === 'startDate' && (!m.endDate || m.endDate < val)) {
          m.endDate = val;
          renderApp();
        }
      },
      async submitCustomShowModal() {
        const m = state.ctpAddShowModal;
        if (!m) return;
        if (!m.location || !m.location.trim()) {
          m.error = 'Vui lòng nhập Địa điểm / Tên Show ngoài!';
          renderApp();
          return;
        }
        const finalStart = m.startDate;
        const finalEnd = (!m.endDate || m.endDate < finalStart) ? finalStart : m.endDate;
        const monthNum = parseInt(finalStart.split('-')[1], 10) || state.ctpMonth;

        if (m.mode === 'edit' && m.showId) {
          const sh = (state.ctpCustomShows || []).find(s => s.id === m.showId);
          if (sh) {
            sh.location = m.location.trim();
            sh.partner = (m.partner || '').trim();
            sh.hidePartner = true;
            sh.startDate = finalStart;
            sh.endDate = finalEnd;
            sh.ownerId = m.ownerId;
            sh.ctpMonth = monthNum;

            const item = state.ctpItems[sh.id];
            if (item && item.tasks) {
              if (item.tasks['quay'] !== undefined) item.tasks['quay'] = getDefaultRateForTask('quay', sh);
              if (item.tasks['chup'] !== undefined) item.tasks['chup'] = getDefaultRateForTask('chup', sh);
            }

            if (sh.syncedScheduleId) {
              const linked = state.shows.find(s => s.id === sh.syncedScheduleId);
              if (linked) {
                linked.location = sh.location;
                linked.partner = sh.partner;
                linked.hidePartner = true;
                linked.startDate = finalStart;
                linked.endDate = finalEnd;
                linked.rawEndDate = finalEnd;
                saveShowsToLocalBackup();
                if (state.user && db) {
                  try { await window.syncShowsToSingleDoc(); } catch (e) {}
                }
              }
            }
          }
          state.ctpAddShowModal = null;
          saveCtpStateToLocal();
          renderApp();
          showToast('✅ Đã cập nhật thông tin Show ngoài lịch!');
        } else {
          // Nếu bật báo lịch chung (mặc định bật): đẩy lên Lịch Show chung với chế độ ẨN ĐỐI TÁC (chỉ mình người tạo thấy đối tác, anh em khác chỉ thấy lịch & địa điểm)
          if (m.syncToSchedule) {
            const nextStt = state.shows.length > 0 ? Math.max(...state.shows.map(s => Number(s.stt) || 300)) + 1 : 301;
            const schedId = 'sh_ext_' + Date.now();
            const newSchedShow = {
              id: schedId,
              stt: nextStt,
              partner: (m.partner || '').trim(),
              hidePartner: false,
              location: m.location.trim(),
              startDate: finalStart,
              endDate: finalEnd,
              rawEndDate: finalEnd,
              memberIds: [state.currentUserId],
              roles: {},
              postStatus: 'pending',
              ownerId: m.ownerId,
              creatorId: state.currentUserId,
              ownerLabel: getMember(m.ownerId)?.name || '',
              color: getAutoHighlightColor(m.location.trim(), ''),
              note: ''
            };
            recordLocalShowUpsert(newSchedShow);
            state.shows.push(newSchedShow);
            saveShowsToLocalBackup();
            state.ctpItems[schedId] = { tasks: {}, extras: [] };
            state.ctpMonth = monthNum;
            state.selectedMonth = monthNum;
            state.ctpAddShowModal = null;
            saveCtpStateToLocal();
            renderApp();
            showToast('🔒 Đã ghi lịch & địa điểm (Đối tác đã được ẩn riêng cho bạn)!');
            if (db) {
              try { await window.syncShowsToSingleDoc(); } catch (e) {}
            }
          } else {
            const newId = 'ctp_ext_' + Date.now();
            const newCustomShow = {
              id: newId,
              isCustomCtp: true,
              hidePartner: true,
              createdAt: Date.now(),
              userId: state.currentUserId,
              creatorId: state.currentUserId,
              ctpMonth: monthNum,
              location: m.location.trim(),
              partner: (m.partner || '').trim(),
              startDate: finalStart,
              endDate: finalEnd,
              ownerId: m.ownerId,
              memberIds: [state.currentUserId]
            };
            if (!Array.isArray(state.ctpCustomShows)) state.ctpCustomShows = [];
            state.ctpCustomShows.push(newCustomShow);
            state.ctpItems[newId] = { tasks: {}, extras: [] };
            state.ctpMonth = monthNum;
            state.ctpAddShowModal = null;
            saveCtpStateToLocal();
            renderApp();
            showToast('🎉 Đã thêm Show ngoài xuống cuối danh sách CTP!');
          }
          setTimeout(() => {
            const listEl = document.getElementById('ctp-shows-scroll-list');
            if (listEl) listEl.scrollTo({ top: listEl.scrollHeight, behavior: 'smooth' });
          }, 80);
        }
      },
      removeCustomShow(showId) {
        state.ctpCustomShows = (state.ctpCustomShows || []).filter(s => s.id !== showId);
        delete state.ctpItems[showId];
        saveCtpStateToLocal();
        renderApp();
        showToast('🗑️ Đã xoá show tự note khỏi danh sách CTP!');
      },
      toggleTask(showId, taskKey) {
        if (!state.ctpItems[showId]) state.ctpItems[showId] = { tasks: {}, extras: [] };
        const tasks = state.ctpItems[showId].tasks;
        if (tasks[taskKey] !== undefined) {
          delete tasks[taskKey];
        } else {
          const sh = findAnyCtpShow(showId);
          tasks[taskKey] = getDefaultRateForTask(taskKey, sh);
        }
        saveCtpStateToLocal();
        renderApp();
      },
      handleTaskPriceInput(showId, taskKey, el) {
        if (!state.ctpItems[showId]) state.ctpItems[showId] = { tasks: {}, extras: [] };
        // Chặn tuyệt đối mọi chữ cái & ký tự đặc biệt, chỉ giữ lại chữ số 0-9
        const digitsOnly = String(el.value || '').replace(/\D/g, '');
        const numVal = digitsOnly ? parseInt(digitsOnly, 10) : 0;
        state.ctpItems[showId].tasks[taskKey] = numVal;
        el.value = digitsOnly ? numVal.toLocaleString('vi-VN') : '';
        saveCtpStateToLocal();
        refreshCtpTotalsLive(showId);
      },
      updateTaskPrice(showId, taskKey, el) {
        this.handleTaskPriceInput(showId, taskKey, el);
      },
      addExtraItem(showId) {
        if (!state.ctpItems[showId]) state.ctpItems[showId] = { tasks: {}, extras: [] };
        if (!Array.isArray(state.ctpItems[showId].extras)) state.ctpItems[showId].extras = [];
        state.ctpItems[showId].extras.push({ name: '', amount: '' });
        saveCtpStateToLocal();
        renderApp();
      },
      removeExtraItem(showId, index) {
        if (!state.ctpItems[showId] || !state.ctpItems[showId].extras) return;
        state.ctpItems[showId].extras.splice(index, 1);
        saveCtpStateToLocal();
        renderApp();
      },
      handleExtraAmountInput(showId, index, el) {
        if (!state.ctpItems[showId] || !state.ctpItems[showId].extras) return;
        const digitsOnly = String(el.value || '').replace(/\D/g, '');
        const numVal = digitsOnly ? parseInt(digitsOnly, 10) : 0;
        state.ctpItems[showId].extras[index].amount = numVal;
        el.value = digitsOnly ? numVal.toLocaleString('vi-VN') : '';
        saveCtpStateToLocal();
        refreshCtpTotalsLive(showId);
      },
      saveExtraField(showId, index, field, el) {
        if (!state.ctpItems[showId] || !state.ctpItems[showId].extras) return;
        if (field === 'amount') {
          this.handleExtraAmountInput(showId, index, el);
        } else {
          state.ctpItems[showId].extras[index][field] = el.value;
          saveCtpStateToLocal();
        }
      },
      generateBill() {
        playStudioSound('lum');
        const curMem = getMember(state.currentUserId);
        const filteredShows = getCombinedCtpShows();
        const isSingleOwner = state.ctpOwnerId !== 'all';

        let grandTotal = 0;
        let billLines = [];
        let rows = [];
        const ownerTitle = isSingleOwner ? getMember(state.ctpOwnerId).name : 'Tất cả Chủ Show';
        
        billLines.push(`💰 **BẢNG CTP THÁNG ${state.ctpMonth}/2026**`);
        billLines.push(`👤 Nhân sự: ${curMem.name}`);
        if (isSingleOwner) {
          billLines.push(`📌 Chủ show: ${ownerTitle}`);
        }
        billLines.push(`-----------------------------------`);

        const taskOrder = [
          { key: 'quay', label: 'Quay' },
          { key: 'dung', label: 'Dựng' },
          { key: 'chup', label: 'Chụp' },
          { key: 'lamhinh', label: 'Làm hình' },
          { key: 'flycam', label: 'Flycam' },
          { key: 'gimbal', label: 'Gimbal' }
        ];

        let stt = 0;
        filteredShows.forEach((sh) => {
          const item = state.ctpItems[sh.id] || { tasks: {}, extras: [] };
          const tasks = item.tasks || {};
          let showSum = 0;
          let taskDescList = [];
          let taskBulletsCompact = [];

          taskOrder.forEach(to => {
            if (tasks[to.key] !== undefined) {
              const p = Number(tasks[to.key]) || 0;
              showSum += p;
              taskDescList.push(`- ${to.label}: ${p.toLocaleString('vi-VN')}đ`);
              taskBulletsCompact.push(`- ${to.label}: ${formatCompactMoneyPlain(p)}`);
            }
          });

          const extras = Array.isArray(item.extras) ? item.extras : [];
          let extraDescList = [];
          let extraSum = 0;
          let extraBulletsCompact = [];
          extras.forEach(ex => {
            const amt = Number(ex.amount) || 0;
            if (amt > 0) {
              showSum += amt;
              extraSum += amt;
              const exName = (ex.name || 'Phí khác').trim();
              extraDescList.push(`- Phát sinh (${exName}): ${amt.toLocaleString('vi-VN')}đ`);
              extraBulletsCompact.push(`- ${exName}: ${formatCompactMoneyPlain(amt)}`);
            }
          });

          const days = getShowDays(sh);
          const startDm = formatDayMonth(sh.startDate);
          const endDm = (sh.endDate && sh.endDate !== sh.startDate) ? formatDayMonth(sh.endDate) : '';
          const dateLabel = `${startDm}${endDm ? '-' + endDm : ''}`;
          const ownerObj = getMember(sh.ownerId);
          const locName = (sh.location || 'Show ngoài lịch').trim();
          const showPartnerOnBill = (!sh.hidePartner && !sh.isOutsideNote && !sh.isCustomCtp) ? getVisiblePartnerText(sh) : '';
          const fullLoc = locName + (showPartnerOnBill ? ` (${showPartnerOnBill})` : '') + (sh.isCustomCtp ? ' [Ngoài]' : '');

          if (showSum > 0 || filteredShows.length > 0) {
            stt++;
            grandTotal += showSum;
            rows.push({
              stt,
              startDm,
              endDm,
              dateLabel,
              days,
              location: fullLoc,
              ownerName: ownerObj.name,
              taskBulletsCompact,
              extraBulletsCompact,
              extraSum,
              showSum
            });
          }

          if (showSum > 0) {
            billLines.push(`${stt}. **${locName}${showPartnerOnBill ? ' (' + showPartnerOnBill + ')' : ''}** (${dateLabel})`);
            taskDescList.forEach(td => billLines.push(`   ${td}`));
            extraDescList.forEach(ed => billLines.push(`   ${ed}`));
            billLines.push(`   👉 Tổng show: **${showSum.toLocaleString('vi-VN')}đ**\n`);
          }
        });

        billLines.push(`-----------------------------------`);
        billLines.push(`🔥 **TỔNG CỘNG: ${grandTotal.toLocaleString('vi-VN')} VNĐ**`);

        // Tạo chuỗi TSV chuẩn 6 cột để dán thẳng vào Excel / Google Sheets
        const tsvHeader = ['STT', 'Ngày', 'Show', 'Nhiệm vụ hệ thống', 'Phát sinh', 'Tổng'].join('\t');
        const tsvRows = rows.map(r => [
          r.stt,
          r.dateLabel,
          r.location,
          r.taskBulletsCompact.join(' | ') || '-',
          r.extraBulletsCompact.length > 0 ? r.extraBulletsCompact.join(' | ') : (r.extraSum || 0),
          r.showSum || 0
        ].join('\t'));
        tsvRows.push(['', '', 'TỔNG CỘNG', '', '', grandTotal].join('\t'));
        const tsvText = [tsvHeader, ...tsvRows].join('\n');

        state.ctpBillModal = {
          text: billLines.join('\n'),
          tsvText,
          total: grandTotal,
          rows,
          isSingleOwner,
          memberName: curMem.name,
          ownerTitle,
          month: state.ctpMonth
        };
        renderApp();
      },
      closeBillModal() {
        state.ctpBillModal = null;
        renderApp();
      },
      async captureBillImage() {
        const bm = state.ctpBillModal;
        const target = document.getElementById('ctp-bill-capture-area');
        if (!bm || !target || typeof html2canvas === 'undefined') return;
        showToast('📸 Đang xuất ảnh Biên nhận CTP kèm mã QR...');
        const scrollEl = target.querySelector('.overflow-auto');
        const oldMaxH = target.style.maxHeight;
        const oldOv = scrollEl ? scrollEl.style.overflow : '';
        target.style.maxHeight = 'none';
        if (scrollEl) scrollEl.style.overflow = 'visible';
        try {
          const canvas = await html2canvas(target, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
          target.style.maxHeight = oldMaxH;
          if (scrollEl) scrollEl.style.overflow = oldOv;
          openCapturedImagePreview(
            canvas,
            `BienNhan_CTP_${bm.memberName}_T${bm.month}_2026.png`,
            `Bảng CTP Tháng ${bm.month}/2026 - ${bm.memberName}`
          );
        } catch (e) {
          target.style.maxHeight = oldMaxH;
          if (scrollEl) scrollEl.style.overflow = oldOv;
        }
      },
      copyBillText() {
        const bm = state.ctpBillModal;
        if (!bm) return;
        const el = document.getElementById('ctp-bill-textarea');
        if (el) {
          el.value = bm.text;
          el.select();
          document.execCommand('copy');
        }
        showToast('📋 Đã copy nội dung gửi Zalo!');
      },
      copyExcelTable() {
        const bm = state.ctpBillModal;
        if (!bm) return;
        const el = document.getElementById('ctp-bill-textarea');
        if (el) {
          el.value = bm.tsvText;
          el.select();
          document.execCommand('copy');
        }
        showToast('📊 Đã copy dạng Bảng! Mở Excel / Google Sheets bấm Ctrl+V là vào đúng từng ô.');
      },
      exportBillExcelFile() {
        const bm = state.ctpBillModal;
        if (!bm || typeof XLSX === 'undefined') return;
        const headerRow = ['STT', 'Ngày', 'Show', 'Nhiệm vụ hệ thống', 'Phát sinh', 'Tổng (VNĐ)'];

        const wsData = [
          [`BẢNG CTP THÁNG ${bm.month}/2026`],
          [`Nhân sự: ${bm.memberName}`, '', `Chủ show: ${bm.ownerTitle}`],
          [],
          headerRow
        ];
        bm.rows.forEach(r => {
          wsData.push([
            r.stt,
            r.dateLabel,
            r.location + (!bm.isSingleOwner ? ` [${r.ownerName}]` : ''),
            r.taskBulletsCompact.join('\n') || '-',
            r.extraBulletsCompact.length > 0 ? r.extraBulletsCompact.join('\n') : '',
            r.showSum
          ]);
        });
        wsData.push(['', '', 'TỔNG CỘNG', '', '', bm.total]);

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        ws['!cols'] = [
          { wch: 6 }, { wch: 13 }, { wch: 28 }, { wch: 28 }, { wch: 22 }, { wch: 16 }
        ];
        XLSX.utils.book_append_sheet(wb, ws, `CTP_T${bm.month}`);
        XLSX.writeFile(wb, `Bang_CTP_${bm.memberName}_Thang_${bm.month}_2026.xlsx`);
        showToast('📥 Đã tải xuống file Excel (.xlsx) thành công!');
      }
    };

            ${filteredShows.length === 0 ? `

              const extras = Array.isArray(item.extras) ? item.extras : [];
              extras.forEach(ex => showSubTotal += (Number(ex.amount) || 0));

              const quayDefault = days === 1 ? 1500000 : 1200000 * days;
              const chupDefault = days === 1 ? 1500000 : 1200000 * days;

              const taskList = [
                { key: 'quay', label: `Quay (${days === 1 ? '1.5tr' : days + 'n x 1.2tr'})`, def: quayDefault },

              return `
                <div class="bg-white rounded-3xl border ${sh.isCustomCtp ? 'border-amber-300 ring-1 ring-amber-200/70' : 'border-slate-200'} p-4 space-y-3 shadow-2xs">

                  <div class="flex items-start justify-between gap-2 border-b border-slate-100 pb-2.5">

                      <span class="text-[9px] text-emerald-700 font-bold block">Tổng Show</span>

                            <button type="button" onclick="ctpActions.toggleTask('${sh.id}', '${t.key}')" class="px-2.5 py-1.5 rounded-full text-[10px] font-extrabold border transition-all flex items-center gap-1 ${isChecked ? 'bg-indigo-600 text-white border-indigo-600 shadow-2xs' : 'bg-slate-50 text-slate-600 border-slate-200'}">

            <!-- Nút thêm nhanh show ngoài ở cuối danh sách (chỉ hiện khi đã có show để không bị trùng với nút ở khung trống) -->
            ${filteredShows.length > 0 ? `
              <div class="pt-1 pb-2 text-center">
                <button type="button" onclick="ctpActions.openAddCustomShowModal()" class="w-full py-3 rounded-3xl border-2 border-dashed border-slate-300 hover:border-slate-500 bg-white/70 text-slate-700 font-extrabold text-xs flex items-center justify-center gap-2 transition-all active:scale-98">
                  <i class="fa-solid fa-circle-plus text-emerald-600"></i>
                  <span>Tự note thêm Show ngoài lịch</span></button><button type="button" onclick="appActions.autoFillCtpFromRoles()" class="mt-2 w-full py-2.5 rounded-3xl bg-amber-100 text-amber-900 border border-amber-300 font-extrabold text-xs flex items-center justify-center gap-1.5"><i class="fa-solid fa-wand-magic-sparkles"></i><span>⚡ Tự điền nhanh CTP theo vai trò đã gắn</span>

          <div class="p-3 bg-white border-t border-slate-200 shrink-0 shadow-lg flex items-center gap-2">
            <button type="button" onclick="saveCtpStateToLocal(true); showToast('💾 Đã lưu toàn bộ số liệu CTP!');" class="px-4 py-3.5 rounded-2xl bg-slate-900 active:scale-98 text-white font-black text-xs flex items-center justify-center gap-1.5 shadow-sm shrink-0">

              <span>💾 LƯU</span>
            </button>
            <button type="button" onclick="saveCtpStateToLocal(true); ctpActions.generateBill()" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 active:scale-98 text-white font-black py-3.5 rounded-2xl shadow-md text-xs flex items-center justify-center gap-2 uppercase tracking-wider transition-all">
              <i class="fa-solid fa-sack-dollar text-sm"></i>
              <span>🔥 LỤM (TỔNG HỢP BILL)</span>
            </button>
          </div>
        </div>
      `;
    }

    // Hàm rút gọn số tiền chuẩn đẹp (VD: 200.000 -> 200k, 1.500.000 -> 1.5tr, 10.000.000 -> 10tr)
    function formatCompactMoneyPlain(val) {
      const n = Number(val) || 0;
      if (n <= 0) return '-';
      if (n >= 1000000) {
        const tr = n / 1000000;
        const trStr = Number.isInteger(tr)
          ? String(tr)
          : tr.toFixed(2).replace(/\.?0+$/, '');
        return `${trStr}tr`;
      }
      if (n >= 1000) {
        const k = Math.round(n / 1000);
        return `${k}k`;
      }
      return `${n.toLocaleString('vi-VN')}đ`;
    }

    function formatCompactMoney(val) {
      const n = Number(val) || 0;
      if (n <= 0) return '<span class="text-slate-300">-</span>';
      return formatCompactMoneyPlain(n);
    }

    // ========================================================================
    const OWNER_STATUS_OPTIONS = [
      { id: 'unpaid',    label: '⏳ Chưa thanh lý', badgeCls: 'bg-amber-100 text-amber-800 border-amber-300' },
      { id: 'deposited', label: '💵 Đã nhận cọc',   badgeCls: 'bg-blue-100 text-blue-800 border-blue-300' },
      { id: 'settled',   label: '✅ Đã thanh lý',   badgeCls: 'bg-emerald-100 text-emerald-800 border-emerald-300' }
    ];

    const CREW_CTP_STATUS_OPTIONS = [
      { id: 'unpaid',  label: '⏳ Chờ Chủ Show trả', badgeCls: 'bg-amber-100 text-amber-800 border-amber-300' },
      { id: 'settled', label: '✅ Đã nhận CTP',      badgeCls: 'bg-emerald-100 text-emerald-800 border-emerald-300' }
    ];

    let ownerCloudSyncTimers = {};

    function saveOwnerFinanceState(showId = null, immediate = false) {
      if (showId && state.ownerFinanceMap[showId]) {
        state.ownerFinanceMap[showId].updatedAt = Date.now();
      }
      try {
        localStorage.setItem('as_owner_finance_2026', JSON.stringify(state.ownerFinanceMap));
      } catch (e) {}
      if (showId && db) {
        if (ownerCloudSyncTimers[showId]) clearTimeout(ownerCloudSyncTimers[showId]);
        const doPush = async () => {
          try {
            const dataToSave = state.ownerFinanceMap[showId];
            if (dataToSave) {
              await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'owner_finance', showId), {
                ...dataToSave,
                updatedAt: dataToSave.updatedAt || Date.now()
              });
            }
          } catch (e) {}
        };
        if (immediate) {
          doPush();
        } else {
          ownerCloudSyncTimers[showId] = setTimeout(doPush, 500);
        }
      }
    }

    function estimateDefaultMemberCtp(sh, memId) {
      const days = getShowDays(sh);
      const dayRate = days === 1 ? 1500000 : 1200000 * days;
      const rawRoles = sh.roles?.[memId];
      const roles = Array.isArray(rawRoles) ? rawRoles : (rawRoles ? [rawRoles] : []);
      if (roles.length === 0) return dayRate;
      let sum = 0;
      roles.forEach(r => {
        if (r.includes('Quay') || r.includes('Chụp') || r.includes('Tổng')) sum += dayRate;
        else if (r.includes('Dựng')) sum += 1000000;
        else if (r.includes('Flycam')) sum += 1000000;
        else if (r.includes('Đèn')) sum += 500000;
      });
      return sum > 0 ? sum : dayRate;
    }

    function ensureOwnerFinRecord(sh) {
      if (!state.ownerFinanceMap[sh.id]) {
        const initCrewCosts = {};
        (sh.memberIds || []).forEach(mid => {
          initCrewCosts[mid] = estimateDefaultMemberCtp(sh, mid);
        });
        state.ownerFinanceMap[sh.id] = {
          clientPrice: 0,
          depositPaid: 0,
          status: 'unpaid',
          crewCosts: initCrewCosts,
          postCost: 0,
          otherExpenses: [],
          crewMemberMeta: {},
          note: ''
        };
      } else {
        const rec = state.ownerFinanceMap[sh.id];
        if (!rec.crewCosts) rec.crewCosts = {};
        (sh.memberIds || []).forEach(mid => {
          if (rec.crewCosts[mid] === undefined) {
            rec.crewCosts[mid] = estimateDefaultMemberCtp(sh, mid);
          }
        });
        if (!Array.isArray(rec.otherExpenses)) rec.otherExpenses = [];
        if (!rec.crewMemberMeta) rec.crewMemberMeta = {};
      }
      return state.ownerFinanceMap[sh.id];
    }

    function ensureCrewMemberMeta(sh, userId = state.currentUserId) {
      const rec = ensureOwnerFinRecord(sh);
      if (!rec.crewMemberMeta[userId]) {
        rec.crewMemberMeta[userId] = {
          ctpStatus: 'unpaid',
          selfExpense: 0,
          selfExpenseNote: ''
        };
      }
      return rec.crewMemberMeta[userId];
    }

    // Phân loại thống nhất cho mọi show (kể cả show ngoài):
    // Cứ show nào mình đứng tên Chủ show (sh.ownerId === userId) thì đưa vào "Làm Chủ", ngược lại đưa vào "Nhận CTP"
    function getMyShowRoleCategory(sh, userId = state.currentUserId) {
      return sh.ownerId === userId ? 'owner' : 'crew';
    }

    // Tính toán số liệu khi MÌNH LÀ CHỦ SHOW
    function calculateOwnerShowMetrics(sh) {
      const rec = ensureOwnerFinRecord(sh);
      const clientPrice = Number(rec.clientPrice) || 0;
      const depositPaid = Number(rec.depositPaid) || 0;
      let crewCtpTotal = 0;
      (sh.memberIds || []).forEach(mid => {
        crewCtpTotal += (Number(rec.crewCosts?.[mid]) || 0);
      });
      const postCost = Number(rec.postCost) || 0;
      let otherExpTotal = 0;
      (rec.otherExpenses || []).forEach(ex => {
        otherExpTotal += (Number(ex.amount) || 0);
      });
      const totalExpense = crewCtpTotal + postCost + otherExpTotal;
      const netProfit = clientPrice - totalExpense;
      const remainingClientDebt = rec.status === 'settled' ? 0 : Math.max(0, clientPrice - depositPaid);
      return {
        mode: 'owner',
        rec,
        clientPrice,
        depositPaid,
        crewCtpTotal,
        postCost,
        otherExpTotal,
        totalExpense,
        netProfit,
        remainingClientDebt
      };
    }

    // Tính toán số liệu khi MÌNH ĐI LÀM NHẬN CTP (Đồng bộ 2 chiều với tab Tính CTP)
    function calculateCrewShowMetrics(sh, userId = state.currentUserId) {
      const ctpItem = state.ctpItems[sh.id] || { tasks: {}, extras: [] };
      const tasks = ctpItem.tasks || {};
      const extras = Array.isArray(ctpItem.extras) ? ctpItem.extras : [];

      let taskSum = 0;
      Object.values(tasks).forEach(v => taskSum += (Number(v) || 0));
      let extraBillSum = 0;
      extras.forEach(ex => extraBillSum += (Number(ex.amount) || 0));

      const grossCtp = taskSum + extraBillSum;
      const meta = ensureCrewMemberMeta(sh, userId);
      const selfExpense = Number(meta.selfExpense) || 0;
      const netPocket = grossCtp - selfExpense;
      const isSettled = meta.ctpStatus === 'settled';
      const pendingCtpDebt = isSettled ? 0 : Math.max(0, grossCtp);

      return {
        mode: 'crew',
        ctpItem,
        meta,
        taskSum,
        extraBillSum,
        grossCtp,
        selfExpense,
        netPocket,
        isSettled,
        pendingCtpDebt
      };
    }

    // Lấy toàn bộ danh sách Show liên quan đến thành viên đang đăng nhập (Làm Chủ + Đi Làm + Show Ngoài)
    function getAllMyInvolvedShows(applyFilter = true) {
      const uid = state.currentUserId;

      const regularInvolved = state.shows.filter(sh => {
        const isOwner = sh.ownerId === uid;
        const isParticipant = (sh.memberIds || []).includes(uid);
        if (!isOwner && !isParticipant) return false;
        if (!state.ownerAllMonths) {
          if (!sh.startDate) return false;
          const m = parseInt(sh.startDate.split('-')[1], 10);
          if (m !== state.ownerMonth) return false;
        }
        return true;
      });

      const customInvolved = (state.ctpCustomShows || []).filter(sh => {
        const isMyCustom = (!sh.userId || sh.userId === uid) || sh.ownerId === uid || (sh.memberIds || []).includes(uid);
        if (!isMyCustom) return false;
        if (!state.ownerAllMonths) {
          if (!sh.startDate) return Number(sh.ctpMonth) === state.ownerMonth;
          const m = parseInt(sh.startDate.split('-')[1], 10);
          if (m !== state.ownerMonth) return false;
        }
        return true;
      });

      const combined = [...regularInvolved, ...customInvolved].sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));

      if (!applyFilter || state.ownerFilterStatus === 'all') return combined;

      return combined.filter(sh => {
        const cat = getMyShowRoleCategory(sh, uid);
        if (state.ownerFilterStatus === 'role_owner') return cat === 'owner';
        if (state.ownerFilterStatus === 'role_crew') return cat === 'crew';

        const isSettled = cat === 'owner'
          ? (ensureOwnerFinRecord(sh).status === 'settled')
          : (ensureCrewMemberMeta(sh, uid).ctpStatus === 'settled');

        if (state.ownerFilterStatus === 'settled') return isSettled;
        if (state.ownerFilterStatus === 'unsettled') return !isSettled;
        return true;
      });
    }

    function refreshOwnerLiveDom(showId) {
      const sh = findAnyCtpShow(showId);
      if (!sh) return;
      const cat = getMyShowRoleCategory(sh);

      if (cat === 'owner') {
        const m = calculateOwnerShowMetrics(sh);
        const revSummaryEl = document.getElementById(`owner-summary-rev-${showId}`);
        if (revSummaryEl) revSummaryEl.textContent = formatCompactMoneyPlain(m.clientPrice);

        const expSummaryEl = document.getElementById(`owner-summary-exp-${showId}`);
        if (expSummaryEl) expSummaryEl.textContent = formatCompactMoneyPlain(m.totalExpense);

        const profSummaryEl = document.getElementById(`owner-summary-prof-${showId}`);
        if (profSummaryEl) {
          profSummaryEl.textContent = (m.netProfit > 0 ? '+' : '') + (m.netProfit === 0 ? '0đ' : formatCompactMoneyPlain(m.netProfit));
          profSummaryEl.className = `text-xs font-black font-mono ${m.netProfit >= 0 ? 'text-emerald-700' : 'text-rose-600'}`;
        }

        const expEl = document.getElementById(`owner-show-exp-${showId}`);
        if (expEl) expEl.textContent = m.totalExpense.toLocaleString('vi-VN') + 'đ';

        const profEl = document.getElementById(`owner-show-profit-${showId}`);
        if (profEl) {
          profEl.textContent = (m.netProfit >= 0 ? '+' : '') + m.netProfit.toLocaleString('vi-VN') + 'đ';
          profEl.className = `text-xs sm:text-sm font-black font-mono ${m.netProfit >= 0 ? 'text-emerald-700' : 'text-rose-600'}`;
        }

        const debtEl = document.getElementById(`owner-show-debt-${showId}`);
        if (debtEl) {
          debtEl.textContent = m.remainingClientDebt > 0
            ? `Khách còn thiếu: ${m.remainingClientDebt.toLocaleString('vi-VN')}đ`
            : (m.clientPrice > 0 ? 'Đã thu đủ 100%' : 'Chưa nhập giá báo khách');
        }
      } else {
        const cm = calculateCrewShowMetrics(sh);
        const grossSummaryEl = document.getElementById(`crew-summary-gross-${showId}`);
        if (grossSummaryEl) grossSummaryEl.textContent = formatCompactMoneyPlain(cm.grossCtp);

        const selfSummaryEl = document.getElementById(`crew-summary-self-${showId}`);
        if (selfSummaryEl) selfSummaryEl.textContent = formatCompactMoneyPlain(cm.selfExpense);

        const netSummaryEl = document.getElementById(`crew-summary-net-${showId}`);
        if (netSummaryEl) {
          netSummaryEl.textContent = (cm.netPocket > 0 ? '+' : '') + (cm.netPocket === 0 ? '0đ' : formatCompactMoneyPlain(cm.netPocket));
          netSummaryEl.className = `text-xs font-black font-mono ${cm.netPocket >= 0 ? 'text-emerald-700' : 'text-rose-600'}`;
        }

        const grossFootEl = document.getElementById(`crew-show-gross-${showId}`);
        if (grossFootEl) grossFootEl.textContent = cm.grossCtp.toLocaleString('vi-VN') + 'đ';

        const netFootEl = document.getElementById(`crew-show-net-${showId}`);
        if (netFootEl) {
          netFootEl.textContent = (cm.netPocket >= 0 ? '+' : '') + cm.netPocket.toLocaleString('vi-VN') + 'đ';
          netFootEl.className = `text-xs sm:text-sm font-black font-mono ${cm.netPocket >= 0 ? 'text-emerald-700' : 'text-rose-600'}`;
        }
      }

      // Cập nhật 4 ô Dashboard tổng hợp trên đầu trang
      const allMyShows = getAllMyInvolvedShows(false);
      let totalNetIncome = 0;
      let ownerProfitSum = 0;
      let crewNetSum = 0;
      let totalUncollectedDebt = 0;

      allMyShows.forEach(s => {
        const c = getMyShowRoleCategory(s);
        if (c === 'owner') {
          const sm = calculateOwnerShowMetrics(s);
          ownerProfitSum += sm.netProfit;
          totalNetIncome += sm.netProfit;
          totalUncollectedDebt += sm.remainingClientDebt;
        } else {
          const cm = calculateCrewShowMetrics(s);
          crewNetSum += cm.netPocket;
          totalNetIncome += cm.netPocket;
          totalUncollectedDebt += cm.pendingCtpDebt;
        }
      });

      const dTotal = document.getElementById('owner-dash-total-income');
      const dOwner = document.getElementById('owner-dash-owner-profit');
      const dCrew = document.getElementById('owner-dash-crew-ctp');
      const dDebt = document.getElementById('owner-dash-debt');
      if (dTotal) dTotal.textContent = (totalNetIncome >= 0 ? '+' : '') + totalNetIncome.toLocaleString('vi-VN') + 'đ';
      if (dOwner) dOwner.textContent = (ownerProfitSum >= 0 ? '+' : '') + ownerProfitSum.toLocaleString('vi-VN') + 'đ';
      if (dCrew) dCrew.textContent = (crewNetSum >= 0 ? '+' : '') + crewNetSum.toLocaleString('vi-VN') + 'đ';
      if (dDebt) dDebt.textContent = totalUncollectedDebt.toLocaleString('vi-VN') + 'đ';
    }

    window.ownerActions = {
      toggleExpandShow(showId) {
        state.ownerExpandedShowId = (state.ownerExpandedShowId === showId) ? null : showId;
        renderApp();
      },
      setMonth(m) {
        state.ownerMonth = Number(m);
        state.ownerAllMonths = false;
        renderApp();
      },
      toggleAllMonths() {
        state.ownerAllMonths = !state.ownerAllMonths;
        renderApp();
      },
      setFilterStatus(st) {
        state.ownerFilterStatus = st;
        renderApp();
      },
      setCustomShowMode(showId, mode, event) {
        if (event) event.stopPropagation();
        const sh = findAnyCtpShow(showId);
        if (!sh) return;
        const rec = ensureOwnerFinRecord(sh);
        rec.customMode = mode;
        if (mode === 'owner') sh.ownerId = state.currentUserId;
        saveOwnerFinanceState(showId);
        saveCtpStateToLocal();
        renderApp();
      },
      setStatus(showId, newStatus, event) {
        if (event) event.stopPropagation();
        const sh = findAnyCtpShow(showId);
        if (!sh) return;
        const rec = ensureOwnerFinRecord(sh);
        rec.status = newStatus;
        if (newStatus === 'settled' && rec.clientPrice > 0) {
          rec.depositPaid = rec.clientPrice;
        }
        saveOwnerFinanceState(showId);
        renderApp();
      },
      setCrewCtpStatus(showId, newStatus, event) {
        if (event) event.stopPropagation();
        const sh = findAnyCtpShow(showId);
        if (!sh) return;
        const meta = ensureCrewMemberMeta(sh);
        meta.ctpStatus = newStatus;
        saveOwnerFinanceState(showId);
        renderApp();
      },
      handleCrewSelfExpenseInput(showId, el) {
        const sh = findAnyCtpShow(showId);
        if (!sh) return;
        const meta = ensureCrewMemberMeta(sh);
        const digits = String(el.value || '').replace(/\D/g, '');
        const numVal = digits ? parseInt(digits, 10) : 0;
        meta.selfExpense = numVal;
        el.value = digits ? numVal.toLocaleString('vi-VN') : '';
        saveOwnerFinanceState(showId);
        refreshOwnerLiveDom(showId);
      },
      handleCrewSelfNoteInput(showId, el) {
        const sh = findAnyCtpShow(showId);
        if (!sh) return;
        const meta = ensureCrewMemberMeta(sh);
        meta.selfExpenseNote = el.value;
        saveOwnerFinanceState(showId);
      },
      handleCrewTaskPriceLive(showId, taskKey, el) {
        ctpActions.handleTaskPriceInput(showId, taskKey, el);
        refreshOwnerLiveDom(showId);
      },
      handleCrewExtraAmountLive(showId, exIdx, el) {
        ctpActions.handleExtraAmountInput(showId, exIdx, el);
        refreshOwnerLiveDom(showId);
      },
      handleMoneyInput(showId, field, el) {
        const sh = findAnyCtpShow(showId);
        if (!sh) return;
        const rec = ensureOwnerFinRecord(sh);
        const digits = String(el.value || '').replace(/\D/g, '');
        const numVal = digits ? parseInt(digits, 10) : 0;
        rec[field] = numVal;
        el.value = digits ? numVal.toLocaleString('vi-VN') : '';
        saveOwnerFinanceState(showId);
        refreshOwnerLiveDom(showId);
      },
      handleCrewCostInput(showId, memId, el) {
        const sh = findAnyCtpShow(showId);
        if (!sh) return;
        const rec = ensureOwnerFinRecord(sh);
        const digits = String(el.value || '').replace(/\D/g, '');
        const numVal = digits ? parseInt(digits, 10) : 0;
        rec.crewCosts[memId] = numVal;
        el.value = digits ? numVal.toLocaleString('vi-VN') : '';
        saveOwnerFinanceState(showId);
        refreshOwnerLiveDom(showId);
      },
      setQuickCrewRate(showId, memId, amount) {
        const sh = findAnyCtpShow(showId);
        if (!sh) return;
        const rec = ensureOwnerFinRecord(sh);
        rec.crewCosts[memId] = Number(amount) || 0;
        saveOwnerFinanceState(showId);
        renderApp();
      },
      addExpenseRow(showId) {
        const sh = findAnyCtpShow(showId);
        if (!sh) return;
        const rec = ensureOwnerFinRecord(sh);
        rec.otherExpenses.push({ name: '', amount: 0 });
        saveOwnerFinanceState(showId);
        renderApp();
      },
      removeExpenseRow(showId, idx) {
        const sh = findAnyCtpShow(showId);
        if (!sh) return;
        const rec = ensureOwnerFinRecord(sh);
        rec.otherExpenses.splice(idx, 1);
        saveOwnerFinanceState(showId);
        renderApp();
      },
      handleExpenseName(showId, idx, el) {
        const sh = findAnyCtpShow(showId);
        if (!sh) return;
        const rec = ensureOwnerFinRecord(sh);
        if (rec.otherExpenses[idx]) {
          rec.otherExpenses[idx].name = el.value;
          saveOwnerFinanceState(showId);
        }
      },
      handleExpenseAmount(showId, idx, el) {
        const sh = findAnyCtpShow(showId);
        if (!sh) return;
        const rec = ensureOwnerFinRecord(sh);
        if (!rec.otherExpenses[idx]) return;
        const digits = String(el.value || '').replace(/\D/g, '');
        const numVal = digits ? parseInt(digits, 10) : 0;
        rec.otherExpenses[idx].amount = numVal;
        el.value = digits ? numVal.toLocaleString('vi-VN') : '';
        saveOwnerFinanceState(showId);
        refreshOwnerLiveDom(showId);
      },
      saveShowFinanceNow(showId, event) {
        if (event) event.stopPropagation();
        saveOwnerFinanceState(showId, true);
        saveCtpStateToLocal(true);
        state.ownerExpandedShowId = null;
        renderApp();
        showToast('💾 Đã lưu vĩnh viễn thông tin tiền & CTP của show!');
      },
      openAddOutsideShowFromOwnerTab() {
        state.ctpMonth = state.ownerMonth;
        ctpActions.openAddCustomShowModal();
      },
      exportOwnerExcel() {
        if (typeof XLSX === 'undefined') return;
        const curMem = getMember(state.currentUserId);
        const list = getAllMyInvolvedShows(true);
        const periodLabel = state.ownerAllMonths ? 'CẢ NĂM 2026' : `THÁNG ${state.ownerMonth}/2026`;

        const wsData = [
          [`BẢNG TỔNG HỢP THU NHẬP & QUẢN LÝ SHOW (${curMem.name.toUpperCase()}) - ${periodLabel}`],
          [],
          ['STT', 'Ngày', 'Phân loại', 'Show / Địa điểm', 'Đối tác / Chủ show', 'Trạng thái Thanh lý', 'Tổng Thu (Báo khách / Bill CTP)', 'Tổng Chi (CTP đoàn / Tự túc)', 'Còn Nợ Chưa Thu', 'THỰC NHẬN BỎ TÚI (VNĐ)']
        ];

        let sGross = 0, sExp = 0, sDebt = 0, sNet = 0;
        list.forEach((sh, i) => {
          const cat = getMyShowRoleCategory(sh);
          const dateStr = `${formatDayMonth(sh.startDate)}${sh.endDate && sh.endDate !== sh.startDate ? ' - ' + formatDayMonth(sh.endDate) : ''}`;
          if (cat === 'owner') {
            const m = calculateOwnerShowMetrics(sh);
            const stObj = OWNER_STATUS_OPTIONS.find(o => o.id === m.rec.status) || OWNER_STATUS_OPTIONS[0];
            sGross += m.clientPrice;
            sExp += m.totalExpense;
            sDebt += m.remainingClientDebt;
            sNet += m.netProfit;
            wsData.push([
              i + 1,
              dateStr,
              sh.isCustomCtp ? 'Show ngoài (Làm Chủ)' : '👑 Chủ Show',
              sh.location || '',
              sh.partner || 'Khách trực tiếp',
              stObj.label,
              m.clientPrice,
              m.totalExpense,
              m.remainingClientDebt,
              m.netProfit
            ]);
          } else {
            const cm = calculateCrewShowMetrics(sh);
            const stObj = CREW_CTP_STATUS_OPTIONS.find(o => o.id === cm.meta.ctpStatus) || CREW_CTP_STATUS_OPTIONS[0];
            const ownerName = getMember(sh.ownerId)?.name || '';
            sGross += cm.grossCtp;
            sExp += cm.selfExpense;
            sDebt += cm.pendingCtpDebt;
            sNet += cm.netPocket;
            wsData.push([
              i + 1,
              dateStr,
              sh.isCustomCtp ? 'Show ngoài (Nhận CTP)' : '🎥 Đi nhận CTP',
              sh.location || '',
              `Chủ show: ${ownerName}`,
              stObj.label,
              cm.grossCtp,
              cm.selfExpense,
              cm.pendingCtpDebt,
              cm.netPocket
            ]);
          }
        });

        wsData.push([
          '', '', '', 'TỔNG CỘNG TOÀN BỘ', '', '',
          sGross, sExp, sDebt, sNet
        ]);

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        ws['!cols'] = [
          { wch: 5 }, { wch: 13 }, { wch: 20 }, { wch: 24 }, { wch: 18 },
          { wch: 18 }, { wch: 22 }, { wch: 22 }, { wch: 16 }, { wch: 20 }
        ];
        XLSX.utils.book_append_sheet(wb, ws, 'TongHop_ThuNhap');
        XLSX.writeFile(wb, `TongHop_Show_${curMem.name}_${state.ownerAllMonths ? '2026' : 'T' + state.ownerMonth}.xlsx`);
        showToast('📥 Đã tải file Excel Tổng Hợp Thu Nhập & Show!');
      }
    };

          if (m.rec.status === 'settled') settledCount++;

          crewShowCount++;

          if (cm.isSettled) settledCount++;
        }

        card2 = { label: '👑 LÃI SHOW NHẬN KHÁCH', val: (ownerProf >= 0 ? '+' : '') + ownerProf.toLocaleString('vi-VN') + 'đ', cls: 'text-slate-900' };

    function renderZaloTomorrowModalHtml() {
      const zm = state.zaloTomorrowModal;
      if (!zm) return '';
      const targetDate = zm.dateStr;
      const tDate = new Date(targetDate + 'T00:00:00');
      const dayShows = state.shows.filter(sh => {
        const s = new Date(sh.startDate + 'T00:00:00');
        const e = new Date(sh.endDate + 'T00:00:00');
        return tDate >= s && tDate <= e;
      });

      let msg = `🚨 LỊCH CHẠY SHOW NGÀY (${formatDayMonth(targetDate)}):\n`;
      if (dayShows.length === 0) {
        msg += `Hiện chưa có lịch show nào ghi nhận vào ngày ${formatDayMonth(targetDate)}.\n`;
      } else {
        dayShows.forEach((sh, i) => {
          const crew = (sh.memberIds || []).map(id => {
            const r = sh.roles?.[id] ? ` (${Array.isArray(sh.roles[id]) ? sh.roles[id].join(', ') : sh.roles[id]})` : '';
            return getMember(id).name + r;
          }).join(', ');
          const ownerName = sh.ownerLabel || getMember(sh.ownerId).name;
          const visPartner = getVisiblePartnerText(sh);
          msg += `${i + 1}. 📍 ${sh.location}${visPartner ? ' (' + visPartner + ')' : ''}: ${crew} [Chủ show: ${ownerName}]\n`;
        });
      }
      msg += `----------------------------\n👉 Anh em kiểm tra kỹ thiết bị, sạc pin, thẻ nhớ đầy đủ nhé!`;

      return `
        <div onclick="appActions.closeZaloTomorrowModal()" class="fixed inset-0 z-50 bg-black/65 flex items-center justify-center p-4">
          <div onclick="event.stopPropagation()" class="bg-white w-full max-w-md rounded-3xl p-4 space-y-3 text-xs shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
              <h3 class="font-black text-sm text-emerald-700">📋 Điểm Danh Lịch Đi Show (Gửi Zalo)</h3>
              <button onclick="appActions.closeZaloTomorrowModal()" class="w-7 h-7 rounded-full bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex items-center justify-between gap-2">
              <span class="font-bold text-slate-600">Chọn ngày cần điểm danh:</span>
              <input type="date" value="${targetDate}" onchange="appActions.changeZaloTomorrowDate(this.value)" class="px-2.5 py-1 border rounded-xl font-bold bg-slate-50" />
            </div>
            <textarea id="zalo-tomorrow-textarea" rows="6" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono text-[11px] leading-relaxed">${escapeHtml(msg)}</textarea>
            <button onclick="appActions.copyZaloTomorrowText()" class="w-full bg-emerald-600 text-white font-black py-2.5 rounded-xl">📋 Copy Tin Nhắn & Đóng</button>
          </div>

      `;
    }

    async function shareOrDownloadPreviewImage() {
      const m = state.imagePreviewModal;
      if (!m) return;
      try {
        const res = await fetch(m.dataUrl);
        const blob = await res.blob();
        const file = new File([blob], m.fileName, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: m.title });
          return;
        }
      } catch (e) {}
      const a = document.createElement('a');
      a.href = m.dataUrl;
      a.download = m.fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('🖼️ Đã tải ảnh về thư mục Downloads!');
    }

    function renderApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const trackShowId = urlParams.get('track');
      if (trackShowId) {
        const root = document.getElementById('app');
        if (root) root.innerHTML = renderGuestTrackerPageHtml(trackShowId);
        return;
      }
      const root = document.getElementById('app');
      if (!root) return;

      // Lưu lại vị trí cuộn hiện tại của danh sách (đặc biệt là danh sách CTP và các bảng) trước khi vẽ lại DOM
      const savedScrolls = [];
      root.querySelectorAll('.custom-scroll, .no-scrollbar, .overflow-y-auto, .overflow-auto').forEach((el, idx) => {
        savedScrolls.push({
          id: el.id || null,
          idx,
          top: el.scrollTop,
          left: el.scrollLeft
        });
      });

      if (state.isBackendPortal) {
        root.innerHTML = `${renderBackendPortalHtml()}${renderToastHtml()}`;
        return;
      }
      if (!state.currentUserId) {
        root.innerHTML = `${renderPinModalHtml()}${renderCrewPassModalHtml()}${renderWave2ModalsHtml()}${renderImagePreviewModalHtml()}${renderToastHtml()}`;
        return;
      }
      let main = '';
      if (state.activeTab === 'shows') main = renderShowsTabHtml();
      else if (state.activeTab === 'matrix') main = renderMatrixTabHtml();
      else if (state.activeTab === 'free_finder') main = renderFreeFinderTabHtml();
      else if (state.activeTab === 'ctp') main = renderCtpTabHtml();
      else if (state.activeTab === 'owner_stats') main = renderOwnerStatsTabHtml();

              </div>
            </div>
          ` : ''}

          <!-- TAB 2: DANH SÁCH SHOW MỚI NHẬP -->
          ${tab === 'shows' ? `
            <div class="bg-[#141418] rounded-[26px] p-4 space-y-3">
              <input type="text" value="${esc(window.__ADMIN_BENTO_QUERY__)}" oninput="window.__searchBentoAdminShows(this.value)" placeholder="Tìm tên địa điểm, đối tác, chủ show, ekip..." class="w-full px-3.5 py-2.5 rounded-2xl bg-[#1c1c22] text-xs text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-amber-400/50" />
              
              <div class="divide-y divide-white/[0.05] max-h-[60dvh] overflow-y-auto custom-scroll">
                ${filteredShows.map((sh, idx) => {
                  const dParts = (sh.startDate || '').split('-');
                  const dm = dParts.length === 3 ? `${dParts[2]}/${dParts[1]}` : (sh.startDate || '');
                  const rawCreator = sh.createdBy || sh.creatorId || sh.createdByName || '';
                  const ownerName = sh.ownerId ? getMem(sh.ownerId).name : '';
                  const tagText = rawCreator ? `Nhập: ${getMem(rawCreator).name}` : (ownerName ? `Chủ show: ${ownerName}` : 'Dữ liệu gốc');
                  const crewNames = (sh.memberIds || []).map(id => getMem(id).name).join(', ');

                  return `
                    <div onclick="window.__openShowFromBentoAdmin('${sh.id}')" class="py-3 px-2 flex items-center justify-between gap-3 hover:bg-white/[0.04] rounded-2xl cursor-pointer transition-colors">
                      <div class="min-w-0 flex-1 space-y-1">
                        <div class="flex items-center gap-2">
                          <span class="text-[10px] font-mono text-zinc-500 w-6">#${idx + 1}</span>
                          <span class="px-2 py-0.5 rounded-lg bg-emerald-500/15 text-emerald-400 font-mono font-bold text-[10.5px]">${esc(dm)}</span>
                          <span class="font-bold text-xs text-white truncate">${esc(sh.location)}</span>
                          ${sh.partner ? `<span class="text-[10px] text-amber-400 font-semibold truncate">• ${esc(sh.partner)}</span>` : ''}
                        </div>
                        <div class="pl-8 text-[10.5px] text-zinc-400 truncate">
                          <span class="text-zinc-300 font-medium">${esc(tagText)}</span> · Ekip: ${esc(crewNames || 'Trống')}
                        </div>
                      </div>
                      <span class="text-zinc-600 text-sm">›</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}

          <!-- TAB 3: QUẢN LÝ PIN & TẢI BACKUP (GỌI THẲNG CÁC NÚT GỐC) -->
          ${tab === 'settings' ? `
            <div class="bg-[#141418] rounded-[26px] p-4 space-y-3 text-xs">
              <div class="font-bold text-white">Công cụ Quản trị Hệ thống</div>
              <p class="text-[11px] text-zinc-400 leading-relaxed">Truy cập nhanh các chức năng cấp lại mã PIN cho 13 anh em, đổi logo Studio hoặc xuất file sao lưu dữ liệu.</p>
              <div class="grid grid-cols-1 gap-2 pt-1">
                <button onclick="document.getElementById('as-bento-admin-root').style.display='none'" class="w-full py-3 rounded-2xl bg-[#1c1c22] hover:bg-white/10 text-amber-300 font-bold text-left px-4 flex items-center justify-between">
                  <span>🔑 Mở Bảng Cấp Lại Mã PIN & Đổi Logo</span>
                  <span>›</span>
                </button>
              </div>
            </div>
          ` : ''}

        </div>
      `;
    }

    window.__setBentoAdminTab = (t) => {
      window.__ADMIN_BENTO_TAB__ = t;
      renderCleanBentoAdminOverlay();
    };

    window.__searchBentoAdminShows = (val) => {
      window.__ADMIN_BENTO_QUERY__ = val;
      renderCleanBentoAdminOverlay();
    };

    window.__openShowFromBentoAdmin = (showId) => {
      const ov = document.getElementById('as-bento-admin-root');
      if (ov) ov.remove();
      // Bấm nút Về App gốc trước rồi mở chi tiết show
      const backBtn = Array.from(document.querySelectorAll('button')).find(b => (b.textContent || '').includes('Về App') && !b.closest('#as-bento-admin-root'));
      if (backBtn) backBtn.click();
      setTimeout(() => window.appActions?.openShowDetail?.(showId), 120);
    };

    window.__exitBentoAdmin = (actionType) => {
      const ov = document.getElementById('as-bento-admin-root');
      if (ov) ov.remove();
      const targetText = actionType === 'logout' ? 'Đăng xuất' : 'Về App';
      const btn = Array.from(document.querySelectorAll('button')).find(b => (b.textContent || '').includes(targetText) && !b.closest('#as-bento-admin-root'));
      if (btn) btn.click();
    };

    setInterval(renderCleanBentoAdminOverlay, 350);
    renderCleanBentoAdminOverlay();
  })();</script></body></html>
