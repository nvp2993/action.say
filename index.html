    function applyHomeScreenIcon(customDataUrl = null) {
      const appleLink = document.getElementById('apple-touch-icon-link');
      const favLink = document.getElementById('favicon-link');
      if (customDataUrl) {
        if (appleLink) appleLink.href = customDataUrl;
        if (favLink) favLink.href = customDataUrl;
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#222222';
      ctx.beginPath();
      ctx.moveTo(0, 185); ctx.lineTo(145, 115); ctx.lineTo(125, 0); ctx.lineTo(165, 0); ctx.lineTo(215, 240); ctx.lineTo(0, 210);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#222222';
      ctx.font = '900 360px Georgia, serif';
      ctx.fillText('S', 280, 495);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 108px Inter, Arial, sans-serif';
      ctx.fillText('acti', 52, 186);
      ctx.fillText('n', 385, 186);

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(295, 102, 82, 86, 26);
      ctx.fill();

      ctx.fillStyle = '#e11d2e';
      ctx.beginPath();
      ctx.moveTo(304, 172); ctx.quadraticCurveTo(335, 116, 351, 108); ctx.lineTo(368, 170); ctx.quadraticCurveTo(340, 130, 304, 172);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.arc(338, 159, 7.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 52px Inter, Arial, sans-serif';

      ctx.font = '900 32px Inter, Arial, sans-serif';

      ctx.font = '900 122px Inter, Arial, sans-serif';
      ctx.fillText('say', 256, 405);
      ctx.font = '900 44px Inter, Arial, sans-serif';
      ctx.fillText('studios', 210, 452);

      try {
        const pngDataUrl = canvas.toDataURL('image/png');
        if (appleLink) appleLink.href = pngDataUrl;
        if (favLink) favLink.href = pngDataUrl;
      } catch (e) {}

    function getAutoHighlightColor(locationStr = '', partnerStr = '') {
      const s = `${locationStr} ${partnerStr}`.toLowerCase();
      if (s.includes('bận') || s.includes('can tho') || s.includes('cần thơ') || s.includes('mất tích')) return '#fef08a';
      if (s.includes('kê gà') || s.includes('ke ga') || s.includes('phú quốc') || s.includes('phu quoc')) return '#fef3c7';
      if (s.includes('hồ tràm') || s.includes('ho tram') || s.includes('vũng tàu') || s.includes('vung tau')) return '#e9d5ff';
      if (s.includes('cam ranh') || s.includes('ninh chữ') || s.includes('ninh chu') || s.includes('long khánh') || s.includes('lk')) return '#bbf7d0';
      if (s.includes('mũi né') || s.includes('mui ne') || s.includes('phan thiết') || s.includes('phan thiet') || s.includes('nha trang') || s.includes('tây ninh') || s.includes('tay ninh') || s.includes('quy nhơn') || s.includes('hội an')) return '#fed7aa';
      if (s.includes('huế') || s.includes('hue') || s.includes('đl') || s.includes('đà lạt') || s.includes('da lat') || s.includes('đà nẵng')) return '#d9f99d';
      if (s.includes('bình dương') || s.includes('binh duong') || s.includes('đồng tháp') || s.includes('dong thap') || s.includes('bến tre') || s.includes('vĩnh long') || s.includes('bình phước')) return '#fecdd3';
      if (s.includes('long an') || s.includes('đồng nai') || s.includes('dong nai') || s.includes('ninh bình') || s.includes('hà nội')) return '#e2e8f0';
      if (s.includes('sg') || s.includes('sài gòn') || s.includes('sai gon') || s.includes('golf') || s.includes('q2')) return '#bae6fd';
      if (s.includes('hcm') || s.includes('nhà bè') || s.includes('cần giờ')) return '#a7f3d0';
      return '#dbeafe';
    }

    function getDefaultNewShowDate() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function resolveOwnerIdFromName(ownerName = '', memberIds = []) {
      const clean = (ownerName || '').trim().toLowerCase();
      if (clean) {
        const found = INITIAL_TEAM_MEMBERS.find(
          m => m.name.toLowerCase() === clean || m.shortLabel.toLowerCase() === clean
        );
        if (found) return found.id;
      }
      return memberIds[0] || 'khoa';
    }

    const INITIAL_SHOWS_DATA = window.__BAKED_SHOWS_DATA__ || [];

    try {
      const savedLocalShows = localStorage.getItem('as_shows_backup_2026');
      if (savedLocalShows) {
        const parsed = JSON.parse(savedLocalShows);
        if (Array.isArray(parsed) && parsed.length > 0) state.shows = parsed;
      }
      const savedLocalPins = localStorage.getItem('as_pins_backup_2026');
      if (savedLocalPins) state.pinsMap = { ...state.pinsMap, ...JSON.parse(savedLocalPins) };
      const savedLocalUser = localStorage.getItem('as_user_backup_2026');
      if (savedLocalUser) state.currentUserId = savedLocalUser;
    } catch (e) {}

    function saveShowsToLocalBackup() {
      try {
        localStorage.setItem('as_shows_backup_2026', JSON.stringify(state.shows));
      } catch (e) {}
    }

    window.addEventListener('hashchange', () => {
      state.isBackendPortal = window.location.hash === '#admin';
      renderApp();
    });

    let db = null;
    let auth = null;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'action-say-media-2026';

    async function initFirebaseCloud() {
      try {
        const firebaseConfig = (typeof __firebase_config !== 'undefined' && __firebase_config)
          ? JSON.parse(__firebase_config)
          : MY_FIREBASE_CONFIG;

        if (firebaseConfig && firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("AIzaSy...")) {
          const app = initializeApp(firebaseConfig);
          auth = getAuth(app);
          db = getFirestore(app);

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }

          onAuthStateChanged(auth, (u) => {
            state.user = u;
            if (u && db) attachFirestoreListeners(u);
          });
        }
      } catch (e) {
        console.warn('Chế độ chạy độc lập:', e);
      }
    }

    function attachFirestoreListeners(u) {
      const showsCol = collection(db, 'artifacts', appId, 'public', 'data', 'shows');
      onSnapshot(
        showsCol,
        async (snap) => {
          state.cloudSynced = true;
          if (snap.empty && INITIAL_SHOWS_DATA.length > 0) {
            try {
              await Promise.all(
                INITIAL_SHOWS_DATA.map(sh =>
                  setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shows', sh.id), sh)
                )
              );
            } catch (err) { console.error(err); }
          } else if (!snap.empty) {
            state.shows = snap.docs.map(d => d.data());
            saveShowsToLocalBackup();
          }
          renderApp();
        },
        () => { state.cloudSynced = false; renderApp(); }
      );

      const membersCol = collection(db, 'artifacts', appId, 'public', 'data', 'team_members');
      onSnapshot(membersCol, async (snap) => {
        if (!snap.empty) {
          const list = snap.docs.map(d => d.data()).sort((a, b) => (a.order || 99) - (b.order || 99));
          if (list.length > 0) state.members = list;
          renderApp();
        }
      });

      const pinsCol = collection(db, 'artifacts', appId, 'public', 'data', 'member_pins');
      onSnapshot(pinsCol, (snap) => {
        const pDoc = snap.docs.find(d => d.id === 'pins_config');
        if (pDoc) state.pinsMap = { ...DEFAULT_PINS_MAP, ...pDoc.data() };
        const aDoc = snap.docs.find(d => d.id === 'admin_auth');
        if (aDoc) {
          state.adminAuth = { ...DEFAULT_ADMIN_AUTH, ...aDoc.data() };
          state.accountDraft.email = state.adminAuth.email;
          state.accountDraft.password = state.adminAuth.password;
        }
        renderApp();
      });

      const sessionCol = collection(db, 'artifacts', appId, 'users', u.uid, 'device_session');
      onSnapshot(sessionCol, (snap) => {
        const sDoc = snap.docs.find(d => d.id === 'active_profile');
        if (sDoc) {
          const d = sDoc.data();
          if (d.memberId) state.currentUserId = d.memberId;
          if (typeof d.isAdmin === 'boolean') state.isAdminMode = d.isAdmin;
          renderApp();
        }
      });
    }

    function getMember(id) {
      return state.members.find(m => m.id === id) || state.members[0] || INITIAL_TEAM_MEMBERS[0];
    }

    function getMatrixColumns() {
      return [...state.members].sort((a, b) => (a.order || 99) - (b.order || 99));
    }

    function canEditShow(show) {
      if (!show) return false;
      if (state.isAdminMode) return true;
      const currentId = String(state.currentUserId || '').trim();
      const creatorId = String(show.creatorId || show.ownerId || '').trim();
      return creatorId !== '' && creatorId === currentId;
    }

    function formatDayMonth(dateStr) {
      if (!dateStr) return '';
      const p = dateStr.split('-');
      if (p.length !== 3) return dateStr;
      return `${parseInt(p[2], 10)}/${parseInt(p[1], 10)}`;
    }

    function escapeHtml(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(message, type = 'success') {
      state.toast = { message, type };
      renderApp();
      setTimeout(() => {
        state.toast = null;
        renderApp();
      }, 2600);
    }

    function renderPillHtml(memberId, size = 'xs', extraClasses = '', onClickAttr = '', roleTag = '') {
      const m = state.members.find(x => x.id === memberId);
      if (!m) return '';
      const sizeCls = size === 'xs'
        ? 'px-2 py-0.5 text-[9.5px]'
        : size === 'md'
        ? 'px-3 py-1 text-xs'
        : 'px-2.5 py-0.5 text-[10px]';
        
      let roleStr = '';
      if (Array.isArray(roleTag)) {
        roleStr = roleTag.join(', ');
      } else if (roleTag) {
        roleStr = roleTag;
      }
      const roleSpan = roleStr ? `<span class="ml-1 opacity-95 font-bold">• ${escapeHtml(roleStr)}</span>` : '';
      return `<span ${onClickAttr} style="background-color:${m.bg};color:${m.text}" class="inline-flex items-center font-extrabold rounded-full tracking-wide uppercase select-none shadow-2xs transition-transform active:scale-95 ${sizeCls} ${extraClasses}">${escapeHtml(m.shortLabel)}${roleSpan}</span>`;
    }

    function getFilteredShows() {
      return state.shows
        .filter(sh => {
          if (!state.filterAllMonthsInList) {
            const start = new Date(sh.startDate + 'T00:00:00');
            const end = new Date((sh.endDate < sh.startDate ? sh.startDate : sh.endDate) + 'T00:00:00');
            const mStart = new Date(state.selectedYear, state.selectedMonth - 1, 1);
            const mEnd = new Date(state.selectedYear, state.selectedMonth, 0);
            if (end < mStart || start > mEnd) return false;
          }
          if (state.filterMemberId !== 'all' && !(sh.memberIds || []).includes(state.filterMemberId)) {
            return false;
          }
          if (state.searchQuery.trim() !== '') {
            const q = state.searchQuery.toLowerCase();
            const loc = (sh.location || '').toLowerCase();
            const part = (sh.partner || '').toLowerCase();
            const note = (sh.note || '').toLowerCase();
            const sttStr = String(sh.stt || '');
            const ownerName = (sh.ownerLabel || getMember(sh.ownerId)?.name || '').toLowerCase();
            return loc.includes(q) || part.includes(q) || note.includes(q) || ownerName.includes(q) || sttStr.includes(q);
          }
          return true;
        })
        .sort((a, b) => {
          if (a.startDate !== b.startDate) return (a.startDate || '').localeCompare(b.startDate || '');
          return (Number(a.stt) || 0) - (Number(b.stt) || 0);
        });
    }

    function parseExcelDateCell(val, defaultYear = 2026) {
      if (!val && val !== 0) return '';
      if (typeof val === 'number') {
        const utcDays = Math.floor(val - 25569);
        const d = new Date(utcDays * 86400 * 1000);
        if (!isNaN(d)) {
          const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
          const dd = String(d.getUTCDate()).padStart(2, '0');
          return `${defaultYear}-${mm}-${dd}`;
        }
      }
      const s = String(val).trim();
      const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?$/);
      if (m) {
        const dd = String(parseInt(m[1], 10)).padStart(2, '0');
        const mm = String(parseInt(m[2], 10)).padStart(2, '0');
        return `${defaultYear}-${mm}-${dd}`;
      }
      return '';
    }

    function parseMemberIdsFromCell(str = '') {
      if (!str) return [];
      const upper = String(str).toUpperCase();
      const matched = [];
      state.members.forEach(m => {
        if (upper.includes(m.shortLabel.toUpperCase()) || upper.includes(m.name.toUpperCase())) {
          matched.push(m.id);
        }
      });
      return matched;
    }

    function getMatrixData() {
      const daysInMonth = new Date(state.selectedYear, state.selectedMonth, 0).getDate();
      const matrix = {};
      for (let d = 1; d <= daysInMonth; d++) {
        matrix[d] = {};
        state.members.forEach(m => { matrix[d][m.id] = []; });
      }
      state.shows.forEach(sh => {
        if (!sh.startDate || !sh.endDate) return;
        const start = new Date(sh.startDate + 'T00:00:00');
        const end = new Date(sh.endDate + 'T00:00:00');
        if (isNaN(start) || isNaN(end)) return;
        for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
          if (dt.getFullYear() === state.selectedYear && (dt.getMonth() + 1) === state.selectedMonth) {
            const day = dt.getDate();
            if (matrix[day]) {
              (sh.memberIds || []).forEach(mid => {
                if (matrix[day][mid]) matrix[day][mid].push(sh);
              });
            }
          }
        }
      });
      return { daysInMonth, matrix };
    }

    function getBusyMembersMap(startDate, endDate, excludeShowId = null) {
      const map = {};
      if (!startDate || !endDate) return map;
      const s1 = new Date(startDate + 'T00:00:00');
      const e1 = new Date(endDate + 'T00:00:00');
      state.shows.forEach(sh => {
        if (excludeShowId && sh.id === excludeShowId) return;
        const s2 = new Date(sh.startDate + 'T00:00:00');
        const e2 = new Date(sh.endDate + 'T00:00:00');
        if (s1 <= e2 && e1 >= s2) {
          (sh.memberIds || []).forEach(mid => {
            if (!map[mid]) map[mid] = [];
            map[mid].push(sh.location);
          });
        }
      });
      return map;
    }

      exportShowToAppleCalendar(showId) {
        const sh = state.shows.find(s => s.id === showId);

        const endDateObj = new Date(sh.endDate + 'T00:00:00');

          const r = sh.roles?.[id] ? ` (${Array.isArray(sh.roles[id]) ? sh.roles[id].join(', ') : sh.roles[id]})` : '';
          return getMember(id).name + r;
        }).join(', ');
        const title = `🎬 Show: ${sh.location}${sh.partner ? ' - ' + sh.partner : ''}`;

        const icsLines = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//Action & Say Media//Lich Show 2026//VI',
          'BEGIN:VEVENT',
          `UID:${sh.id}@actionsay.vn`,
          `DTSTAMP:${startClean}T010000Z`,
          `DTSTART;VALUE=DATE:${startClean}`,
          `DTEND;VALUE=DATE:${endClean}`,
          `SUMMARY:${title}`,
          `DESCRIPTION:${desc}`,
          `LOCATION:${sh.location}`,
          'BEGIN:VALARM',
          'TRIGGER:-PT4H',
          'ACTION:DISPLAY',
          'DESCRIPTION:Nhắc lịch đi show ngày mai - Sạc pin & kiểm tra thẻ nhớ!',
          'END:VALARM',
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsLines], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `lich-show-${sh.startDate}.ics`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        if (!state.isAdminMode) return;
        if (state.members.length <= 1) return;
        const target = getMember(memId);
        state.members = state.members.filter(m => m.id !== memId);
        if (state.currentUserId === memId) state.currentUserId = state.members[0].id;
        renderApp();
        showToast(`Đã xoá "${target.name}" khỏi danh sách!`);
        if (state.user && db) {
          try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'team_members', memId)); } catch (e) {}
        }
      },
      async saveAllPinsByAdmin() {
        if (!state.isAdminMode) return;
        try { localStorage.setItem('as_pins_backup_2026', JSON.stringify(state.pinsMap)); } catch (e) {}
        showToast('Đã lưu bảng mã PIN lên Cloud!');
        if (state.user && db) {
          try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'member_pins', 'pins_config'), state.pinsMap); } catch (e) {}
        }
      },
      setCheckDate(field, val) {
        state[field] = val;
        if (field === 'checkStart' && state.checkEnd < val) state.checkEnd = val;
        renderApp();
      },
      async syncExcelShowsToCloud() {
        state.shows = [...INITIAL_SHOWS_DATA];
        saveShowsToLocalBackup();
        renderApp();
        showToast(`Đã xoá dữ liệu cũ & nạp chuẩn ${INITIAL_SHOWS_DATA.length} dòng lịch!`);
        if (state.user && db) {
          const showsCol = collection(db, 'artifacts', appId, 'public', 'data', 'shows');
          const snap = await getDocs(showsCol);
          await Promise.all(snap.docs.map(d => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shows', d.id))));
          await Promise.all(INITIAL_SHOWS_DATA.map(sh => setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shows', sh.id), sh)));
        }
      },
      triggerExcelFileUpload() {
        if (!state.isAdminMode) return;
        const el = document.getElementById('excel-file-picker');
        if (el) el.click();
      },
      triggerLogoUpload() {
        if (!state.isAdminMode) return;
        const el = document.getElementById('logo-file-picker');
        if (el) el.click();
      },
      handleCustomLogoUpload(event) {
        if (!state.isAdminMode) return;
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          state.customLogoUrl = reader.result;
          applyHomeScreenIcon(state.customLogoUrl);
          renderApp();
          showToast('Đã cập nhật ảnh Logo & Icon màn hình chính iPhone!');
        };
        reader.readAsDataURL(file);
        event.target.value = '';
      },
      async handleDirectExcelFile(event) {
        if (!state.isAdminMode) return;
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          const data = await file.arrayBuffer();
          const workbook = XLSX.read(data, { type: 'array' });
          const sheetName = workbook.SheetNames.find(n => n.toUpperCase().includes('LỊCH SHOW') || n.toUpperCase().includes('LICH SHOW')) || workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

          const imported = [];
          for (let i = 2; i < rows.length; i++) {
            const r = rows[i];
            if (!r || r.length === 0) continue;
            const sttRaw = r[0];
            const partner = String(r[1] || '').trim();
            const location = String(r[2] || '').trim();
            const startStr = parseExcelDateCell(r[3], 2026);
            const endStr = parseExcelDateCell(r[4], 2026) || startStr;
            const memIds = parseMemberIdsFromCell(r[5]);
            const ownerLabel = String(r[6] || '').trim();

            if (!location && !partner && memIds.length === 0 && !startStr) continue;
            const sttNum = Number(sttRaw) || (i - 1);
            const finalStart = startStr || '2026-06-01';
            const finalEnd = endStr && endStr >= finalStart ? endStr : finalStart;

            imported.push({
              id: `sh_xl_${i + 1}`,
              stt: sttNum,
              partner,
              location: location || partner || 'Show',
              startDate: finalStart,
              endDate: finalEnd,
              rawEndDate: endStr || finalStart,
              memberIds: memIds,
              roles: {},
              postStatus: 'pending',
              ownerId: resolveOwnerIdFromName(ownerLabel, memIds),
              creatorId: state.currentUserId,
              ownerLabel,
              color: getAutoHighlightColor(location, partner),
              note: ''
            });
          }

          if (imported.length > 0) {
            state.shows = imported;
            saveShowsToLocalBackup();
            state.filterAllMonthsInList = true;
            renderApp();
            showToast(`Đã nạp ${imported.length} dòng từ file "${file.name}"!`);
            if (state.user && db) {
              const showsCol = collection(db, 'artifacts', appId, 'public', 'data', 'shows');
              const snap = await getDocs(showsCol);
              await Promise.all(snap.docs.map(d => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shows', d.id))));
              await Promise.all(imported.map(sh => setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shows', sh.id), sh)));
            }
          }
        } catch (err) {
          showToast('Lỗi đọc file Excel: ' + err.message, 'error');
        }
        event.target.value = '';
      },
      downloadSingleHtmlFile() {
        if (!state.isAdminMode) return;
        const clonedDoc = document.documentElement.cloneNode(true);
        clonedDoc.querySelectorAll('[data-bard-client-injected="true"]').forEach(el => el.remove());
        const oldBaked = clonedDoc.querySelector('#baked-data-script');
        if (oldBaked) oldBaked.remove();

        const bakedScript = document.createElement('script');
        bakedScript.id = 'baked-data-script';
        bakedScript.textContent = `
          window.__BAKED_SHOWS_DATA__ = ${JSON.stringify(state.shows)};
          window.__BAKED_MEMBERS_DATA__ = ${JSON.stringify(state.members)};
          window.__BAKED_PINS_DATA__ = ${JSON.stringify(state.pinsMap)};
          window.__BAKED_CUSTOM_LOGO__ = ${JSON.stringify(state.customLogoUrl)};
        `;
        const headEl = clonedDoc.querySelector('head');
        if (headEl) headEl.insertBefore(bakedScript, headEl.firstChild);

        const htmlContent = '<!DOCTYPE html>\n' + clonedDoc.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(`Đã tải file index.html nhúng sẵn ${state.shows.length} dòng lịch!`);
      }
    };

    // ========================================================================
    // LOGIC & GIAO DIỆN TAB TÍNH CÔNG TÁC PHÍ (CTP) CHUẨN BENTO PILL
    // ========================================================================
    function getShowDays(sh) {
      if (!sh.startDate || !sh.endDate) return 1;
      const s = new Date(sh.startDate + 'T00:00:00');
      const e = new Date(sh.endDate + 'T00:00:00');
      const diffTime = e - s;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
      return diffDays > 0 ? diffDays : 1;
    }

    function getDefaultRateForTask(taskKey, sh) {
      const days = getShowDays(sh);
      if (taskKey === 'quay' || taskKey === 'chup') {
        return days === 1 ? 1500000 : 1200000 * days;
      }
      if (taskKey === 'dung') return 1000000;
      if (taskKey === 'lamhinh') return 300000;
      if (taskKey === 'flycam') return 1000000;
      if (taskKey === 'gimbal') return 200000;
      return 0;
    }

    window.ctpActions = {
      setMonth(m) {
        state.ctpMonth = Number(m);
        renderApp();
      },
      setOwner(ownerId) {
        state.ctpOwnerId = ownerId;
        renderApp();
      },
      toggleTask(showId, taskKey) {
        if (!state.ctpItems[showId]) state.ctpItems[showId] = { tasks: {}, extras: [] };
        const tasks = state.ctpItems[showId].tasks;
        if (tasks[taskKey]) {
          delete tasks[taskKey];
        } else {
          const sh = state.shows.find(s => s.id === showId);
          tasks[taskKey] = getDefaultRateForTask(taskKey, sh);
        }
        renderApp();
      },
      updateTaskPrice(showId, taskKey, el) {
        if (!state.ctpItems[showId]) state.ctpItems[showId] = { tasks: {}, extras: [] };
        const rawVal = el.value.replace(/\./g, '').replace(/,/g, '');
        state.ctpItems[showId].tasks[taskKey] = Number(rawVal) || 0;
      },
      addExtraItem(showId) {
        if (!state.ctpItems[showId]) state.ctpItems[showId] = { tasks: {}, extras: [] };
        if (!Array.isArray(state.ctpItems[showId].extras)) state.ctpItems[showId].extras = [];
        state.ctpItems[showId].extras.push({ name: '', amount: '' });
        renderApp();
      },
      removeExtraItem(showId, index) {
        if (!state.ctpItems[showId] || !state.ctpItems[showId].extras) return;
        state.ctpItems[showId].extras.splice(index, 1);
        renderApp();
      },
      saveExtraField(showId, index, field, el) {
        if (!state.ctpItems[showId] || !state.ctpItems[showId].extras) return;
        const val = el.value;
        if (field === 'amount') {
          const rawVal = val.replace(/\./g, '').replace(/,/g, '');
          state.ctpItems[showId].extras[index][field] = Number(rawVal) || 0;
        } else {
          state.ctpItems[showId].extras[index][field] = val;
        }
      },
