    function applyHomeScreenIcon(customDataUrl = null) {
      const appleLink = document.getElementById('apple-touch-icon-link');
      const favLink = document.getElementById('favicon-link');
      if (customDataUrl) {
        if (appleLink) appleLink.href = customDataUrl;
        if (favLink) favLink.href = customDataUrl;
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#222222';
      ctx.beginPath();
      ctx.moveTo(0, 185); ctx.lineTo(145, 115); ctx.lineTo(125, 0); ctx.lineTo(165, 0); ctx.lineTo(215, 240); ctx.lineTo(0, 210);
      ctx.closePath(); ctx.fill();
      ctx.font = '900 360px Georgia, serif'; ctx.fillText('S', 280, 495);
      ctx.fillStyle = '#ffffff'; ctx.font = '900 108px Inter, Arial, sans-serif';
      ctx.fillText('acti', 52, 186); ctx.fillText('n', 385, 186);
      ctx.beginPath(); ctx.roundRect(295, 102, 82, 86, 26); ctx.fill();
      ctx.fillStyle = '#e11d2e';
      ctx.beginPath(); ctx.moveTo(304, 172); ctx.quadraticCurveTo(335, 116, 351, 108); ctx.lineTo(368, 170); ctx.quadraticCurveTo(340, 130, 304, 172);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(338, 159, 7.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.font = '800 52px Inter, Arial, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('m e d i a', 256, 246); ctx.font = '900 32px Inter, Arial, sans-serif'; ctx.fillText('x', 256, 300);
      ctx.font = '900 122px Inter, Arial, sans-serif'; ctx.fillText('say', 256, 405);
      ctx.font = '900 44px Inter, Arial, sans-serif'; ctx.fillText('studios', 210, 452);
      try {
        const pngDataUrl = canvas.toDataURL('image/png');
        if (appleLink) appleLink.href = pngDataUrl;
        if (favLink) favLink.href = pngDataUrl;
      } catch (e) {}
    }
