    function renderZaloTomorrowModalHtml() {
      const zm = state.zaloTomorrowModal;
      if (!zm) return '';
      const targetDate = zm.dateStr;
      const tDate = new Date(targetDate + 'T00:00:00');
      const dayShows = state.shows.filter(sh => {
        const s = new Date(sh.startDate + 'T00:00:00');
        const e = new Date(sh.endDate + 'T00:00:00');
        return tDate >= s && tDate <= e;
      });

      let msg = `🚨 LỊCH CHẠY SHOW NGÀY (${formatDayMonth(targetDate)}):\n`;
      if (dayShows.length === 0) {
        msg += `Hiện chưa có lịch show nào ghi nhận vào ngày ${formatDayMonth(targetDate)}.\n`;
      } else {
        dayShows.forEach((sh, i) => {
          const crew = (sh.memberIds || []).map(id => {
            const r = sh.roles?.[id] ? ` (${Array.isArray(sh.roles[id]) ? sh.roles[id].join(', ') : sh.roles[id]})` : '';
            return getMember(id).name + r;
          }).join(', ');
          const ownerName = sh.ownerLabel || getMember(sh.ownerId).name;
          const visPartner = getVisiblePartnerText(sh);
          msg += `${i + 1}. 📍 ${sh.location}${visPartner ? ' (' + visPartner + ')' : ''}: ${crew} [Chủ show: ${ownerName}]\n`;
        });
      }
      msg += `----------------------------\n👉 Anh em kiểm tra kỹ thiết bị, sạc pin, thẻ nhớ đầy đủ nhé!`;

      return `
        <div onclick="appActions.closeZaloTomorrowModal()" class="fixed inset-0 z-50 bg-black/65 flex items-center justify-center p-4">
          <div onclick="event.stopPropagation()" class="bg-white w-full max-w-md rounded-3xl p-4 space-y-3 text-xs shadow-xl">

      }
      const now = new Date();
      const isToday = d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      const yest = new Date(now);
      yest.setDate(now.getDate() - 1);
      const isYesterday = d.getDate() === yest.getDate() && d.getMonth() === yest.getMonth() && d.getFullYear() === yest.getFullYear();

      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');

      const dayKey = d.getFullYear() + '-' + mm + '-' + dd;

        return '<div class="py-10 text-center text-xs text-slate-400">Không tìm thấy show nào phù hợp</div>';
      }

      const groupMap = {};

        item.globalIdx = idx + 1;
        if (!groupMap[item.meta.dayKey]) {
          groupMap[item.meta.dayKey] = { dayKey: item.meta.dayKey, dayTitle: item.meta.dayTitle, isToday: item.meta.isToday, items: [] };

      return groups.map(grp => {

                '<span class="font-bold text-[13px] text-slate-900 truncate">' + esc(sh.location) + partnerText + '</span>' +

              '<div class="pl-6 text-[11px] text-slate-500 truncate">' +
                timePart + whoText + ' · Ekip: <span class="text-slate-700">' + esc(crewNames || 'Trống') + '</span>' +
              '</div>' +
            '</div>' +
            '<span class="text-slate-300 text-sm font-bold shrink-0">›</span>' +
          '</div>';
        }).join('');

        return '<div class="pt-3 first:pt-1">' +
          '<div class="flex items-center justify-between ' + headerBar + '">' +
            '<div class="flex items-center gap-2">' + todayDot + '<span class="text-[11px] font-black uppercase tracking-wide">' + esc(grp.dayTitle) + '</span></div>' +
            '<span class="text-[11px] font-mono font-bold opacity-75">' + grp.items.length + '</span>' +

    function buildInlineShowModalHtml(showsList, membersList) {

      const getMem = (id) => membersList.find(m => m.id === id) || { id, name: id || '—', bg: '#059669' };

      const dParts = (sh.startDate || '').split('-');
      const dm = dParts.length === 3 ? (dParts[2] + '/' + dParts[1] + '/' + dParts[0]) : (sh.startDate || '');

      const noteBox = sh.note ? ('<div class="p-3 rounded-2xl bg-slate-50 text-slate-700 text-xs"><span class="font-bold text-slate-900">Ghi chú:</span> ' + esc(sh.note) + '</div>') : '';

            '<button onclick="window.__closeInlineAdminShowModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold flex items-center justify-center shrink-0">✕</button>' +

          '<div class="divide-y divide-slate-100 text-xs">' +
            '<div class="py-2 flex justify-between"><span class="text-slate-400">Ngày đi show</span><span class="font-mono font-bold text-slate-900">' + esc(dm + endDm) + '</span></div>' +
            '<div class="py-2 flex justify-between"><span class="text-slate-400">Thời điểm nhập</span><span class="font-mono font-semibold text-emerald-700">' + esc(meta.timeText ? (meta.dayTitle + ' · ' + meta.timeText) : 'Dữ liệu cũ') + '</span></div>' +

            '<div class="py-2 flex justify-between"><span class="text-slate-400">Người tạo</span><span class="font-bold text-slate-900">' + esc(creatorName) + '</span></div>' +

          noteBox +

              '<div>' +
                '<div class="flex items-center gap-2"><h2 class="font-black text-sm text-slate-900 uppercase tracking-tight">Show Mới Nhập</h2><span class="text-xs font-mono font-bold text-emerald-700">(' + showsList.length + ')</span></div>' +
                '<p class="text-[11px] text-slate-400 mt-0.5">Phân nhóm theo ngày • Bấm vào show để xem chi tiết</p>' +
              '</div>' +
              '<input id="as-admin-show-search-inp" type="text" value="' + esc(window.__ADMIN_SEARCH__) + '" oninput="window.__searchLightAdminShows(this.value)" placeholder="Tìm địa điểm, chủ show, ekip..." class="w-full sm:w-60 px-3.5 py-2 rounded-2xl bg-slate-100 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:bg-slate-200/70" />' +
            '</div>' +

      } else if (tab === 'pins') {
        const pinCards = membersList.map(m => {
          const curPin = pinsMap[m.id] || '1234';

          return '<div class="p-3 rounded-2xl bg-slate-50 space-y-2">' +
            '<div class="flex items-center justify-between gap-2">' +
              '<div class="flex items-center gap-2 min-w-0"><span style="background:' + (m.bg || '#059669') + '" class="w-2.5 h-2.5 rounded-full shrink-0"></span><span class="font-bold text-xs text-slate-900 truncate">' + esc(m.name) + '</span></div>' +
              '<div class="flex items-center gap-1.5 shrink-0">' +
                '<input id="admin-pin-input-' + esc(m.id) + '" type="text" inputmode="numeric" maxlength="4" value="' + esc(curPin) + '" class="w-16 px-2 py-1.5 rounded-xl bg-white border border-slate-200 text-center font-mono font-black text-xs text-slate-900 focus:outline-none focus:border-emerald-500" />' +
                '<button onclick="window.__saveAdminMemberPinAndName(\'' + esc(m.id) + '\')" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[11px]">Lưu</button>' +
              '</div>' +
            '</div>' +
            '<input id="admin-legal-name-' + esc(m.id) + '" type="text" value="' + esc(savedLegal) + '" placeholder="Họ tên thật xuất vé (VD: NGUYỄN VĂN PHÚ)" class="w-full px-2.5 py-1.5 rounded-xl bg-white border border-slate-200 text-[11px] font-bold uppercase text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500" />' +
          '</div>';

          '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">' + pinCards + '</div>' +

      } else {

          ? '<img src="' + currentLogo + '" class="w-12 h-12 rounded-2xl object-cover" />'
          : '<div class="w-12 h-12 rounded-2xl bg-emerald-600 text-white font-black flex items-center justify-center text-sm">AS</div>';

        tabBodyHtml = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">' +
          '<section class="bg-white rounded-3xl p-4 sm:p-5 shadow-2xs flex flex-col justify-between space-y-4">' +
            '<div class="space-y-1"><h3 class="font-black text-sm text-slate-900 uppercase tracking-tight">Logo Thương Hiệu</h3><p class="text-[11px] text-slate-500">Thay đổi biểu tượng hiển thị trên thanh tiêu đề ứng dụng.</p></div>' +
            '<div class="flex items-center gap-3 pt-1">' + bigLogo + '<button onclick="window.__triggerBentoLogoUpload()" class="flex-1 py-2.5 px-4 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs">🖼️ Tải Logo Mới</button></div>' +
          '</section>' +
          '<section class="bg-white rounded-3xl p-4 sm:p-5 shadow-2xs flex flex-col justify-between space-y-4">' +
            '<div class="space-y-1"><h3 class="font-black text-sm text-slate-900 uppercase tracking-tight">Đóng Gói & Sao Lưu</h3><p class="text-[11px] text-slate-500">Tải file <b>index.html</b> sạch hoặc xuất bản sao lưu JSON.</p></div>' +
            '<div class="grid grid-cols-2 gap-2 pt-1">' +
              '<button onclick="window.__downloadCleanHtmlFromAdmin()" class="py-2.5 px-3 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs">📦 Tải HTML</button>' +
              '<button onclick="window.__exportJsonBackupFromAdmin()" class="py-2.5 px-3 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs">💾 Backup JSON</button>' +
            '</div>' +
          '</section>' +

      shell.innerHTML =
        '<header style="padding-top: calc(env(safe-area-inset-top, 12px) + 10px);" class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-100 px-4 pb-3">' +
          '<div class="max-w-5xl mx-auto flex items-center justify-between gap-3">' +
            '<div class="flex items-center gap-2.5">' + logoImg +
              '<div>' +
                '<div class="font-black text-sm text-slate-900 tracking-tight uppercase">Studio Control</div>' +
                '<div class="text-[11px] text-slate-400 font-medium">Action Media x Say Studios</div>' +
              '</div>' +
            '</div>' +
            '<div class="flex items-center gap-2">' +
              '<button onclick="window.__adminShellAction(\'logout\')" class="px-3 py-1.5 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs">Đăng xuất</button>' +
              '<button onclick="window.__adminShellAction(\'back\')" class="px-3.5 py-1.5 rounded-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs">← Về App</button>' +
            '</div>' +
          '</div>' +
        '</header>' +
        '<main style="padding-bottom: calc(env(safe-area-inset-bottom, 24px) + 40px);" class="max-w-5xl mx-auto px-3.5 sm:px-6 pt-4 sm:pt-6 space-y-4">' +
          '<div class="grid grid-cols-3 gap-2.5 sm:gap-4">' +

            '<div class="bg-white rounded-2xl sm:rounded-3xl p-3 sm:p-4 shadow-2xs"><div class="text-[10px] sm:text-xs font-bold text-slate-400 uppercase">Tháng ' + (now.getMonth() + 1) + '</div><div class="mt-1 text-xl sm:text-3xl font-black text-emerald-600 font-mono">' + thisMonthShowsCount + '</div></div>' +

    window.__setLightAdminTab = (t) => {

    };

    window.__searchLightAdminShows = (val) => {
      window.__ADMIN_SEARCH__ = val;
      const feed = document.getElementById('as-admin-shows-feed');
      const st = window.state || {};
      if (feed) {
        feed.innerHTML = buildGroupedShowsFeedHtml(st.shows || [], st.members || [], val);
      } else {
        renderUnifiedAdmin(true);
      }
    };

    window.__adminShellAction = (type) => {
      document.body.classList.remove('as-admin-mode-active');
      const shEl = document.getElementById('as-light-admin-shell');
      if (shEl) shEl.remove();
      const label = type === 'logout' ? 'Đăng xuất' : 'Về App';
      const btn = Array.from(document.querySelectorAll('button')).find(b => (b.textContent || '').includes(label) && !b.closest('#as-light-admin-shell'));
      if (btn) btn.click();
    };

    // Pre-Paint Observer trên #app: Chặn 100% cú nháy giao diện cũ khi vào Admin
    function attachPrePaintAdminObserver() {
      const appRoot = document.getElementById('app');
      if (!appRoot) {
        requestAnimationFrame(attachPrePaintAdminObserver);
        return;
      }
      const checkNow = () => {
        if ((appRoot.textContent || '').includes('ADMIN BACKEND')) {
          document.body.classList.add('as-admin-mode-active');
          renderUnifiedAdmin(false);
        } else {
          document.body.classList.remove('as-admin-mode-active');
        }
      };
      new MutationObserver(checkNow).observe(appRoot, { childList: true, subtree: true });
      checkNow();
    }

    attachPrePaintAdminObserver();

    if (window.__MASTER_RUNTIME_TIMER__) clearInterval(window.__MASTER_RUNTIME_TIMER__);
    window.__MASTER_RUNTIME_TIMER__ = setInterval(() => {
      runGlobalUiEnhancers();
      scanAndAttachVipEye();
      renderUnifiedAdmin(false);
    }, 220);

    runGlobalUiEnhancers();
