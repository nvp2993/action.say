    function applyHomeScreenIcon(customDataUrl = null) {
      const appleLink = document.getElementById('apple-touch-icon-link');
      const favLink = document.getElementById('favicon-link');
      if (customDataUrl) {
        if (appleLink) appleLink.href = customDataUrl;
        if (favLink) favLink.href = customDataUrl;
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#222222';
      ctx.beginPath();
      ctx.moveTo(0, 185); ctx.lineTo(145, 115); ctx.lineTo(125, 0); ctx.lineTo(165, 0); ctx.lineTo(215, 240); ctx.lineTo(0, 210);
      ctx.closePath(); ctx.fill();
      ctx.font = '900 360px Georgia, serif'; ctx.fillText('S', 280, 495);
      ctx.fillStyle = '#ffffff'; ctx.font = '900 108px Inter, Arial, sans-serif';
      ctx.fillText('acti', 52, 186); ctx.fillText('n', 385, 186);
      ctx.beginPath(); ctx.roundRect(295, 102, 82, 86, 26); ctx.fill();
      ctx.fillStyle = '#e11d2e';
      ctx.beginPath(); ctx.moveTo(304, 172); ctx.quadraticCurveTo(335, 116, 351, 108); ctx.lineTo(368, 170); ctx.quadraticCurveTo(340, 130, 304, 172);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(338, 159, 7.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.font = '800 52px Inter, Arial, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('m e d i a', 256, 246); ctx.font = '900 32px Inter, Arial, sans-serif'; ctx.fillText('x', 256, 300);
      ctx.font = '900 122px Inter, Arial, sans-serif'; ctx.fillText('say', 256, 405);
      ctx.font = '900 44px Inter, Arial, sans-serif'; ctx.fillText('studios', 210, 452);
      try {
        const pngDataUrl = canvas.toDataURL('image/png');
        if (appleLink) appleLink.href = pngDataUrl;
        if (favLink) favLink.href = pngDataUrl;
      } catch (e) {}
    }

    function getAutoHighlightColor(locationStr = '', partnerStr = '') {
      const s = `${locationStr} ${partnerStr}`.toLowerCase();
      if (s.includes('bận') || s.includes('can tho') || s.includes('cần thơ') || s.includes('mất tích')) return '#f5e18c';
      if (s.includes('kê gà') || s.includes('ke ga') || s.includes('phú quốc') || s.includes('phu quoc')) return '#faeec7';
      if (s.includes('hồ tràm') || s.includes('ho tram') || s.includes('vũng tàu') || s.includes('vung tau')) return '#c9bee8';
      if (s.includes('cam ranh') || s.includes('ninh chữ') || s.includes('ninh chu') || s.includes('long khánh') || s.includes('lk')) return '#a8d0a0';
      if (s.includes('mũi né') || s.includes('mui ne') || s.includes('phan thiết') || s.includes('phan thiet') || s.includes('nha trang') || s.includes('tây ninh') || s.includes('tay ninh') || s.includes('quy nhơn') || s.includes('hội an')) return '#f2c1a0';
      if (s.includes('huế') || s.includes('hue') || s.includes('đl') || s.includes('đà lạt') || s.includes('da lat') || s.includes('đà nẵng')) return '#dbe89c';
      if (s.includes('bình dương') || s.includes('binh duong') || s.includes('đồng tháp') || s.includes('dong thap') || s.includes('bến tre') || s.includes('vĩnh long') || s.includes('bình phước')) return '#f2cbc6';
      if (s.includes('long an') || s.includes('đồng nai') || s.includes('dong nai') || s.includes('ninh bình') || s.includes('hà nội')) return '#cbd6db';
      if (s.includes('sg') || s.includes('sài gòn') || s.includes('sai gon') || s.includes('golf') || s.includes('q2')) return '#a4d8f7';
      if (s.includes('hcm') || s.includes('nhà bè') || s.includes('cần giờ')) return '#c7ebd8';
      return '#dbeafe';
    }

    try {
      const savedLocalShows = localStorage.getItem('as_shows_backup_2026');
      if (savedLocalShows) {
        const parsed = JSON.parse(savedLocalShows);
        if (Array.isArray(parsed) && parsed.length > 0) state.shows = parsed;
      }
      const savedLocalPins = localStorage.getItem('as_pins_backup_2026');
      if (savedLocalPins) state.pinsMap = { ...state.pinsMap, ...JSON.parse(savedLocalPins) };
      const savedLocalUser = localStorage.getItem('as_user_backup_2026');
      if (savedLocalUser) state.currentUserId = savedLocalUser;
    } catch (e) {}

    function saveShowsToLocalBackup() {
      try { localStorage.setItem('as_shows_backup_2026', JSON.stringify(state.shows)); } catch (e) {}
    }

    window.addEventListener('hashchange', () => {
      state.isBackendPortal = window.location.hash === '#admin';
      renderApp();
    });

    let db = null; let auth = null;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'action-say-media-2026';

    async function initFirebaseCloud() {
      try {
        const firebaseConfig = (typeof __firebase_config !== 'undefined' && __firebase_config) ? JSON.parse(__firebase_config) : MY_FIREBASE_CONFIG;
        if (firebaseConfig && firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("AIzaSy...")) {
          const app = initializeApp(firebaseConfig);
          auth = getAuth(app); db = getFirestore(app);
          await signInAnonymously(auth);
          onAuthStateChanged(auth, (u) => {
            state.user = u;
            if (u && db) attachFirestoreListeners(u);
          });
        }
      } catch (e) {}
    }

    function attachFirestoreListeners(u) {
      const showsCol = collection(db, 'artifacts', appId, 'public', 'data', 'shows');
      onSnapshot(showsCol, async (snap) => {
        state.cloudSynced = true;
        if (!snap.empty) {
          state.shows = snap.docs.map(d => d.data());
          saveShowsToLocalBackup();
        }
        renderApp();
      }, () => { state.cloudSynced = false; renderApp(); });
    }

    function getMember(id) {
      return state.members.find(m => m.id === id) || state.members[0] || INITIAL_TEAM_MEMBERS[0];
    }

    function getMatrixColumns() {
      return [...state.members].sort((a, b) => (a.order || 99) - (b.order || 99));
    }

    function canEditShow(show) {
      if (!show) return false;
      if (state.isAdminMode) return true;
      return String(show.creatorId || show.ownerId || '').trim() === String(state.currentUserId || '').trim();
    }

    function formatDayMonth(dateStr) {
      if (!dateStr) return '';
      const p = dateStr.split('-');
      if (p.length !== 3) return dateStr;
      return `${parseInt(p[2], 10)}/${parseInt(p[1], 10)}`;
    }

    function escapeHtml(str = '') {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showToast(message, type = 'success') {
      state.toast = { message, type };
      renderApp();
      setTimeout(() => { state.toast = null; renderApp(); }, 2600);
    }

    function renderPillHtml(memberId, size = 'xs', extraClasses = '', onClickAttr = '', roleTag = '') {
      const m = state.members.find(x => x.id === memberId);
      if (!m) return '';
      const sizeCls = size === 'xs' ? 'px-1.5 py-0.5 text-[9px]' : (size === 'md' ? 'px-2.5 py-1 text-xs' : 'px-2 py-0.5 text-[10px]');
      let roleStr = Array.isArray(roleTag) ? roleTag.join(', ') : (roleTag || '');
      const roleSpan = roleStr ? `<span class="ml-1 opacity-95 font-bold">• ${escapeHtml(roleStr)}</span>` : '';
      return `<span ${onClickAttr} style="background-color:${m.bg};color:${m.text}" class="inline-flex items-center font-extrabold rounded-full tracking-wide uppercase select-none shadow-2xs ${sizeCls} ${extraClasses}">${escapeHtml(m.shortLabel)}${roleSpan}</span>`;
    }

    function getFilteredShows() {
      return state.shows.filter(sh => {
        if (!state.filterAllMonthsInList) {
          const start = new Date(sh.startDate + 'T00:00:00');
          const end = new Date((sh.endDate < sh.startDate ? sh.startDate : sh.endDate) + 'T00:00:00');
          const mStart = new Date(state.selectedYear, state.selectedMonth - 1, 1);
          const mEnd = new Date(state.selectedYear, state.selectedMonth, 0);
          if (end < mStart || start > mEnd) return false;
        }
        if (state.filterMemberId !== 'all' && !(sh.memberIds || []).includes(state.filterMemberId)) return false;
        if (state.searchQuery.trim() !== '') {
          const q = state.searchQuery.toLowerCase();
          const loc = (sh.location || '').toLowerCase();
          const part = (sh.partner || '').toLowerCase();
          const note = (sh.note || '').toLowerCase();
          const sttStr = String(sh.stt || '');
          const ownerName = (sh.ownerLabel || getMember(sh.ownerId)?.name || '').toLowerCase();
          return loc.includes(q) || part.includes(q) || note.includes(q) || ownerName.includes(q) || sttStr.includes(q);
        }
        return true;
      }).sort((a, b) => {
        if (a.startDate !== b.startDate) return (a.startDate || '').localeCompare(b.startDate || '');
        return (Number(a.stt) || 0) - (Number(b.stt) || 0);
      });
    }

    function getMatrixData() {
      const daysInMonth = new Date(state.selectedYear, state.selectedMonth, 0).getDate();
      const matrix = {};
      for (let d = 1; d <= daysInMonth; d++) {
        matrix[d] = {};
        state.members.forEach(m => { matrix[d][m.id] = []; });
      }
      state.shows.forEach(sh => {
        if (!sh.startDate || !sh.endDate) return;
        const start = new Date(sh.startDate + 'T00:00:00');
        const end = new Date(sh.endDate + 'T00:00:00');
        if (isNaN(start) || isNaN(end)) return;
        for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
          if (dt.getFullYear() === state.selectedYear && (dt.getMonth() + 1) === state.selectedMonth) {
            const day = dt.getDate();
            if (matrix[day]) {
              (sh.memberIds || []).forEach(mid => {
                if (matrix[day][mid]) matrix[day][mid].push(sh);
              });
            }
          }
        }
      });
      return { daysInMonth, matrix };
    }

    function getBusyMembersMap(startDate, endDate, excludeShowId = null) {
      const map = {};
      if (!startDate || !endDate) return map;
      const s1 = new Date(startDate + 'T00:00:00');
      const e1 = new Date(endDate + 'T00:00:00');
      state.shows.forEach(sh => {
        if (excludeShowId && sh.id === excludeShowId) return;
        const s2 = new Date(sh.startDate + 'T00:00:00');
        const e2 = new Date(sh.endDate + 'T00:00:00');
        if (s1 <= e2 && e1 >= s2) {
          (sh.memberIds || []).forEach(mid => {
            if (!map[mid]) map[mid] = [];
            map[mid].push(sh.location);
          });
        }
      });
      return map;
    }

    window.appActions = {
      tapLogoSecret() {
        state.logoTapCount += 1;
        if (state.logoTapCount >= 5) {
          state.logoTapCount = 0; state.isBackendPortal = true;
          window.location.hash = 'admin'; renderApp();
          showToast('Đã mở cổng Quản Trị Backend (/admin)');

      exitBackendPortal() {
        state.isBackendPortal = false;
        if (window.location.hash === '#admin') history.pushState('', document.title, window.location.pathname + window.location.search);
        renderApp();
      },
      setBackendTab(tab) { state.backendTab = tab; renderApp(); },

        state.activeTab = tab;
        if (tab === 'free_finder') {
          const today = getDefaultNewShowDate();

      toggleAllMonths() { state.filterAllMonthsInList = !state.filterAllMonthsInList; renderApp(); },

        state.searchQuery = val; renderApp();

        if (input) { input.focus(); input.setSelectionRange(val.length, val.length); }

      openShowDetail(showId) { state.detailShowId = showId; renderApp(); },
      closeShowDetail() { state.detailShowId = null; renderApp(); },
      openAddModal(prefillDate = null, prefillMemberId = null) {
        const defaultDate = prefillDate || getDefaultNewShowDate();
        const memId = prefillMemberId || state.currentUserId;
        state.formModal = {
          mode: 'add', showId: null, partner: '', location: '',
          startDate: defaultDate, endDate: defaultDate,
          memberIds: [memId], roles: {}, postStatus: 'pending',
          ownerId: state.currentUserId, color: '#c9bee8', note: '', error: ''
        };
        renderApp();
      },
      openEditModal(showId) {
        const sh = state.shows.find(s => s.id === showId);
        if (!sh || !canEditShow(sh)) { showToast('Chỉ Người tạo show hoặc Admin mới được sửa!', 'error'); return; }
        state.detailShowId = null;
        state.formModal = {
          mode: 'edit', showId: sh.id, stt: sh.stt, partner: sh.partner || '', location: sh.location || '',
          startDate: sh.startDate, endDate: sh.endDate, memberIds: [...(sh.memberIds || [])],
          roles: JSON.parse(JSON.stringify(sh.roles || {})), postStatus: sh.postStatus || 'pending',
          ownerId: sh.ownerId, color: sh.color || '#c9bee8', note: sh.note || '', error: ''
        };
        renderApp();
      },
      closeFormModal() { state.formModal = null; renderApp(); },
      updateFormField(field, val) {
        if (!state.formModal) return;
        state.formModal[field] = val;

    function getShowDays(sh) {
      if (!sh.startDate || !sh.endDate) return 1;
      const s = new Date(sh.startDate + 'T00:00:00');
      const e = new Date(sh.endDate + 'T00:00:00');
      const diffTime = e - s;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
      return diffDays > 0 ? diffDays : 1;
    }

    function getDefaultRateForTask(taskKey, sh) {
      const days = getShowDays(sh);
      if (taskKey === 'quay' || taskKey === 'chup') return days === 1 ? 1500000 : 1200000 * days;
      if (taskKey === 'dung') return 1000000;
      if (taskKey === 'lamhinh') return 300000;
      if (taskKey === 'flycam') return 1000000;
      if (taskKey === 'gimbal') return 200000;
      return 0;
    }

      return `
        <div class="flex-1 flex flex-col min-h-0 bg-slate-100 text-xs font-sans">
          <div class="bg-white p-3 border-b border-slate-200 shrink-0 space-y-2.5">
            <div class="flex items-center justify-between gap-2">
              <span class="font-black text-xs text-slate-900 uppercase">💼 CTP (${curMem.name})</span>
              <div class="flex items-center gap-1 overflow-x-auto no-scrollbar bg-slate-100 p-1 rounded-xl">
                ${[6, 7, 8, 9, 10, 11, 12].map(m => `<button onclick="ctpActions.setMonth(${m})" class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold ${state.ctpMonth === m ? 'bg-indigo-600 text-white' : 'text-slate-600'}">T${m}</button>`).join('')}
              </div>
            </div>
            <div class="flex items-center justify-between gap-3 pt-1 border-t border-slate-100">
              <select onchange="ctpActions.setOwner(this.value)" class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold">
                <option value="all">--- Tất cả Chủ Show ---</option>
                ${state.members.map(m => `<option value="${m.id}" ${state.ctpOwnerId === m.id ? 'selected' : ''}>${m.name}</option>`).join('')}
              </select>
              <div class="text-right bg-emerald-50 px-3 py-1.5 rounded-2xl border border-emerald-200 shrink-0">
                <span class="text-[9px] text-emerald-700 font-bold block">Tổng T${state.ctpMonth}</span>
                <span class="text-xs font-black text-emerald-700 font-mono">${totalGrandSum.toLocaleString('vi-VN')}đ</span>
              </div>
            </div>
          </div>
          <div class="flex-1 min-h-0 overflow-y-auto custom-scroll p-3 space-y-3">
            ${filteredShows.length === 0 ? `<div class="text-center py-16 text-slate-400">Không có show nào trong tháng T${state.ctpMonth}</div>` : filteredShows.map((sh, idx) => {
              const item = state.ctpItems[sh.id] || { tasks: {}, extras: [] };
              const days = getShowDays(sh);
              let showSubTotal = 0; Object.values(item.tasks).forEach(v => showSubTotal += v);
              (item.extras || []).forEach(ex => showSubTotal += (Number(ex.amount) || 0));
              const taskList = [
                { key: 'quay', label: `Quay (${days}n)`, def: days === 1 ? 1500000 : 1200000 * days },
                { key: 'dung', label: 'Dựng', def: 1000000 },
                { key: 'chup', label: `Chụp (${days}n)`, def: days === 1 ? 1500000 : 1200000 * days },
                { key: 'flycam', label: 'Flycam', def: 1000000 }
              ];
              return `
                <div class="bg-white rounded-3xl border border-slate-200 p-4 space-y-3">
                  <div class="flex justify-between border-b pb-2">
                    <div><b>#${idx + 1} - ${escapeHtml(sh.location)}</b></div>
                    <div class="text-emerald-700 font-bold font-mono">${showSubTotal.toLocaleString('vi-VN')}đ</div>
                  </div>
                  <div class="flex flex-wrap gap-1.5">
                    ${taskList.map(t => {
                      const isChecked = item.tasks[t.key] !== undefined;
                      const curVal = isChecked ? item.tasks[t.key] : t.def;
                      return `
                        <div class="inline-flex flex-col">
                          <button type="button" onclick="ctpActions.toggleTask('${sh.id}', '${t.key}')" class="px-2.5 py-1 rounded-full text-[10px] font-extrabold border ${isChecked ? 'bg-indigo-600 text-white' : 'bg-slate-50 text-slate-600'}">${t.label}</button>
                          ${isChecked ? `<input type="text" inputmode="numeric" value="${Number(curVal).toLocaleString('vi-VN')}" onblur="ctpActions.updateTaskPrice('${sh.id}', '${t.key}', this); renderApp();" class="mt-1 w-20 px-1 bg-indigo-50 border rounded text-[10px] font-mono text-right" />` : ''}
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          <div class="p-3 bg-white border-t shrink-0">
            <button type="button" onclick="ctpActions.generateBill()" class="w-full bg-emerald-600 text-white font-black py-3 rounded-2xl text-xs">🔥 LỤM (TỔNG HỢP BILL)</button>
          </div>
        </div>
      `;
    }

    function renderCtpBillModalHtml() {
      const bm = state.ctpBillModal; if (!bm) return '';
      return `
        <div onclick="ctpActions.closeBillModal()" class="fixed inset-0 z-50 bg-black/65 flex items-center justify-center p-4">
          <div onclick="event.stopPropagation()" class="bg-white w-full max-w-md rounded-3xl p-4 space-y-3 text-xs">
            <textarea id="ctp-bill-textarea" rows="10" class="w-full p-3 bg-slate-50 border rounded-2xl font-mono text-[11px]">${escapeHtml(bm.text)}</textarea>
            <button onclick="ctpActions.copyBillText()" class="w-full bg-emerald-600 text-white font-black py-3 rounded-xl">📋 Copy Gửi Zalo</button>
          </div>
        </div>
      `;
    }

    function renderBottomNavHtml() {
      return `
        <nav style="padding-bottom: max(4px, var(--sab));" class="bg-white border-t border-slate-200 px-1 pt-1 shrink-0 z-30 flex items-center justify-around">
          <button onclick="appActions.setTab('shows')" class="flex flex-col items-center py-0.5 px-2 ${state.activeTab === 'shows' ? 'text-indigo-600 font-bold' : 'text-slate-400'}"><i class="fa-solid fa-table-list text-sm"></i><span class="text-[10px]">Lịch Show</span></button>
          <button onclick="appActions.setTab('matrix')" class="flex flex-col items-center py-0.5 px-2 ${state.activeTab === 'matrix' ? 'text-indigo-600 font-bold' : 'text-slate-400'}"><i class="fa-solid fa-calendar-days text-sm"></i><span class="text-[10px]">Công Tác</span></button>
          <button onclick="appActions.openAddModal()" class="bg-indigo-600 text-white font-extrabold px-3 py-1.5 rounded-full shadow-md text-xs">⚡ NỔ</button>
          <button onclick="appActions.setTab('free_finder')" class="flex flex-col items-center py-0.5 px-2 ${state.activeTab === 'free_finder' ? 'text-indigo-600 font-bold' : 'text-slate-400'}"><i class="fa-solid fa-user-check text-sm"></i><span class="text-[10px]">Rảnh</span></button>
          <button onclick="appActions.setTab('ctp')" class="flex flex-col items-center py-0.5 px-2 ${state.activeTab === 'ctp' ? 'text-indigo-600 font-bold' : 'text-slate-400'}"><i class="fa-solid fa-file-invoice-dollar text-sm"></i><span class="text-[10px]">CTP</span></button>
          <button onclick="appActions.openGuideModal()" class="flex flex-col items-center py-0.5 px-2 text-slate-400"><i class="fa-solid fa-mobile-screen-button text-sm"></i><span class="text-[10px]">iPhone</span></button>
        </nav>
      `;
    }

    function renderDetailModalHtml() {
      if (!state.detailShowId) return '';
      const sh = state.shows.find(s => s.id === state.detailShowId);
      if (!sh) return '';
      return `
        <div onclick="appActions.closeShowDetail()" class="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center">
          <div onclick="event.stopPropagation()" class="ios-sheet bg-white w-full max-w-md rounded-t-3xl p-4 space-y-3">
            <h3 class="text-base font-black">📍 ${escapeHtml(sh.location)}</h3>
            <p class="text-xs text-slate-500">Đối tác: ${escapeHtml(sh.partner || '-')}</p>
            <button onclick="appActions.deleteShow('${sh.id}')" class="w-full bg-rose-50 text-rose-600 py-2 rounded-xl text-xs font-bold">Xoá Show</button>
          </div>
        </div>
      `;
    }

    function renderFormModalHtml() {
      const f = state.formModal; if (!f) return '';
      return `
        <div onclick="appActions.closeFormModal()" class="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center">
          <div onclick="event.stopPropagation()" class="ios-sheet bg-white w-full max-w-lg rounded-t-3xl p-4 space-y-3 max-h-[90dvh] overflow-y-auto text-xs">
            <h3 class="font-black text-sm uppercase text-indigo-700">⚡ NỔ SHOW MỚI</h3>
            <input type="text" value="${escapeHtml(f.location)}" oninput="appActions.updateFormField('location', this.value)" placeholder="Địa điểm..." class="w-full px-3 py-2 border rounded-xl font-bold" />
            <div class="grid grid-cols-2 gap-2">
              <input type="date" value="${f.startDate}" onchange="appActions.updateFormField('startDate', this.value)" class="px-2 py-1.5 border rounded-xl" />
              <input type="date" value="${f.endDate}" onchange="appActions.updateFormField('endDate', this.value)" class="px-2 py-1.5 border rounded-xl" />
            </div>
            <div class="grid grid-cols-3 gap-1">${state.members.map(m => `<div onclick="appActions.toggleFormMember('${m.id}')" class="p-2 border rounded-lg text-center cursor-pointer ${f.memberIds.includes(m.id) ? 'bg-indigo-600 text-white font-bold' : 'bg-white'}">${m.shortLabel}</div>`).join('')}</div>
            <button onclick="appActions.saveShowForm()" class="w-full bg-indigo-600 text-white font-black py-2.5 rounded-xl">LƯU SHOW</button>
          </div>
        </div>
      `;
    }

    function renderPinModalHtml() {
      const pm = state.pinModal; if (!pm) return '';
      return `
        <div onclick="appActions.closePinModal()" class="fixed inset-0 z-50 bg-black/65 flex items-center justify-center p-4">
          <div onclick="event.stopPropagation()" class="bg-white w-full max-w-sm rounded-3xl p-4 space-y-3 text-xs">
            ${pm.step === 'select' ? `
              <div class="grid grid-cols-2 gap-1.5 max-h-[55dvh] overflow-y-auto">${state.members.map(m => `<button onclick="appActions.chooseMemberForPin('${m.id}')" class="p-2 border rounded-xl flex justify-between items-center">${renderPillHtml(m.id, 'sm')}</button>`).join('')}</div>
            ` : `
              <div class="flex flex-col items-center space-y-3 py-2">
                <input id="native-pin-input" type="password" inputmode="numeric" maxlength="4" autofocus value="${escapeHtml(pm.pinInput)}" oninput="appActions.handleNativePinInput(this.value)" placeholder="••••" class="w-40 text-center text-xl tracking-widest font-mono py-2 border-2 rounded-2xl bg-slate-50" />
                <div id="pin-error-msg" class="text-xs font-bold text-rose-600 text-center"></div>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderGuideModalHtml() {
      if (!state.guideModal) return '';
      return `
        <div onclick="appActions.closeGuideModal()" class="fixed inset-0 z-50 bg-black/65 flex items-end sm:items-center justify-center">
          <div onclick="event.stopPropagation()" class="ios-sheet bg-white w-full max-w-md rounded-t-3xl p-4 space-y-3 text-xs">
            <h3 class="font-black text-sm">Cài Full Màn Hình iPhone</h3>
            <p>Mở trên Safari -> Chia sẻ (Share) -> Thêm vào MH chính.</p>
          </div>
        </div>
      `;
    }

    function renderToastHtml() {
      if (!state.toast) return '';
      return `<div class="fixed top-12 left-1/2 -translate-x-1/2 z-50 max-w-xs w-full px-3 pointer-events-none"><div class="p-2.5 rounded-xl shadow-xl text-[11px] font-bold text-white bg-slate-900 flex items-center gap-2"><i class="fa-solid fa-circle-check text-emerald-400"></i><span>${escapeHtml(state.toast.message)}</span></div></div>`;
    }

    function renderApp() {
      const root = document.getElementById('app'); if (!root) return;
      let main = '';
      if (state.activeTab === 'shows') main = renderShowsTabHtml();
      else if (state.activeTab === 'matrix') main = renderMatrixTabHtml();
      else if (state.activeTab === 'free_finder') main = renderFreeFinderTabHtml();
      else if (state.activeTab === 'ctp') main = renderCtpTabHtml();

      root.innerHTML = `${renderHeaderHtml()}${main}${renderBottomNavHtml()}${renderDetailModalHtml()}${renderFormModalHtml()}${renderZaloTomorrowModalHtml()}${renderPinModalHtml()}${renderGuideModalHtml()}${renderCtpBillModalHtml()}${renderToastHtml()}`;
    }

    window.state = state;
    applyHomeScreenIcon(state.customLogoUrl);
    renderApp();
    initFirebaseCloud();
  </script>
</body>
</html>
