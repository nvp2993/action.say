    function applyHomeScreenIcon(customDataUrl = null) {
      const appleLink = document.getElementById('apple-touch-icon-link');
      const favLink = document.getElementById('favicon-link');
      if (customDataUrl) {
        if (appleLink) appleLink.href = customDataUrl;
        if (favLink) favLink.href = customDataUrl;
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#222222';
      ctx.beginPath();
      ctx.moveTo(0, 185); ctx.lineTo(145, 115); ctx.lineTo(125, 0); ctx.lineTo(165, 0); ctx.lineTo(215, 240); ctx.lineTo(0, 210);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#222222';
      ctx.font = '900 360px Georgia, serif';
      ctx.fillText('S', 280, 495);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 108px Inter, Arial, sans-serif';
      ctx.fillText('acti', 52, 186);
      ctx.fillText('n', 385, 186);

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(295, 102, 82, 86, 26);
      ctx.fill();

      ctx.fillStyle = '#e11d2e';
      ctx.beginPath();
      ctx.moveTo(304, 172); ctx.quadraticCurveTo(335, 116, 351, 108); ctx.lineTo(368, 170); ctx.quadraticCurveTo(340, 130, 304, 172);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.arc(338, 159, 7.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 52px Inter, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('m e d i a', 256, 246);
      ctx.font = '900 32px Inter, Arial, sans-serif';
      ctx.fillText('x', 256, 300);
      ctx.font = '900 122px Inter, Arial, sans-serif';
      ctx.fillText('say', 256, 405);
      ctx.font = '900 44px Inter, Arial, sans-serif';
      ctx.fillText('studios', 210, 452);

      try {
        const pngDataUrl = canvas.toDataURL('image/png');
        if (appleLink) appleLink.href = pngDataUrl;
        if (favLink) favLink.href = pngDataUrl;
      } catch (e) {}
    }

    function getAutoHighlightColor(locationStr = '', partnerStr = '') {
      const s = `${locationStr} ${partnerStr}`.toLowerCase();
      if (s.includes('bận') || s.includes('can tho') || s.includes('cần thơ') || s.includes('mất tích')) return '#f5e18c';
      if (s.includes('kê gà') || s.includes('ke ga') || s.includes('phú quốc') || s.includes('phu quoc')) return '#faeec7';
      if (s.includes('hồ tràm') || s.includes('ho tram') || s.includes('vũng tàu') || s.includes('vung tau')) return '#c9bee8';
      if (s.includes('cam ranh') || s.includes('ninh chữ') || s.includes('ninh chu') || s.includes('long khánh') || s.includes('lk')) return '#a8d0a0';
      if (s.includes('mũi né') || s.includes('mui ne') || s.includes('phan thiết') || s.includes('phan thiet') || s.includes('nha trang') || s.includes('tây ninh') || s.includes('tay ninh') || s.includes('quy nhơn') || s.includes('hội an')) return '#f2c1a0';
      if (s.includes('huế') || s.includes('hue') || s.includes('đl') || s.includes('đà lạt') || s.includes('da lat') || s.includes('đà nẵng')) return '#dbe89c';
      if (s.includes('bình dương') || s.includes('binh duong') || s.includes('đồng tháp') || s.includes('dong thap') || s.includes('bến tre') || s.includes('vĩnh long') || s.includes('bình phước')) return '#f2cbc6';
      if (s.includes('long an') || s.includes('đồng nai') || s.includes('dong nai') || s.includes('ninh bình') || s.includes('hà nội')) return '#cbd6db';
      if (s.includes('sg') || s.includes('sài gòn') || s.includes('sai gon') || s.includes('golf') || s.includes('q2')) return '#a4d8f7';
      if (s.includes('hcm') || s.includes('nhà bè') || s.includes('cần giờ')) return '#c7ebd8';
      return '#dbeafe';
    }

    function getDefaultNewShowDate() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function resolveOwnerIdFromName(ownerName = '', memberIds = []) {
      const clean = (ownerName || '').trim().toLowerCase();
      if (clean) {
        const found = INITIAL_TEAM_MEMBERS.find(
          m => m.name.toLowerCase() === clean || m.shortLabel.toLowerCase() === clean
        );
        if (found) return found.id;
      }
      return memberIds[0] || 'khoa';
    }

    const INITIAL_SHOWS_DATA = window.__BAKED_SHOWS_DATA__ || [];

    const state = {
      user: null,
      cloudSynced: false,
      members: window.__BAKED_MEMBERS_DATA__ || [...INITIAL_TEAM_MEMBERS],
      shows: [...INITIAL_SHOWS_DATA],
      pinsMap: window.__BAKED_PINS_DATA__ || { ...DEFAULT_PINS_MAP },
      customLogoUrl: window.__BAKED_CUSTOM_LOGO__ || null,
      adminAuth: { ...DEFAULT_ADMIN_AUTH },
      currentUserId: 'khoa',
      isAdminMode: false,

      isBackendPortal: window.location.hash === '#admin',
      backendTab: 'dashboard',
      logoTapCount: 0,

      activeTab: 'shows',
      showListMode: 'table',
      zenFullscreen: false,
      compactMatrix: true,
      selectedMonth: new Date().getMonth() + 1,
      selectedYear: new Date().getFullYear(),
      filterAllMonthsInList: false,
      searchQuery: '',
      filterMemberId: 'all',

      checkStart: new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10),

      ctpMonth: new Date().getMonth() + 1,
      ctpOwnerId: 'all',
      ctpItems: {},
      ctpBillModal: null,

      detailShowId: null,
      formModal: null,
      pinModal: null,
      selfChangePinModal: null,
      guideModal: false,
      zaloTomorrowModal: null,

      adminLoginInput: { email: '', password: '', error: '' },
      newMemberForm: { name: '', shortLabel: '', pin: '1234', colorIdx: 5 },
      accountDraft: { email: 'admin@actionsay.vn', password: 'admin2026' },
      toast: null

    try {
      const savedLocalShows = localStorage.getItem('as_shows_backup_2026');
      if (savedLocalShows) {
        const parsed = JSON.parse(savedLocalShows);
        if (Array.isArray(parsed) && parsed.length > 0) state.shows = parsed;
      }
      const savedLocalPins = localStorage.getItem('as_pins_backup_2026');
      if (savedLocalPins) state.pinsMap = { ...state.pinsMap, ...JSON.parse(savedLocalPins) };
      const savedLocalUser = localStorage.getItem('as_user_backup_2026');
      if (savedLocalUser) state.currentUserId = savedLocalUser;
    } catch (e) {}

    function saveShowsToLocalBackup() {
      try {
        localStorage.setItem('as_shows_backup_2026', JSON.stringify(state.shows));
      } catch (e) {}
    }

    window.addEventListener('hashchange', () => {
      state.isBackendPortal = window.location.hash === '#admin';
      renderApp();
    });

    let db = null;
    let auth = null;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'action-say-media-2026';

    async function initFirebaseCloud() {
      try {
        const firebaseConfig = (typeof __firebase_config !== 'undefined' && __firebase_config)
          ? JSON.parse(__firebase_config)
          : MY_FIREBASE_CONFIG;

        if (firebaseConfig && firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("AIzaSy...")) {
          const app = initializeApp(firebaseConfig);
          auth = getAuth(app);
          db = getFirestore(app);

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }

          onAuthStateChanged(auth, (u) => {
            state.user = u;
            if (u && db) attachFirestoreListeners(u);
          });
        }
      } catch (e) {
        console.warn('Chế độ chạy độc lập:', e);
      }
    }

    function attachFirestoreListeners(u) {
      const showsCol = collection(db, 'artifacts', appId, 'public', 'data', 'shows');
      onSnapshot(
        showsCol,
        async (snap) => {
          state.cloudSynced = true;
          if (snap.empty && INITIAL_SHOWS_DATA.length > 0) {
            try {
              await Promise.all(
                INITIAL_SHOWS_DATA.map(sh =>
                  setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shows', sh.id), sh)
                )
              );
            } catch (err) { console.error(err); }
          } else if (!snap.empty) {
            state.shows = snap.docs.map(d => d.data());
            saveShowsToLocalBackup();
          }
          renderApp();
        },
        () => { state.cloudSynced = false; renderApp(); }
      );

      const membersCol = collection(db, 'artifacts', appId, 'public', 'data', 'team_members');
      onSnapshot(membersCol, async (snap) => {
        if (!snap.empty) {
          const list = snap.docs.map(d => d.data()).sort((a, b) => (a.order || 99) - (b.order || 99));
          if (list.length > 0) state.members = list;
          renderApp();
        }
      });

      const pinsCol = collection(db, 'artifacts', appId, 'public', 'data', 'member_pins');
      onSnapshot(pinsCol, (snap) => {
        const pDoc = snap.docs.find(d => d.id === 'pins_config');
        if (pDoc) state.pinsMap = { ...DEFAULT_PINS_MAP, ...pDoc.data() };
        const aDoc = snap.docs.find(d => d.id === 'admin_auth');
        if (aDoc) {
          state.adminAuth = { ...DEFAULT_ADMIN_AUTH, ...aDoc.data() };
          state.accountDraft.email = state.adminAuth.email;
          state.accountDraft.password = state.adminAuth.password;
        }
        renderApp();
      });

      const sessionCol = collection(db, 'artifacts', appId, 'users', u.uid, 'device_session');
      onSnapshot(sessionCol, (snap) => {
        const sDoc = snap.docs.find(d => d.id === 'active_profile');
        if (sDoc) {
          const d = sDoc.data();
          if (d.memberId) state.currentUserId = d.memberId;
          if (typeof d.isAdmin === 'boolean') state.isAdminMode = d.isAdmin;
          renderApp();
        }
      });
    }

    function getMember(id) {
      return state.members.find(m => m.id === id) || state.members[0] || INITIAL_TEAM_MEMBERS[0];
    }

    function getMatrixColumns() {
      return [...state.members].sort((a, b) => (a.order || 99) - (b.order || 99));
    }

    // CHỈ NGƯỜI TẠO (creatorId) hoặc Admin mới được quyền sửa/xóa. Chủ show chỉ để thông tin.
    function canEditShow(show) {
      if (!show) return false;
      if (state.isAdminMode) return true;
      const currentId = String(state.currentUserId || '').trim();
      const creatorId = String(show.creatorId || show.ownerId || '').trim();
      return creatorId !== '' && creatorId === currentId;
    }

    function formatDayMonth(dateStr) {
      if (!dateStr) return '';
      const p = dateStr.split('-');
      if (p.length !== 3) return dateStr;
      return `${parseInt(p[2], 10)}/${parseInt(p[1], 10)}`;
    }

    function escapeHtml(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(message, type = 'success') {
      state.toast = { message, type };
      renderApp();
      setTimeout(() => {
        state.toast = null;
        renderApp();
      }, 2600);
    }

    function renderPillHtml(memberId, size = 'xs', extraClasses = '', onClickAttr = '', roleTag = '') {
      const m = state.members.find(x => x.id === memberId);
      if (!m) return '';
      const sizeCls = size === 'xs'
        ? 'px-1.5 py-0.5 text-[9px]'
        : size === 'md'
        ? 'px-2.5 py-1 text-xs'
        : 'px-2 py-0.5 text-[10px]';
        
      let roleStr = '';
      if (Array.isArray(roleTag)) {
        roleStr = roleTag.join(', ');
      } else if (roleTag) {
        roleStr = roleTag;
      }
      const roleSpan = roleStr ? `<span class="ml-1 opacity-95 font-bold">• ${escapeHtml(roleStr)}</span>` : '';
      return `<span ${onClickAttr} style="background-color:${m.bg};color:${m.text}" class="inline-flex items-center font-extrabold rounded-full tracking-wide uppercase select-none shadow-2xs ${sizeCls} ${extraClasses}">${escapeHtml(m.shortLabel)}${roleSpan}</span>`;
    }

    function getFilteredShows() {
      return state.shows
        .filter(sh => {
          if (!state.filterAllMonthsInList) {
            const start = new Date(sh.startDate + 'T00:00:00');
            const end = new Date((sh.endDate < sh.startDate ? sh.startDate : sh.endDate) + 'T00:00:00');
            const mStart = new Date(state.selectedYear, state.selectedMonth - 1, 1);
            const mEnd = new Date(state.selectedYear, state.selectedMonth, 0);
            if (end < mStart || start > mEnd) return false;
          }
          if (state.filterMemberId !== 'all' && !(sh.memberIds || []).includes(state.filterMemberId)) {
            return false;
          }
          if (state.searchQuery.trim() !== '') {
            const q = state.searchQuery.toLowerCase();
            const loc = (sh.location || '').toLowerCase();
            const part = (sh.partner || '').toLowerCase();
            const note = (sh.note || '').toLowerCase();
            const sttStr = String(sh.stt || '');
            const ownerName = (sh.ownerLabel || getMember(sh.ownerId)?.name || '').toLowerCase();
            return loc.includes(q) || part.includes(q) || note.includes(q) || ownerName.includes(q) || sttStr.includes(q);
          }
          return true;
        })
        .sort((a, b) => {
          if (a.startDate !== b.startDate) return (a.startDate || '').localeCompare(b.startDate || '');
          return (Number(a.stt) || 0) - (Number(b.stt) || 0);
        });
    }

    function parseExcelDateCell(val, defaultYear = 2026) {
      if (!val && val !== 0) return '';
      if (typeof val === 'number') {
        const utcDays = Math.floor(val - 25569);
        const d = new Date(utcDays * 86400 * 1000);
        if (!isNaN(d)) {
          const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
          const dd = String(d.getUTCDate()).padStart(2, '0');
          return `${defaultYear}-${mm}-${dd}`;
        }
      }
      const s = String(val).trim();
      const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?$/);
      if (m) {
        const dd = String(parseInt(m[1], 10)).padStart(2, '0');
        const mm = String(parseInt(m[2], 10)).padStart(2, '0');
        return `${defaultYear}-${mm}-${dd}`;
      }
      return '';
    }

    function parseMemberIdsFromCell(str = '') {
      if (!str) return [];
      const upper = String(str).toUpperCase();
      const matched = [];
      state.members.forEach(m => {
        if (upper.includes(m.shortLabel.toUpperCase()) || upper.includes(m.name.toUpperCase())) {
          matched.push(m.id);
        }
      });
      return matched;
    }

    function getMatrixData() {
      const daysInMonth = new Date(state.selectedYear, state.selectedMonth, 0).getDate();
      const matrix = {};
      for (let d = 1; d <= daysInMonth; d++) {
        matrix[d] = {};
        state.members.forEach(m => { matrix[d][m.id] = []; });
      }
      state.shows.forEach(sh => {
        if (!sh.startDate || !sh.endDate) return;
        const start = new Date(sh.startDate + 'T00:00:00');
        const end = new Date(sh.endDate + 'T00:00:00');
        if (isNaN(start) || isNaN(end)) return;
        for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
          if (dt.getFullYear() === state.selectedYear && (dt.getMonth() + 1) === state.selectedMonth) {
            const day = dt.getDate();
            if (matrix[day]) {
              (sh.memberIds || []).forEach(mid => {
                if (matrix[day][mid]) matrix[day][mid].push(sh);
              });
            }
          }
        }
      });
      return { daysInMonth, matrix };
    }

    function getBusyMembersMap(startDate, endDate, excludeShowId = null) {
      const map = {};
      if (!startDate || !endDate) return map;
      const s1 = new Date(startDate + 'T00:00:00');
      const e1 = new Date(endDate + 'T00:00:00');
      state.shows.forEach(sh => {
        if (excludeShowId && sh.id === excludeShowId) return;
        const s2 = new Date(sh.startDate + 'T00:00:00');
        const e2 = new Date(sh.endDate + 'T00:00:00');
        if (s1 <= e2 && e1 >= s2) {
          (sh.memberIds || []).forEach(mid => {
            if (!map[mid]) map[mid] = [];
            map[mid].push(sh.location);
          });
        }
      });
      return map;
    }

        const endDateObj = new Date(sh.endDate + 'T00:00:00');

        const title = `🎬 Show: ${sh.location}${sh.partner ? ' - ' + sh.partner : ''}`;

        const icsLines = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//Action & Say Media//Lich Show 2026//VI',
          'BEGIN:VEVENT',
          `UID:${sh.id}@actionsay.vn`,
          `DTSTAMP:${startClean}T010000Z`,
          `DTSTART;VALUE=DATE:${startClean}`,
          `DTEND;VALUE=DATE:${endClean}`,
          `SUMMARY:${title}`,
          `DESCRIPTION:${desc}`,
          `LOCATION:${sh.location}`,
          'BEGIN:VALARM',
          'TRIGGER:-PT4H',
          'ACTION:DISPLAY',
          'DESCRIPTION:Nhắc lịch đi show ngày mai - Sạc pin & kiểm tra thẻ nhớ!',
          'END:VALARM',
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsLines], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `lich-show-${sh.startDate}.ics`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        if (!state.isAdminMode) return;
        try { localStorage.setItem('as_pins_backup_2026', JSON.stringify(state.pinsMap)); } catch (e) {}
        showToast('Đã lưu bảng mã PIN lên Cloud!');

          try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'member_pins', 'pins_config'), state.pinsMap); } catch (e) {}
        }
      },
      setCheckDate(field, val) {
        state[field] = val;
        if (field === 'checkStart' && state.checkEnd < val) state.checkEnd = val;
        renderApp();
      },
      async syncExcelShowsToCloud() {
        state.shows = [...INITIAL_SHOWS_DATA];
        saveShowsToLocalBackup();
        renderApp();
        showToast(`Đã xoá dữ liệu cũ & nạp chuẩn ${INITIAL_SHOWS_DATA.length} dòng lịch!`);
        if (state.user && db) {
          const showsCol = collection(db, 'artifacts', appId, 'public', 'data', 'shows');
          const snap = await getDocs(showsCol);
          await Promise.all(snap.docs.map(d => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shows', d.id))));
          await Promise.all(INITIAL_SHOWS_DATA.map(sh => setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shows', sh.id), sh)));
        }
      },
      triggerExcelFileUpload() {
        if (!state.isAdminMode) return;
        const el = document.getElementById('excel-file-picker');
        if (el) el.click();
      },
      triggerLogoUpload() {
        if (!state.isAdminMode) return;
        const el = document.getElementById('logo-file-picker');
        if (el) el.click();
      },
      handleCustomLogoUpload(event) {
        if (!state.isAdminMode) return;
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          state.customLogoUrl = reader.result;
          applyHomeScreenIcon(state.customLogoUrl);
          renderApp();
          showToast('Đã cập nhật ảnh Logo & Icon màn hình chính iPhone!');
        };
        reader.readAsDataURL(file);
        event.target.value = '';
      },
      async handleDirectExcelFile(event) {
        if (!state.isAdminMode) return;
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          const data = await file.arrayBuffer();
          const workbook = XLSX.read(data, { type: 'array' });
          const sheetName = workbook.SheetNames.find(n => n.toUpperCase().includes('LỊCH SHOW') || n.toUpperCase().includes('LICH SHOW')) || workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

          const imported = [];
          for (let i = 2; i < rows.length; i++) {
            const r = rows[i];
            if (!r || r.length === 0) continue;
            const sttRaw = r[0];
            const partner = String(r[1] || '').trim();
            const location = String(r[2] || '').trim();
            const startStr = parseExcelDateCell(r[3], 2026);
            const endStr = parseExcelDateCell(r[4], 2026) || startStr;
            const memIds = parseMemberIdsFromCell(r[5]);
            const ownerLabel = String(r[6] || '').trim();

            if (!location && !partner && memIds.length === 0 && !startStr) continue;
            const sttNum = Number(sttRaw) || (i - 1);
            const finalStart = startStr || '2026-06-01';
            const finalEnd = endStr && endStr >= finalStart ? endStr : finalStart;

            imported.push({
              id: `sh_xl_${i + 1}`,
              stt: sttNum,
              partner,
              location: location || partner || 'Show',
              startDate: finalStart,
              endDate: finalEnd,
              rawEndDate: endStr || finalStart,
              memberIds: memIds,
              roles: {},
              postStatus: 'pending',
              ownerId: resolveOwnerIdFromName(ownerLabel, memIds),
              creatorId: state.currentUserId,
              ownerLabel,
              color: getAutoHighlightColor(location, partner),
              note: ''
            });
          }

          if (imported.length > 0) {
            state.shows = imported;
            saveShowsToLocalBackup();
            state.filterAllMonthsInList = true;
            renderApp();
            showToast(`Đã nạp ${imported.length} dòng từ file "${file.name}"!`);
            if (state.user && db) {
              const showsCol = collection(db, 'artifacts', appId, 'public', 'data', 'shows');
              const snap = await getDocs(showsCol);
              await Promise.all(snap.docs.map(d => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shows', d.id))));
              await Promise.all(imported.map(sh => setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shows', sh.id), sh)));
            }
          }
        } catch (err) {
          showToast('Lỗi đọc file Excel: ' + err.message, 'error');
        }
        event.target.value = '';
      },
      downloadSingleHtmlFile() {
        if (!state.isAdminMode) return;
        const clonedDoc = document.documentElement.cloneNode(true);
        clonedDoc.querySelectorAll('[data-bard-client-injected="true"]').forEach(el => el.remove());
        const oldBaked = clonedDoc.querySelector('#baked-data-script');
        if (oldBaked) oldBaked.remove();

        const bakedScript = document.createElement('script');
        bakedScript.id = 'baked-data-script';
        bakedScript.textContent = `
          window.__BAKED_SHOWS_DATA__ = ${JSON.stringify(state.shows)};
          window.__BAKED_MEMBERS_DATA__ = ${JSON.stringify(state.members)};
          window.__BAKED_PINS_DATA__ = ${JSON.stringify(state.pinsMap)};
          window.__BAKED_CUSTOM_LOGO__ = ${JSON.stringify(state.customLogoUrl)};
        `;
        const headEl = clonedDoc.querySelector('head');
        if (headEl) headEl.insertBefore(bakedScript, headEl.firstChild);

        const htmlContent = '<!DOCTYPE html>\n' + clonedDoc.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(`Đã tải file index.html nhúng sẵn ${state.shows.length} dòng lịch!`);
      }
    };

    // LOGIC TAB TÍNH CÔNG TÁC PHÍ (CTP)
    // ========================================================================
    function getShowDays(sh) {
      if (!sh.startDate || !sh.endDate) return 1;
      const s = new Date(sh.startDate + 'T00:00:00');
      const e = new Date(sh.endDate + 'T00:00:00');
      const diffTime = e - s;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
      return diffDays > 0 ? diffDays : 1;
    }

    function getDefaultRateForTask(taskKey, sh) {
      const days = getShowDays(sh);
      if (taskKey === 'quay' || taskKey === 'chup') {
        return days === 1 ? 1500000 : 1200000 * days;
      }
      if (taskKey === 'dung') return 1000000;
      if (taskKey === 'lamhinh') return 300000;
      if (taskKey === 'flycam') return 1000000;
      if (taskKey === 'gimbal') return 200000;
      return 0;
    }

    window.ctpActions = {
      setMonth(m) {
        state.ctpMonth = Number(m);
        renderApp();
      },
      setOwner(ownerId) {
        state.ctpOwnerId = ownerId;
        renderApp();
      },
      toggleTask(showId, taskKey) {
        if (!state.ctpItems[showId]) state.ctpItems[showId] = { tasks: {}, extras: [] };
        const tasks = state.ctpItems[showId].tasks;
        if (tasks[taskKey]) {
          delete tasks[taskKey];
        } else {
          const sh = state.shows.find(s => s.id === showId);
          tasks[taskKey] = getDefaultRateForTask(taskKey, sh);
        }
        renderApp();
      },
      updateTaskPrice(showId, taskKey, priceVal) {
        if (!state.ctpItems[showId]) state.ctpItems[showId] = { tasks: {}, extras: [] };
        state.ctpItems[showId].tasks[taskKey] = Number(priceVal) || 0;
        renderApp();
      },
      addExtraItem(showId) {
        if (!state.ctpItems[showId]) state.ctpItems[showId] = { tasks: {}, extras: [] };
        if (!Array.isArray(state.ctpItems[showId].extras)) state.ctpItems[showId].extras = [];
        state.ctpItems[showId].extras.push({ name: '', amount: '' });
        renderApp();
      },
      removeExtraItem(showId, index) {
        if (!state.ctpItems[showId] || !state.ctpItems[showId].extras) return;
        state.ctpItems[showId].extras.splice(index, 1);
        renderApp();
      },
      updateExtraField(showId, index, field, val) {
        if (!state.ctpItems[showId] || !state.ctpItems[showId].extras) return;
        state.ctpItems[showId].extras[index][field] = field === 'amount' ? (Number(val) || 0) : val;
        renderApp();
      },
      generateBill() {
        const curMem = getMember(state.currentUserId);
        const filteredShows = state.shows.filter(sh => {
          if (!sh.startDate) return false;
          const m = parseInt(sh.startDate.split('-')[1], 10);
          if (m !== state.ctpMonth) return false;
          if (!(sh.memberIds || []).includes(state.currentUserId)) return false;
          if (state.ctpOwnerId !== 'all' && sh.ownerId !== state.ctpOwnerId) return false;
          return true;
        });

        let grandTotal = 0;
        let billLines = [];
        billLines.push(`💰 **BILL CÔNG TÁC PHÍ THÁNG ${state.ctpMonth}/2026**`);
        billLines.push(`👤 Người nhận: ${curMem.name}`);
        if (state.ctpOwnerId !== 'all') {
          billLines.push(`📌 Chủ show: ${getMember(state.ctpOwnerId).name}`);
        }
        billLines.push(`-----------------------------------`);

        filteredShows.forEach((sh, idx) => {
          const item = state.ctpItems[sh.id] || { tasks: {}, extras: [] };
          const tasks = item.tasks;
          let showSum = 0;
          let taskDescList = [];

          Object.keys(tasks).forEach(tk => {
            const p = tasks[tk];
            showSum += p;
            let label = tk;
            if (tk === 'quay') label = 'Quay';
            else if (tk === 'dung') label = 'Dựng';
            else if (tk === 'chup') label = 'Chụp hình';
            else if (tk === 'lamhinh') label = 'Làm hình';
            else if (tk === 'flycam') label = 'Flycam';
            else if (tk === 'gimbal') label = 'Gimbal';
            taskDescList.push(`- ${label}: ${p.toLocaleString('vi-VN')}đ`);
          });

          const extras = Array.isArray(item.extras) ? item.extras : [];
          let extraDescList = [];
          extras.forEach(ex => {
            const amt = Number(ex.amount) || 0;
            if (amt > 0) {
              showSum += amt;
              extraDescList.push(`- Phát sinh (${ex.name || 'Phí khác'}): ${amt.toLocaleString('vi-VN')}đ`);
            }
          });

          if (showSum > 0) {
            grandTotal += showSum;
            billLines.push(`${idx + 1}. **${sh.location}** (${formatDayMonth(sh.startDate)}${sh.endDate && sh.endDate !== sh.startDate ? ' -> ' + formatDayMonth(sh.endDate) : ''})`);
            taskDescList.forEach(td => billLines.push(`   ${td}`));
            extraDescList.forEach(ed => billLines.push(`   ${ed}`));
            billLines.push(`   👉 Tổng show: **${showSum.toLocaleString('vi-VN')}đ**\n`);
          }
        });

        billLines.push(`-----------------------------------`);
        billLines.push(`🔥 **TỔNG CỘNG CTP LỤM: ${grandTotal.toLocaleString('vi-VN')} VNĐ**`);

        state.ctpBillModal = { text: billLines.join('\n'), total: grandTotal };
        renderApp();
      },
      closeBillModal() {
        state.ctpBillModal = null;
        renderApp();
      },
      copyBillText() {
        const el = document.getElementById('ctp-bill-textarea');
        if (!el) return;
        el.select();
        document.execCommand('copy');
        state.ctpBillModal = null;
        renderApp();
        showToast('📋 Đã copy Bill CTP! Gửi ngay cho Chủ Show nhé.');
      }
    };

              <button onclick="appActions.closeFormModal()" class="w-7 h-7 rounded-full bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" value="${escapeHtml(f.location)}" oninput="appActions.updateFormField('location', this.value)" placeholder="Địa điểm (Hồ Tràm, SG...)" class="px-3 py-2 border rounded-xl font-bold" />
              <input type="text" value="${escapeHtml(f.partner)}" oninput="appActions.updateFormField('partner', this.value)" placeholder="Tên show - Đối tác" class="px-3 py-2 border rounded-xl" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[10px] text-slate-500 font-bold">Ngày Bắt Đầu:</label>
                <input type="date" value="${f.startDate}" onchange="appActions.updateFormField('startDate', this.value)" class="w-full px-2.5 py-1.5 border rounded-xl font-bold mt-0.5" />
              </div>
              <div>
                <label class="text-[10px] text-slate-500 font-bold">Ngày Kết Thúc:</label>
                <input type="date" min="${f.startDate}" value="${f.endDate}" onchange="appActions.updateFormField('endDate', this.value)" class="w-full px-2.5 py-1.5 border rounded-xl font-bold mt-0.5" />
              </div>
            </div>
            ${selectedBusyWarnings.length > 0 ? `
              <div class="p-2.5 rounded-xl bg-rose-50 border border-rose-300 text-rose-700 text-[11px] font-bold">
                ⚠️ Cảnh báo trùng lịch: ${escapeHtml(selectedBusyWarnings.join(' • '))}
              </div>
            ` : ''}
            <div class="space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="font-black text-slate-700 text-[11px]">Chọn Nhân Sự & Gắn Vai Trò (Chọn nhiều):</span>
                <div class="flex gap-2">
                  <button type="button" onclick="appActions.selectOnlyMeForm()" class="text-[10px] text-indigo-600 font-bold">Chỉ mình tôi</button>
                  <button type="button" onclick="appActions.selectAllMembersForm()" class="text-[10px] text-indigo-600 font-bold">Chọn tất cả</button>
                </div>
              </div>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 bg-slate-50 p-2 rounded-xl border">
                ${state.members.map(m => {
                  const selected = f.memberIds.includes(m.id);
                  const busyLocations = busyMap[m.id];
                  const curRole = f.roles?.[m.id] || [];
                  return `
                    <div onclick="appActions.toggleFormMember('${m.id}')" class="p-1.5 rounded-lg border cursor-pointer flex flex-col justify-between ${selected ? 'bg-indigo-50 border-indigo-600' : busyLocations ? 'bg-rose-50/50 border-rose-200' : 'bg-white opacity-85'}">
                      <div class="flex justify-between items-center">
                        ${renderPillHtml(m.id, 'xs', '', '', curRole)}
                        <i class="fa-solid ${selected ? 'fa-circle-check text-indigo-600' : 'fa-circle text-slate-200'}"></i>
                      </div>
                      ${busyLocations ? `<div class="text-[9px] font-extrabold text-rose-600 mt-1 truncate">⚠️ Bận: ${escapeHtml(busyLocations[0])}</div>` : ''}
                      ${selected ? `
                        <div class="flex flex-wrap gap-1 mt-1.5 pt-1 border-t border-indigo-200/60" onclick="event.stopPropagation()">
                          ${ROLE_OPTIONS.filter(r => r.id !== '').map(r => {
                            const assignedRoles = Array.isArray(curRole) ? curRole : (curRole ? [curRole] : []);
                            const isChosen = assignedRoles.includes(r.id);
                            return `
                              <button
                                type="button"
                                onclick="appActions.setMemberRoleForm('${m.id}', '${r.id}', event)"
                                class="px-1.5 py-0.5 rounded text-[9px] font-bold border ${isChosen ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-200'}"
                              >${r.label}</button>
                            `;
                          }).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            
            <div class="space-y-1">
              <label class="text-[10px] text-slate-500 font-bold">Chọn Chủ Show (Người phụ trách thông tin):</label>
              <select onchange="appActions.updateFormField('ownerId', this.value)" class="w-full px-3 py-2 border rounded-xl font-bold text-xs bg-white">
                ${state.members.map(m => `<option value="${m.id}" ${f.ownerId === m.id ? 'selected' : ''}>${m.name}</option>`).join('')}
              </select>
            </div>

            ${f.error ? `<div class="text-rose-600 font-bold">${escapeHtml(f.error)}</div>` : ''}
            <button onclick="appActions.saveShowForm()" class="w-full bg-indigo-600 text-white font-black py-2.5 rounded-xl uppercase tracking-wide">⚡ NỔ SHOW</button>
          </div>
        </div>
      `;
    }

    function renderZaloTomorrowModalHtml() {
      const zm = state.zaloTomorrowModal;
      if (!zm) return '';
      const targetDate = zm.dateStr;
      const tDate = new Date(targetDate + 'T00:00:00');
      const dayShows = state.shows.filter(sh => {
        const s = new Date(sh.startDate + 'T00:00:00');
        const e = new Date(sh.endDate + 'T00:00:00');
        return tDate >= s && tDate <= e;
      });

      let msg = `🚨 LỊCH CHẠY SHOW NGÀY (${formatDayMonth(targetDate)}):\n`;
      if (dayShows.length === 0) {
        msg += `Hiện chưa có lịch show nào ghi nhận vào ngày ${formatDayMonth(targetDate)}.\n`;
      } else {
        dayShows.forEach((sh, i) => {
          const crew = (sh.memberIds || []).map(id => {
            const r = sh.roles?.[id] ? ` (${Array.isArray(sh.roles[id]) ? sh.roles[id].join(', ') : sh.roles[id]})` : '';
            return getMember(id).name + r;
          }).join(', ');
          const ownerName = sh.ownerLabel || getMember(sh.ownerId).name;
          msg += `${i + 1}. 📍 ${sh.location}${sh.partner ? ' (' + sh.partner + ')' : ''}: ${crew} [Chủ show: ${ownerName}]\n`;
        });
      }
      msg += `----------------------------\n👉 Anh em kiểm tra kỹ thiết bị, sạc pin, thẻ nhớ đầy đủ nhé!`;

      return `
        <div onclick="appActions.closeZaloTomorrowModal()" class="fixed inset-0 z-50 bg-black/65 flex items-center justify-center p-4">
          <div onclick="event.stopPropagation()" class="bg-white w-full max-w-md rounded-3xl p-4 space-y-3 text-xs shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
              <h3 class="font-black text-sm text-emerald-700">📋 Điểm Danh Lịch Đi Show (Gửi Zalo)</h3>
              <button onclick="appActions.closeZaloTomorrowModal()" class="w-7 h-7 rounded-full bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex items-center justify-between gap-2">
              <span class="font-bold text-slate-600">Chọn ngày cần điểm danh:</span>
              <input type="date" value="${targetDate}" onchange="appActions.changeZaloTomorrowDate(this.value)" class="px-2.5 py-1 border rounded-xl font-bold bg-slate-50" />
            </div>
            <textarea id="zalo-tomorrow-textarea" rows="6" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono text-[11px] leading-relaxed">${escapeHtml(msg)}</textarea>
            <button onclick="appActions.copyZaloTomorrowText()" class="w-full bg-emerald-600 text-white font-black py-2.5 rounded-xl">📋 Copy Tin Nhắn & Đóng</button>
          </div>
        </div>
      `;
    }

    function renderPinModalHtml() {
      const pm = state.pinModal;
      if (!pm) return '';
      const selMem = getMember(pm.selectedId);
      return `
        <div onclick="appActions.closePinModal()" class="fixed inset-0 z-50 bg-black/65 flex items-center justify-center p-4">
          <div onclick="event.stopPropagation()" class="bg-white w-full max-w-sm rounded-3xl p-4 space-y-3 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
              <h3 class="font-black text-sm">${pm.step === 'select' ? 'Chọn Tên Của Bạn' : `Nhập PIN cho ${escapeHtml(selMem.name)}`}</h3>
              <button onclick="appActions.closePinModal()" class="w-7 h-7 rounded-full bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
            </div>
            ${pm.step === 'select' ? `
              <button onclick="appActions.openSelfChangePinModal()" class="w-full py-2 px-3 bg-indigo-50 text-indigo-700 rounded-xl font-extrabold text-xs">🔑 Tự đổi mã PIN của tôi (${escapeHtml(getMember(state.currentUserId).name)})</button>
              <div class="grid grid-cols-2 gap-1.5 max-h-[55dvh] overflow-y-auto">
                ${state.members.map(m => `<button onclick="appActions.chooseMemberForPin('${m.id}')" class="p-2 rounded-xl border flex justify-between items-center">${renderPillHtml(m.id, 'sm')}<i class="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i></button>`).join('')}
              </div>
            ` : `
              <div class="flex flex-col items-center space-y-3 py-2">
                ${renderPillHtml(pm.selectedId, 'md')}
                <div class="text-[11px] text-slate-500 font-medium">Nhập 4 số PIN bằng bàn phím số:</div>
                <div class="flex gap-3 py-1">
                  ${[0, 1, 2, 3].map(i => `<div id="pin-dot-${i}" class="w-3.5 h-3.5 rounded-full ${i < pm.pinInput.length ? 'bg-indigo-600' : 'bg-slate-200'}"></div>`).join('')}
                </div>
                <input
                  id="native-pin-input"
                  type="password"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  maxlength="4"
                  autofocus
                  value="${escapeHtml(pm.pinInput)}"
                  oninput="appActions.handleNativePinInput(this.value)"
                  placeholder="••••"
                  class="w-40 text-center text-xl tracking-widest font-mono py-2 px-3 border-2 border-indigo-500 rounded-2xl bg-slate-50 focus:outline-none"
                />
                <div id="pin-error-msg" class="min-h-[18px] text-xs font-bold text-rose-600 text-center">${escapeHtml(pm.error || '')}</div>
                <button onclick="appActions.backToSelectMemberPin()" class="w-full py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">← Chọn tên thành viên khác</button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderSelfChangePinModalHtml() {
      const m = state.selfChangePinModal;
      if (!m) return '';
      return `
        <div onclick="appActions.closeSelfChangePinModal()" class="fixed inset-0 z-50 bg-black/65 flex items-center justify-center p-4">
          <div onclick="event.stopPropagation()" class="bg-white w-full max-w-sm rounded-3xl p-4 space-y-3 text-xs">
            <h3 class="font-black text-sm">Đổi Mã PIN Cá Nhân (${escapeHtml(getMember(state.currentUserId).name)})</h3>
            ${m.error ? `<div class="text-rose-600 font-bold">${escapeHtml(m.error)}</div>` : ''}
            <input type="password" inputmode="numeric" maxlength="4" placeholder="Mã PIN 4 số hiện tại" oninput="state.selfChangePinModal.oldPin = this.value" class="w-full px-3 py-2 border rounded-xl font-mono text-center" />
            <input type="password" inputmode="numeric" maxlength="4" placeholder="Mã PIN 4 số mới" oninput="state.selfChangePinModal.newPin = this.value" class="w-full px-3 py-2 border rounded-xl font-mono text-center" />
            <button onclick="appActions.submitSelfChangePin()" class="w-full bg-indigo-600 text-white font-black py-2.5 rounded-xl">Lưu Mã PIN Mới</button>
          </div>
        </div>
      `;
    }

    function renderGuideModalHtml() {
      if (!state.guideModal) return '';
      return `
        <div onclick="appActions.closeGuideModal()" class="fixed inset-0 z-50 bg-black/65 flex items-end sm:items-center justify-center">
          <div onclick="event.stopPropagation()" class="ios-sheet bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-4 space-y-3 text-xs">
            <div class="flex justify-between items-center border-b pb-2">
              <h3 class="font-black text-sm">Cách Cài Full Màn Hình iPhone</h3>
              <button onclick="appActions.closeGuideModal()" class="w-7 h-7 rounded-full bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="leading-relaxed text-slate-700">1. Mở link trên <b>Safari</b>.<br/>2. Bấm nút <b>Chia sẻ (Share ⬆️)</b>.<br/>3. Chọn <b>"Thêm vào MH chính" (Add to Home Screen)</b>.</p>
            <div class="pt-2 border-t flex justify-between items-center text-[10px] text-slate-400">
              <span>Action & Say Media 2026</span>
              <button onclick="appActions.enterBackendPortal()" class="px-2.5 py-1 bg-slate-900 text-amber-400 rounded-lg font-bold">🔑 Mở Admin Backend →</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderBackendPortalHtml() {
      if (!state.isAdminMode) {
        return `
          <div class="w-full h-[100dvh] bg-slate-950 text-white flex items-center justify-center p-4">
            <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
              <h2 class="font-black text-sm text-amber-400 uppercase">Đăng Nhập Backend Admin</h2>
              ${state.adminLoginInput.error ? `<div class="text-rose-400 text-xs font-bold">${escapeHtml(state.adminLoginInput.error)}</div>` : ''}
              <input type="email" value="${escapeHtml(state.adminLoginInput.email)}" placeholder="Email Quản trị viên (admin@actionsay.vn)" oninput="state.adminLoginInput.email = this.value" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white" />
              <input type="password" value="${escapeHtml(state.adminLoginInput.password)}" placeholder="Mật khẩu Admin (admin2026)" oninput="state.adminLoginInput.password = this.value" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white" />
              <button onclick="appActions.submitBackendAdminLogin()" class="w-full bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl text-xs">Đăng Nhập Quản Trị</button>
              <button onclick="appActions.exitBackendPortal()" class="w-full text-slate-400 text-xs py-1">← Quay lại Lịch Show</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="w-full h-[100dvh] bg-slate-950 text-white flex flex-col overflow-hidden">
          <header style="padding-top: max(10px, var(--sat));" class="bg-slate-900 border-b border-slate-800 px-3 pb-2.5 flex items-center justify-between gap-2">
            <span class="font-black text-[11px] text-amber-400 truncate min-w-0 flex-1">ADMIN BACKEND (${state.shows.length} SHOWS)</span>
            <div class="flex items-center gap-1.5 shrink-0">
              <button onclick="appActions.logoutAdmin()" class="px-2.5 py-1 bg-slate-800 text-rose-400 rounded-xl text-[10px] font-bold">Đăng xuất</button>
              <button onclick="appActions.exitBackendPortal()" class="px-2.5 py-1 bg-indigo-600 rounded-xl text-[10px] font-extrabold">← Về App</button>
            </div>
          </header>
          <div class="bg-slate-900 px-3 py-2 flex gap-1.5 border-b border-slate-800 text-[11px] font-bold overflow-x-auto no-scrollbar">
            <button onclick="appActions.setBackendTab('dashboard')" class="px-3 py-1.5 rounded-xl shrink-0 ${state.backendTab === 'dashboard' ? 'bg-amber-400 text-slate-950 font-black' : 'bg-slate-800'}">Thống Kê</button>
            <button onclick="appActions.setBackendTab('crew')" class="px-3 py-1.5 rounded-xl shrink-0 ${state.backendTab === 'crew' ? 'bg-amber-400 text-slate-950 font-black' : 'bg-slate-800'}">Nhân Sự & PIN</button>
            <button onclick="appActions.setBackendTab('system')" class="px-3 py-1.5 rounded-xl shrink-0 ${state.backendTab === 'system' ? 'bg-amber-400 text-slate-950 font-black' : 'bg-slate-800'}">Cài Đặt & Tải HTML</button>
          </div>
          <div class="flex-1 overflow-y-auto p-4 space-y-4 text-xs">
            ${state.backendTab === 'dashboard' ? `
              <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                <div class="font-black text-amber-400 mb-2">Tổng số lịch hiện có: ${state.shows.length} dòng</div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  ${state.members.map(m => {
                    const cnt = state.shows.filter(s => (s.memberIds || []).includes(m.id)).length;
                    return `<div class="p-2.5 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center">${renderPillHtml(m.id, 'xs')}<span class="font-black text-amber-400">${cnt} show</span></div>`;
                  }).join('')}
                </div>
              </div>
            ` : state.backendTab === 'crew' ? `
              <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                <div class="font-black text-amber-400">Thêm Nhân Sự Mới</div>
                <div class="grid grid-cols-3 gap-2">
                  <input type="text" placeholder="Tên nhân sự" oninput="state.newMemberForm.name = this.value" class="px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl" />
                  <input type="text" inputmode="numeric" maxlength="4" placeholder="PIN 4 số" oninput="state.newMemberForm.pin = this.value" class="px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl font-mono" />
                  <button onclick="appActions.addMemberByAdmin()" class="bg-emerald-600 font-black rounded-xl">+ Thêm</button>
                </div>
                <div class="grid grid-cols-2 gap-2 pt-2">
                  ${state.members.map(m => `
                    <div class="p-2 bg-slate-950 border border-slate-800 rounded-xl flex justify-between items-center">
                      ${renderPillHtml(m.id, 'xs')}
                      <input type="text" inputmode="numeric" maxlength="4" value="${escapeHtml(state.pinsMap[m.id] || '1234')}" oninput="state.pinsMap['${m.id}'] = this.value" class="w-14 text-center bg-slate-900 border border-slate-700 rounded font-mono" />
                      <button onclick="appActions.removeMemberByAdmin('${m.id}')" class="text-rose-400"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                  `).join('')}
                </div>
                <button onclick="appActions.saveAllPinsByAdmin()" class="w-full bg-indigo-600 py-2.5 rounded-xl font-black">Lưu Bảng Mã PIN</button>
              </div>
            ` : `
              <div class="bg-slate-900 p-4 rounded-2xl space-y-3">
                <div class="font-black text-amber-400">Logo App, Nạp File Excel & Tải File HTML</div>
                <div class="flex items-center gap-3 p-3 bg-slate-950 border border-slate-800 rounded-xl">
                  <div class="w-12 h-12 rounded-xl overflow-hidden border border-slate-700 shrink-0 bg-black">
                    ${state.customLogoUrl ? `<img src="${state.customLogoUrl}" class="w-full h-full object-cover" />` : generateActionSayLogoSvg()}
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="font-bold text-white text-xs">Logo App & Icon Màn Hình Chính iPhone</div>
                    <div class="text-[10px] text-slate-400">Đã cài đặt chuẩn logo Action Media x Say Studios</div>
                  </div>
                  <button onclick="appActions.triggerLogoUpload()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold rounded-lg text-[11px] shrink-0">
                    🖼️ Chọn file app.png
                  </button>
                </div>
                <button onclick="appActions.triggerExcelFileUpload()" class="w-full bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl flex items-center justify-center gap-2">
                  <i class="fa-solid fa-file-excel"></i>
                  <span>📂 Chọn File Excel Để Nạp Lại Lịch Show</span>
                </button>
                <button onclick="appActions.syncExcelShowsToCloud()" class="w-full bg-emerald-600 text-white font-black py-2.5 rounded-xl">🔄 Reset Về Dữ Liệu Gốc</button>
                <button onclick="appActions.downloadSingleHtmlFile()" class="w-full bg-indigo-600 text-white font-black py-2.5 rounded-xl">⬇️ Tải File index.html Trọn Gói Ngay</button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderToastHtml() {
      if (!state.toast) return '';
      return `<div class="fixed top-12 left-1/2 -translate-x-1/2 z-50 max-w-xs w-full px-3 pointer-events-none"><div class="p-2.5 rounded-xl shadow-xl text-[11px] font-bold text-white bg-slate-900 flex items-center gap-2"><i class="fa-solid fa-circle-check text-emerald-400"></i><span>${escapeHtml(state.toast.message)}</span></div></div>`;
    }

    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;
      if (state.isBackendPortal) {
        root.innerHTML = `${renderBackendPortalHtml()}${renderToastHtml()}`;
        return;
      }
      let main = '';
      if (state.activeTab === 'shows') main = renderShowsTabHtml();
      else if (state.activeTab === 'matrix') main = renderMatrixTabHtml();
      else if (state.activeTab === 'free_finder') main = renderFreeFinderTabHtml();
      else if (state.activeTab === 'ctp') main = renderCtpTabHtml();

      root.innerHTML = `${renderHeaderHtml()}${main}${renderBottomNavHtml()}${renderDetailModalHtml()}${renderFormModalHtml()}${renderZaloTomorrowModalHtml()}${renderPinModalHtml()}${renderSelfChangePinModalHtml()}${renderGuideModalHtml()}${renderCtpBillModalHtml()}${renderToastHtml()}`;
    }

    window.state = state;
    applyHomeScreenIcon(state.customLogoUrl);
    renderApp();
    initFirebaseCloud();
  </script>
</body>
</html>
