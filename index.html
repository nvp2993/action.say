<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LỊCH SHOW ACTION & SAY</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lịch Show">
  <link id="apple-touch-icon-link" rel="apple-touch-icon" href="">
  <link id="favicon-link" rel="icon" type="image/png" href="">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .bento-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
      transition: all 0.2s ease;
    }
    .ios-sheet { animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col">

  <div id="app" class="flex-1 flex flex-col min-h-0 bg-slate-100"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const MY_FIREBASE_CONFIG = {
      apiKey: "AIzaSyBPp0AbNtvvuIWTrTwIYkvXyoD0Vr2IeuE",
      authDomain: "lich-show-action-say.firebaseapp.com",
      projectId: "lich-show-action-say",
      storageBucket: "lich-show-action-say.firebasestorage.app",
      messagingSenderId: "464838086307",
      appId: "1:464838086307:web:c5b7ec3c47551577c1f916"
    };

    function generateActionSayLogoSvg() {
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-full h-full block">
        <rect width="512" height="512" fill="#050505"/>
        <path d="M0,185 L145,115 L125,0 L165,0 L215,240 L0,210 Z" fill="#222222"/>
        <text x="275" y="505" font-family="Georgia, serif" font-weight="900" font-size="370" fill="#222222">S</text>
        <g transform="translate(0, 6)">
          <text x="52" y="182" font-family="Inter, Arial Black, sans-serif" font-weight="900" font-size="112" fill="#ffffff" letter-spacing="-4">acti</text>
          <rect x="295" y="96" width="84" height="88" rx="28" fill="#ffffff"/>
          <path d="M304,167 Q337,110 352,102 L369,165 Q341,123 304,167 Z" fill="#e11d2e"/>
          <circle cx="339" cy="153" r="7.5" fill="#e11d2e"/>
          <text x="383" y="182" font-family="Inter, Arial Black, sans-serif" font-weight="900" font-size="112" fill="#ffffff" letter-spacing="-3">n</text>
        </g>
        <text x="256" y="246" text-anchor="middle" font-family="Inter, Arial Black, sans-serif" font-weight="800" font-size="56" fill="#ffffff" letter-spacing="18">media</text>
        <text x="256" y="302" text-anchor="middle" font-family="Inter, Arial Black, sans-serif" font-weight="900" font-size="34" fill="#ffffff">x</text>
        <text x="256" y="408" text-anchor="middle" font-family="Inter, Arial Black, sans-serif" font-weight="900" font-size="126" fill="#ffffff" letter-spacing="-4">say</text>
        <text x="208" y="454" text-anchor="middle" font-family="Inter, Arial Black, sans-serif" font-weight="900" font-size="45" fill="#ffffff" letter-spacing="-1">studios</text>
      </svg>`;
    }

    const INITIAL_TEAM_MEMBERS = [
      { id: 'duc_lon', name: 'Đức lớn', shortLabel: 'ĐỨC LỚN', bg: '#fee2e2', text: '#991b1b', defaultPin: '1111', order: 3 },
      { id: 'duc_nho', name: 'Đức nhỏ', shortLabel: 'ĐỨC NHỎ', bg: '#ffedd5', text: '#9a3412', defaultPin: '2222', order: 4 },
      { id: 'phu_lon', name: 'Phú lớn', shortLabel: 'PHÚ LỚN', bg: '#dcfce7', text: '#166534', defaultPin: '3333', order: 10 },
      { id: 'phu_nho', name: 'Phú nhỏ', shortLabel: 'PHÚ NHỎ', bg: '#f0fdf4', text: '#14532d', defaultPin: '4444', order: 11 },
      { id: 'ky', name: 'Kỳ', shortLabel: 'KỲ', bg: '#f3e8ff', text: '#6b21a8', defaultPin: '5555', order: 7 },
      { id: 'thai', name: 'Thái', shortLabel: 'THÁI', bg: '#dbeafe', text: '#1e40af', defaultPin: '6666', order: 12 },
      { id: 'kien', name: 'Kiên', shortLabel: 'KIÊN', bg: '#e0e7ff', text: '#3730a3', defaultPin: '7777', order: 6 },
      { id: 'dung', name: 'Dũng', shortLabel: 'DŨNG', bg: '#fce7f3', text: '#9d174d', defaultPin: '8888', order: 1 },
      { id: 'thuc', name: 'Thức', shortLabel: 'THỨC', bg: '#ccfbf1', text: '#115e59', defaultPin: '1212', order: 13 },
      { id: 'loc', name: 'Lộc', shortLabel: 'LỘC', bg: '#f1f5f9', text: '#334155', defaultPin: '1313', order: 8 },
      { id: 'dang', name: 'Đăng', shortLabel: 'ĐĂNG', bg: '#f8fafc', text: '#0f172a', defaultPin: '1414', order: 2 },
      { id: 'nhat', name: 'Nhật', shortLabel: 'NHẬT', bg: '#fef3c7', text: '#92400e', defaultPin: '1515', order: 9 },
      { id: 'khoa', name: 'Khoa', shortLabel: 'KHOA', bg: '#ecfdf5', text: '#065f46', defaultPin: '1616', order: 5 },
    ];

    const DEFAULT_PINS_MAP = Object.fromEntries(INITIAL_TEAM_MEMBERS.map(m => [m.id, m.defaultPin]));
    const INITIAL_SHOWS_DATA = window.__BAKED_SHOWS_DATA__ || [];

    const state = {
      user: null,
      cloudSynced: false,
      members: [...INITIAL_TEAM_MEMBERS],
      shows: [...INITIAL_SHOWS_DATA],
      pinsMap: { ...DEFAULT_PINS_MAP },
      customLogoUrl: null,
      currentUserId: 'khoa',
      isAdminMode: false,
      isBackendPortal: window.location.hash === '#admin',
      activeTab: 'shows',
      selectedMonth: new Date().getMonth() + 1,
      selectedYear: new Date().getFullYear(),
      filterAllMonthsInList: false,
      searchQuery: '',
      filterMemberId: 'all',
      checkStart: new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10),
      checkEnd: new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10),
      ctpMonth: new Date().getMonth() + 1,
      ctpOwnerId: 'all',
      ctpItems: {},
      ctpBillModal: null,
      detailShowId: null,
      formModal: null,
      pinModal: null,
      guideModal: false,
      toast: null
    };

    try {
      const savedLocalShows = localStorage.getItem('as_shows_backup_2026');
      if (savedLocalShows) {
        const parsed = JSON.parse(savedLocalShows);
        if (Array.isArray(parsed) && parsed.length > 0) state.shows = parsed;
      }
      const savedLocalUser = localStorage.getItem('as_user_backup_2026');
      if (savedLocalUser) state.currentUserId = savedLocalUser;
    } catch (e) {}

    function saveShowsToLocalBackup() {
      try { localStorage.setItem('as_shows_backup_2026', JSON.stringify(state.shows)); } catch (e) {}
    }

    window.addEventListener('hashchange', () => {
      state.isBackendPortal = window.location.hash === '#admin';
      renderApp();
    });

    let db = null;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'action-say-media-2026';

    async function initFirebaseCloud() {
      try {
        const app = initializeApp(MY_FIREBASE_CONFIG);
        const auth = getAuth(app);
        db = getFirestore(app);
        await signInAnonymously(auth);
        onAuthStateChanged(auth, (u) => {
          state.user = u;
          if (u && db) {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'shows'), (snap) => {
              state.cloudSynced = true;
              if (!snap.empty) {
                state.shows = snap.docs.map(d => d.data());
                saveShowsToLocalBackup();
              }
              renderApp();
            }, () => { state.cloudSynced = false; renderApp(); });
          }
        });
      } catch (e) {}
    }

    function getMember(id) {
      return state.members.find(m => m.id === id) || state.members[0];
    }

    function formatDayMonth(dateStr) {
      if (!dateStr) return '';
      const p = dateStr.split('-');
      if (p.length !== 3) return dateStr;
      return `${parseInt(p[2], 10)}/${parseInt(p[1], 10)}`;
    }

    function escapeHtml(str = '') {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showToast(message) {
      state.toast = { message };
      renderApp();
      setTimeout(() => { state.toast = null; renderApp(); }, 2600);
    }

    function renderPillHtml(memberId, size = 'xs', extraClasses = '', roleTag = '') {
      const m = state.members.find(x => x.id === memberId);
      if (!m) return '';
      const sizeCls = size === 'xs' ? 'px-2 py-0.5 text-[10px]' : 'px-3 py-1 text-xs';
      let roleStr = Array.isArray(roleTag) ? roleTag.join(', ') : (roleTag || '');
      const roleSpan = roleStr ? `<span class="ml-1 opacity-75 font-normal">• ${escapeHtml(roleStr)}</span>` : '';
      return `<span style="background-color:${m.bg};color:${m.text}" class="inline-flex items-center font-semibold rounded-full tracking-wide select-none ${sizeCls} ${extraClasses}">${escapeHtml(m.shortLabel)}${roleSpan}</span>`;
    }

    function getFilteredShows() {
      return state.shows.filter(sh => {
        if (!state.filterAllMonthsInList) {
          const start = new Date(sh.startDate + 'T00:00:00');
          const end = new Date((sh.endDate < sh.startDate ? sh.startDate : sh.endDate) + 'T00:00:00');
          const mStart = new Date(state.selectedYear, state.selectedMonth - 1, 1);
          const mEnd = new Date(state.selectedYear, state.selectedMonth, 0);
          if (end < mStart || start > mEnd) return false;
        }
        if (state.filterMemberId !== 'all' && !(sh.memberIds || []).includes(state.filterMemberId)) return false;
        if (state.searchQuery.trim() !== '') {
          const q = state.searchQuery.toLowerCase();
          return (sh.location || '').toLowerCase().includes(q) || (sh.partner || '').toLowerCase().includes(q);
        }
        return true;
      }).sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
    }

    window.appActions = {
      setTab(tab) { state.activeTab = tab; renderApp(); },
      setMonth(m) { state.selectedMonth = Number(m); state.filterAllMonthsInList = false; renderApp(); },
      toggleAllMonths() { state.filterAllMonthsInList = !state.filterAllMonthsInList; renderApp(); },
      setFilterMember(id) { state.filterMemberId = state.filterMemberId === id ? 'all' : id; renderApp(); },
      onSearchInput(val) { state.searchQuery = val; renderApp(); },
      openShowDetail(showId) { state.detailShowId = showId; renderApp(); },
      closeShowDetail() { state.detailShowId = null; renderApp(); },
      openAddModal() {
        const today = new Date().toISOString().slice(0, 10);
        state.formModal = { location: '', partner: '', startDate: today, endDate: today, memberIds: [state.currentUserId], ownerId: state.currentUserId };
        renderApp();
      },
      closeFormModal() { state.formModal = null; renderApp(); },
      updateFormField(field, val) { if (state.formModal) state.formModal[field] = val; renderApp(); },
      toggleFormMember(memId) {
        if (!state.formModal) return;
        const idx = state.formModal.memberIds.indexOf(memId);
        if (idx >= 0) state.formModal.memberIds.splice(idx, 1); else state.formModal.memberIds.push(memId);
        renderApp();
      },
      async saveShowForm() {
        const f = state.formModal;
        if (!f || !f.location.trim()) { showToast('Vui lòng nhập địa điểm!'); return; }
        const newShow = {
          id: 'sh_' + Date.now(), stt: state.shows.length + 100, partner: f.partner.trim(),
          location: f.location.trim(), startDate: f.startDate, endDate: f.endDate,
          memberIds: f.memberIds, roles: {}, postStatus: 'pending', ownerId: f.ownerId, creatorId: state.currentUserId
        };
        state.shows.push(newShow); saveShowsToLocalBackup(); state.formModal = null; renderApp(); showToast('🎉 Đã NỔ SHOW thành công!');
        if (state.user && db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shows', newShow.id), newShow);
      },
      openPinModal() { state.pinModal = true; renderApp(); },
      closePinModal() { state.pinModal = false; renderApp(); },
      chooseMemberForPin(memId) {
        state.currentUserId = memId; localStorage.setItem('as_user_backup_2026', memId);
        state.pinModal = false; renderApp(); showToast(`Đã đổi sang: ${getMember(memId).name}`);
      },
      openGuideModal() { state.guideModal = true; renderApp(); },
      closeGuideModal() { state.guideModal = false; renderApp(); }
    };

    function renderHeaderHtml() {
      const curMem = getMember(state.currentUserId);
      return `
        <header style="padding-top: max(16px, env(safe-area-inset-top));" class="bg-white px-5 pb-3 border-b border-slate-200 shrink-0 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-slate-900 text-white font-black flex items-center justify-center text-sm shadow-md">S</div>
            <div>
              <h1 class="text-xs font-black tracking-wider text-slate-900 uppercase">SAY STUDIOS</h1>
              <p class="text-[10px] text-slate-500 font-medium">Bento Mode Active</p>
            </div>
          </div>
          <button onclick="appActions.openPinModal()" class="flex items-center gap-2 bg-slate-100 border border-slate-200 rounded-full pl-3 pr-4 py-1.5 shadow-2xs">
            <span style="background-color:${curMem.bg};color:${curMem.text}" class="w-2.5 h-2.5 rounded-full"></span>
            <span class="text-xs font-bold text-slate-800">${escapeHtml(curMem.shortLabel)}</span>
          </button>
        </header>
      `;
    }

    function renderShowsTabHtml() {
      const filtered = getFilteredShows();
      return `
        <div class="flex-1 flex flex-col min-h-0 bg-slate-100 p-4 space-y-4 overflow-y-auto custom-scroll">
          <div class="bento-card p-4 space-y-3">
            <div class="flex items-center gap-2">
              <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" value="${escapeHtml(state.searchQuery)}" oninput="appActions.onSearchInput(this.value)" placeholder="Tìm kiếm địa điểm, đối tác..." class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs focus:outline-none focus:border-indigo-500" />
              </div>
              <button onclick="appActions.openAddModal()" class="bg-slate-900 text-white font-black px-4 py-2.5 rounded-2xl text-xs flex items-center gap-1.5 shadow-md shrink-0">
                <i class="fa-solid fa-plus text-[10px]"></i><span>NỔ SHOW</span>
              </button>
            </div>
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-1">
              <button onclick="appActions.toggleAllMonths()" class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 ${state.filterAllMonthsInList ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}">Tất cả</button>
              ${[6, 7, 8, 9, 10, 11, 12].map(m => `
                <button onclick="appActions.setMonth(${m})" class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 ${state.selectedMonth === m && !state.filterAllMonthsInList ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}">T${m}</button>
              `).join('')}
            </div>
          </div>
          <div class="space-y-3">
            ${filtered.length === 0 ? `
              <div class="bento-card p-8 text-center text-slate-400 text-xs font-medium">Không tìm thấy show nào.</div>
            ` : filtered.map(sh => {
              const owner = getMember(sh.ownerId);
              return `
                <div onclick="appActions.openShowDetail('${sh.id}')" class="bento-card p-4 space-y-3 cursor-pointer hover:border-slate-300">
                  <div class="flex items-start justify-between">
                    <div>
                      <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg">${formatDayMonth(sh.startDate)} ${sh.endDate !== sh.startDate ? '→ ' + formatDayMonth(sh.endDate) : ''}</span>
                      <h3 class="font-extrabold text-sm text-slate-900 mt-2">📍 ${escapeHtml(sh.location)}</h3>
                      ${sh.partner ? `<p class="text-xs text-slate-500 mt-0.5">Đối tác: <b>${escapeHtml(sh.partner)}</b></p>` : ''}
                    </div>
                    <span class="text-[10px] font-bold px-2.5 py-1 rounded-xl bg-slate-100 text-slate-600">Chủ: ${escapeHtml(owner.name)}</span>
                  </div>
                  <div class="flex flex-wrap gap-1.5 pt-2 border-t border-slate-100">
                    ${(sh.memberIds || []).map(mid => renderPillHtml(mid, 'xs')).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderMatrixTabHtml() {
      return `
        <div class="flex-1 flex flex-col min-h-0 bg-slate-100 p-4 space-y-3 overflow-y-auto">
          <div class="bento-card p-4 text-center space-y-2">
            <h2 class="font-black text-sm text-slate-900 uppercase">📊 Bảng Công Tác Tháng T${state.selectedMonth}</h2>
            <p class="text-xs text-slate-500">Chuyển sang dạng thẻ Bento gọn gàng, trực quan.</p>
          </div>
        </div>
      `;
    }

    function renderFreeFinderTabHtml() {
      return `
        <div class="flex-1 flex flex-col min-h-0 bg-slate-100 p-4 space-y-3 overflow-y-auto">
          <div class="bento-card p-4 text-center space-y-2">
            <h2 class="font-black text-sm text-slate-900 uppercase">👥 Tra Cứu Người Rảnh</h2>
            <p class="text-xs text-slate-500">Kiểm tra lịch trống của 13 anh em trong team.</p>
          </div>
        </div>
      `;
    }

    function renderCtpTabHtml() {
      return `
        <div class="flex-1 flex flex-col min-h-0 bg-slate-100 p-4 space-y-3 overflow-y-auto">
          <div class="bento-card p-4 text-center space-y-2">
            <h2 class="font-black text-sm text-slate-900 uppercase">💰 Tính Công Tác Phí (CTP)</h2>
            <p class="text-xs text-slate-500">Tổng hợp bill nhanh chóng, hiện đại theo phong cách Bento.</p>
          </div>
        </div>
      `;
    }

    function renderBottomNavHtml() {
      return `
        <nav style="padding-bottom: max(10px, var(--sab));" class="bg-white border-t border-slate-200 px-4 py-2 shrink-0 z-30 flex items-center justify-around shadow-lg">
          <button onclick="appActions.setTab('shows')" class="flex flex-col items-center ${state.activeTab === 'shows' ? 'text-indigo-600 font-extrabold' : 'text-slate-400'}">
            <i class="fa-solid fa-calendar-days text-base"></i><span class="text-[10px] mt-1">Lịch Show</span>
          </button>
          <button onclick="appActions.setTab('matrix')" class="flex flex-col items-center ${state.activeTab === 'matrix' ? 'text-indigo-600 font-extrabold' : 'text-slate-400'}">
            <i class="fa-solid fa-table-cells text-base"></i><span class="text-[10px] mt-1">Công Tác</span>
          </button>
          <button onclick="appActions.setTab('free_finder')" class="flex flex-col items-center ${state.activeTab === 'free_finder' ? 'text-indigo-600 font-extrabold' : 'text-slate-400'}">
            <i class="fa-solid fa-user-check text-base"></i><span class="text-[10px] mt-1">Người Rảnh</span>
          </button>
          <button onclick="appActions.setTab('ctp')" class="flex flex-col items-center ${state.activeTab === 'ctp' ? 'text-indigo-600 font-extrabold' : 'text-slate-400'}">
            <i class="fa-solid fa-file-invoice-dollar text-base"></i><span class="text-[10px] mt-1">Tính CTP</span>
          </button>
          <button onclick="appActions.openGuideModal()" class="flex flex-col items-center text-slate-400">
            <i class="fa-solid fa-gear text-base"></i><span class="text-[10px] mt-1">Cài Đặt</span>
          </button>
        </nav>
      `;
    }

    function renderDetailModalHtml() {
      if (!state.detailShowId) return '';
      const sh = state.shows.find(s => s.id === state.detailShowId);
      if (!sh) return '';
      return `
        <div onclick="appActions.closeShowDetail()" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div onclick="event.stopPropagation()" class="ios-sheet bento-card bg-white w-full max-w-md p-6 space-y-4">
            <div class="flex justify-between items-start border-b border-slate-100 pb-3">
              <div>
                <span class="text-xs font-bold text-indigo-600">STT #${sh.stt}</span>
                <h3 class="text-base font-black text-slate-900 mt-1">📍 ${escapeHtml(sh.location)}</h3>
              </div>
              <button onclick="appActions.closeShowDetail()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-600">Thời gian: <b>${formatDayMonth(sh.startDate)} → ${formatDayMonth(sh.endDate)}</b></p>
            <div class="flex flex-wrap gap-1.5">${(sh.memberIds || []).map(id => renderPillHtml(id, 'sm')).join('')}</div>
          </div>
        </div>
      `;
    }

    function renderFormModalHtml() {
      const f = state.formModal; if (!f) return '';
      return `
        <div onclick="appActions.closeFormModal()" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div onclick="event.stopPropagation()" class="ios-sheet bento-card bg-white w-full max-w-lg p-6 space-y-4 max-h-[90dvh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
              <h3 class="font-black text-sm text-slate-900 uppercase">⚡ NỔ SHOW MỚI</h3>
              <button onclick="appActions.closeFormModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3 text-xs">
              <div>
                <label class="font-bold text-slate-500 block mb-1">Địa điểm show</label>
                <input type="text" value="${escapeHtml(f.location)}" oninput="appActions.updateFormField('location', this.value)" placeholder="Hồ Tràm, Đà Nẵng..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl font-bold" />
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="font-bold text-slate-500 block mb-1">Từ ngày</label>
                  <input type="date" value="${f.startDate}" onchange="appActions.updateFormField('startDate', this.value)" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl font-bold" />
                </div>
                <div>
                  <label class="font-bold text-slate-500 block mb-1">Đến ngày</label>
                  <input type="date" min="${f.startDate}" value="${f.endDate}" onchange="appActions.updateFormField('endDate', this.value)" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl font-bold" />
                </div>
              </div>
              <div class="space-y-1.5">
                <label class="font-bold text-slate-500 block">Chọn nhân sự tham gia</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                  ${state.members.map(m => {
                    const sel = f.memberIds.includes(m.id);
                    return `
                      <div onclick="appActions.toggleFormMember('${m.id}')" class="p-2.5 rounded-xl border cursor-pointer flex items-center justify-between ${sel ? 'bg-slate-900 text-white border-slate-900 font-bold' : 'bg-white text-slate-700 border-slate-200'}">
                        <span class="text-xs">${escapeHtml(m.shortLabel)}</span>
                        <i class="fa-solid ${sel ? 'fa-check text-xs' : 'text-slate-300 fa-circle text-[8px]'}"></i>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
              <button onclick="appActions.saveShowForm()" class="w-full bg-slate-900 text-white font-black py-3.5 rounded-2xl text-xs uppercase tracking-wider shadow-md">Lưu Lịch Show</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderPinModalHtml() {
      if (!state.pinModal) return '';
      return `
        <div onclick="appActions.closePinModal()" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
          <div onclick="event.stopPropagation()" class="bento-card bg-white w-full max-w-sm p-6 space-y-4 text-xs">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
              <h3 class="font-black text-sm text-slate-900">Chọn Tên Nhân Sự</h3>
              <button onclick="appActions.closePinModal()" class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-2 max-h-[50dvh] overflow-y-auto">
              ${state.members.map(m => `<button onclick="appActions.chooseMemberForPin('${m.id}')" class="p-3 rounded-xl border border-slate-200 flex justify-between items-center hover:bg-slate-50">${renderPillHtml(m.id, 'sm')}<i class="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i></button>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderGuideModalHtml() {
      if (!state.guideModal) return '';
      return `
        <div onclick="appActions.closeGuideModal()" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div onclick="event.stopPropagation()" class="ios-sheet bento-card bg-white w-full max-w-md p-6 space-y-4 text-xs">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
              <h3 class="font-black text-sm text-slate-900">Cài Đặt Ứng Dụng</h3>
              <button onclick="appActions.closeGuideModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-slate-600 leading-relaxed">Ứng dụng đang chạy ở chế độ <b>Bento Modern Minimalist</b>, đồng bộ mượt mà trên iPhone và máy tính.</p>
          </div>
        </div>
      `;
    }

    function renderToastHtml() {
      if (!state.toast) return '';
      return `<div class="fixed top-12 left-1/2 -translate-x-1/2 z-50 max-w-xs w-full px-3 pointer-events-none"><div class="p-3 rounded-2xl shadow-xl text-xs font-bold text-white bg-slate-900 flex items-center gap-2.5"><i class="fa-solid fa-circle-check text-emerald-400"></i><span>${escapeHtml(state.toast.message)}</span></div></div>`;
    }

    function renderApp() {
      const root = document.getElementById('app'); if (!root) return;
      let main = '';
      if (state.activeTab === 'shows') main = renderShowsTabHtml();
      else if (state.activeTab === 'matrix') main = renderMatrixTabHtml();
      else if (state.activeTab === 'free_finder') main = renderFreeFinderTabHtml();
      else if (state.activeTab === 'ctp') main = renderCtpTabHtml();

      root.innerHTML = `${renderHeaderHtml()}${main}${renderBottomNavHtml()}${renderDetailModalHtml()}${renderFormModalHtml()}${renderPinModalHtml()}${renderGuideModalHtml()}${renderToastHtml()}`;
    }

    window.state = state;
    renderApp();
    initFirebaseCloud();
  </script>
</body>
</html>
